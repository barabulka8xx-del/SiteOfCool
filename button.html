<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>НЕ НАЖИМАЙ!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0c29;
      background: linear-gradient(to bottom, #240b36, #c31432);
      color: white;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      transition: background 0.5s ease;
      position: relative;
    }

    .container { z-index: 10; position: relative; transition: opacity 1s; }

    h1 {
      font-size: clamp(24px, 6vw, 40px);
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,0,0,0.8);
      transition: all 0.3s ease;
    }

    .btn {
      padding: 24px 48px;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(45deg, #ff0000, #ff4b1f);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.3);
      transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 40px rgba(255,0,0,1), inset 0 0 20px rgba(255,255,255,0.6);
    }

    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-1deg); }
      20%, 80% { transform: translate3d(4px, 0, 0) rotate(1deg); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
      40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.8s ease-out forwards;
    }
    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0) translate(var(--x), var(--y)); opacity: 0; }
    }

    #restart {
      display: none;
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      z-index: 100;
      position: relative;
    }

    /* --- СТИЛИ ДЛЯ КОТИКОВ --- */
    .cat {
      position: absolute;
      top: -50px; /* Начинаем чуть выше экрана */
      font-size: 24px;
      pointer-events: none; /* Чтобы не мешали нажимать кнопку перезапуска */
      animation: fall linear forwards;
      z-index: 50;
      will-change: transform; /* Оптимизация анимации */
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <h1 id="warning-text">Пожалуйста, не нажимай эту кнопку.</h1>
    <button class="btn" id="danger-btn">НЕ НАЖИМАТЬ</button>
  </div>
  
  <a href="button.html" id="restart">Починить всё 🛠️</a>

  <script>
    const btn = document.getElementById('danger-btn');
    const text = document.getElementById('warning-text');
    const body = document.body;
    const restart = document.getElementById('restart');
    const container = document.getElementById('main-container');
    
    let count = 0;

    const messages = [
      "Пожалуйста, не нажимай эту кнопку.",
      "Я же попросил по-хорошему...",
      "Ты уверен, что тебе это нужно?",
      "Ладно, ты сам напросился!",
      "Ой-ой. Кажется, мы что-то сломали.",
      "ОСТАНОВИСЬ! У меня семья!",
      "ЧТО ТЫ НАДЕЛАЛ?!",
      "ПРОБУЖДЕНИЕ СИСТЕМЫ...",
      "💥 СИСТЕМА УНИЧТОЖЕНА 💥"
    ];

    const bgColors = [
      "linear-gradient(to bottom, #240b36, #c31432)",
      "linear-gradient(to bottom, #1f1c2c, #928dab)",
      "linear-gradient(to bottom, #200122, #6f0000)",
      "linear-gradient(to bottom, #000000, #434343)",
      "linear-gradient(to bottom, #ff0000, #000000)",
      "linear-gradient(to bottom, #ff416c, #ff4b2b)",
      "linear-gradient(to bottom, #f12711, #f5af19)",
      "linear-gradient(to bottom, #000000, #ffffff)",
      "#ffffff"
    ];

    function createExplosion(x, y) {
      const colors = ['#ff0000', '#ff4b1f', '#ffff00', '#ff00ff', '#00ffff'];
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 50 + Math.random() * 100;
        p.style.setProperty('--x', Math.cos(angle) * distance + 'px');
        p.style.setProperty('--y', Math.sin(angle) * distance + 'px');
        body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    // ФУНКЦИЯ СПАВНА 100 000 КОТИКОВ
    function spawnCats() {
      const totalCats = 100000;
      const batchSize = 5000; // Создаем по 5000 за раз, чтобы браузер не завис
      let created = 0;
      
      const catIcons = ['🐱', '🐈', '🐈‍⬛', '😺', '😸', '😹', '😻'];

      function createBatch() {
        const fragment = document.createDocumentFragment();
        
        for (let i = 0; i < batchSize; i++) {
          const cat = document.createElement('div');
          cat.className = 'cat';
          cat.innerText = catIcons[Math.floor(Math.random() * catIcons.length)];
          
          // Рандомная позиция по горизонтали и скорость падения
          cat.style.left = Math.random() * 100 + 'vw';
          const fallDuration = 2 + Math.random() * 4; // От 2 до 6 секунд
          cat.style.animationDuration = fallDuration + 's';
          cat.style.animationDelay = Math.random() * 2 + 's'; // Небольшая задержка
          cat.style.fontSize = (16 + Math.random() * 24) + 'px'; // Разный размер

          fragment.appendChild(cat);
        }
        
        body.appendChild(fragment);
        created += batchSize;

        if (created < totalCats) {
          // Запускаем следующую порцию через 50мс
          setTimeout(createBatch, 50);
        }
      }

      createBatch();
    }

    btn.addEventListener('click', (e) => {
      if (navigator.vibrate) navigator.vibrate(count > 5 ? [100, 50, 100, 50, 200] : 50);
      
      createExplosion(e.clientX, e.clientY);

      body.classList.add('shake');
      setTimeout(() => body.classList.remove('shake'), 400);

      count++;

      if (count < messages.length) {
        text.textContent = messages[count];
        body.style.background = bgColors[count];
        
        if (count === 1) btn.textContent = "Всё ещё не жми";
        if (count === 3) btn.textContent = "Точно?";
        if (count === 5) btn.textContent = "ПОСЛЕДНЕЕ КИМАНО";
        if (count === 7) btn.textContent = "ЖМИ ЕСЛИ СМЕЛЫЙ";
        
        if (count > 4) {
           btn.style.transform = `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`;
        }
      }

      // ФИНАЛ
      if (count >= messages.length) {
        btn.style.display = 'none';
        text.textContent = "Ты сломал интернет. Поздравляю! 🏆";
        text.style.color = "#000";
        text.style.textShadow = "none";
        
        // Прячем контейнер с текстом, чтобы не мешал котикам
        container.style.opacity = '0';
        container.style.pointerEvents = 'none';

        // Показываем кнопку перезапуска
        restart.style.display = 'inline-block';

        // ЗАПУСКАЕМ КОТИКОВ
        spawnCats();
      }
    });
  </script>
</body>
</html>
