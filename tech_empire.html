<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 2D UI | Site Of Cool</title>
  <style>
    :root {
      --bg: #080b10; --panel: #111a22; --panel-lighter: #1a2632;
      --border: #2a3b4c; --green: #00ff88; --blue: #4facfe; --purple: #8E2DE2; --red: #ff0055; --gold: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: white; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* --- ШАПКА --- */
    .top-bar { height: 60px; background: var(--panel); border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 10; flex-shrink: 0; }
    .stat-box { display: flex; gap: 15px; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 9px; color: #6c8196; text-transform: uppercase; font-weight: 800; }
    .stat-val { font-size: 14px; font-weight: 900; }
    .stat-val.money { color: var(--green); }
    .stat-val.rp { color: var(--purple); }
    .stat-val.date { color: var(--blue); }

    /* --- ИГРОВОЕ ПОЛЕ (2D ОФИС) --- */
    #game-area { flex: 1; position: relative; background: radial-gradient(circle at top, #101922 0%, #05080a 100%); overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    
    .office-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-lighter); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); }
    .office-level { font-weight: 900; color: var(--gold); }
    .office-slots { font-size: 12px; color: #aaa; }

    .placed-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
    .item-placed { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .item-placed .icon { font-size: 24px; }
    .item-placed .name { font-size: 10px; font-weight: bold; }

    /* --- НИЖНЯЯ ПАНЕЛЬ РАЗРАБОТКИ (DEV PANEL) --- */
    .dev-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 2px solid var(--border); padding: 10px 15px; z-index: 20; display: none; flex-direction: column; gap: 5px; }
    .dev-panel.active { display: flex; }
    .dev-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
    .progress-bg { width: 100%; height: 10px; background: #000; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }
    .bug-fill { background: var(--red); }
    .dev-stats { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; }
    .btn-dev { background: var(--green); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 900; width: 100%; margin-top: 5px; display: none; }

    /* --- МЕНЮ СТРОЙКИ (BUILD MENU) --- */
    .build-menu { background: var(--panel); border-top: 2px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
    .build-tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); }
    .build-tabs::-webkit-scrollbar { display: none; }
    .b-tab { background: transparent; border: none; color: #6c8196; padding: 12px 15px; font-weight: 900; font-size: 12px; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; }
    .b-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    
    .build-items { display: flex; overflow-x: auto; gap: 10px; padding: 15px; background: #0a0f14; }
    .build-items::-webkit-scrollbar { display: none; }
    .b-item { flex-shrink: 0; width: 100px; background: var(--panel-lighter); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; overflow: hidden; }
    .b-item:active { transform: scale(0.95); border-color: var(--green); }
    .b-item .icon { font-size: 30px; margin-bottom: 5px; }
    .b-item .title { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 3px; }
    .b-item .price { font-size: 11px; font-weight: 900; color: var(--gold); }
    .b-item .buy-btn { background: var(--blue); color: #000; padding: 4px; width: 100%; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 5px; text-align: center; }

    /* --- ВЕРХНИЕ КНОПКИ (ДИЗАЙН) --- */
    .top-actions { display: flex; gap: 10px; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .btn-action { flex: 1; background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(142,45,226,0.4); text-align: center; }

    /* --- МОДАЛКИ --- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--panel); border: 2px solid var(--blue); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 900; text-align: center; }
    
    /* Студия дизайна */
    .ds-step-info { font-size: 12px; color: var(--blue); font-weight: bold; text-align: center; }
    .ds-option { background: #0a0f14; border: 1px solid var(--border); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; cursor: pointer; font-size: 14px; font-weight: bold; }
    .ds-option:active { border-color: var(--green); background: rgba(0,255,136,0.05); }
    .ds-price { color: var(--gold); }
    
    /* Результаты */
    .result-score { font-size: 60px; color: var(--gold); text-align: center; font-weight: 900; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
    
    /* Тост */
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--panel); border: 1px solid var(--green); padding: 10px 20px; border-radius: 20px; font-weight: bold; color: var(--green); z-index: 200; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; width: 80%; max-width: 300px; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="stat-box">
      <div class="stat"><span class="stat-label">Баланс</span><span class="stat-val money" id="ui-money">$200,000</span></div>
      <div class="stat"><span class="stat-label">Исследования</span><span class="stat-val rp" id="ui-rp">0 RP</span></div>
    </div>
    <div class="stat"><span class="stat-label">Дата</span><span class="stat-val date" id="ui-date">1 Янв, 2007</span></div>
  </div>

  <div class="top-actions">
    <button class="btn-action" onclick="openDesignStudio()">🎨 Студия Дизайна</button>
  </div>

  <!-- 2D ОФИС (Визуализация) -->
  <div id="game-area">
    <div class="office-header">
      <div class="office-level" id="ui-office-name">Гараж</div>
      <div class="office-slots" id="ui-slots">0 / 5 предметов</div>
      <button class="btn-buy" style="padding:5px 10px; font-size:10px;" onclick="upgradeOffice()">Улучшить офис</button>
    </div>
    <div class="placed-items" id="placed-items">
      <!-- Здесь будут отображаться купленные столы/стулья -->
    </div>

    <!-- ПАНЕЛЬ РАЗРАБОТКИ (Внизу офиса) -->
    <div class="dev-panel" id="dev-panel">
      <div class="dev-header"><span id="dev-title">Разработка...</span><span id="dev-percent">0%</span></div>
      <div class="progress-bg"><div class="progress-fill" id="dev-bar"></div></div>
      <div class="dev-stats"><span>Качество: <span id="dev-quality" style="color:var(--green)">0</span></span><span>Ошибки: <span id="dev-bugs" style="color:var(--red)">0</span></span></div>
      <button class="btn-dev" id="btn-finish-dev" onclick="launchDevice()">Запустить в продажу 🚀</button>
    </div>
  </div>

  <!-- МЕНЮ СТРОЙКИ -->
  <div class="build-menu">
    <div class="build-tabs">
      <button class="b-tab active" id="tab-desks" onclick="switchBuildTab('desks')">🪑 Столы</button>
      <button class="b-tab" id="tab-chairs" onclick="switchBuildTab('chairs')">🪑 Стулья</button>
      <button class="b-tab" id="tab-pcs" onclick="switchBuildTab('pcs')">💻 Компьютеры</button>
      <button class="b-tab" id="tab-lab" onclick="switchBuildTab('lab')">🔬 Лаборатория</button>
      <button class="b-tab" id="tab-rest" onclick="switchBuildTab('rest')">☕ Зона отдыха</button>
    </div>
    <div class="build-items" id="build-items">
      <!-- Предметы будут генерироваться через JS -->
    </div>
  </div>

  <!-- МОДАЛКА ДИЗАЙНА -->
  <div class="modal-overlay" id="design-modal">
    <div class="modal-box">
      <div class="modal-title" id="ds-title">Шаг 1. Устройство</div>
      <div class="ds-step-info" id="ds-step-info">1 из 13</div>
      <div id="ds-options" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button class="btn-buy" style="width:100%; background:#444; color:#fff; margin-top:10px;" onclick="document.getElementById('design-modal').classList.remove('active')">Отмена</button>
    </div>
  </div>

  <!-- МОДАЛКА РЕЗУЛЬТАТОВ -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-box" style="text-align:center; border-color: var(--gold);">
      <div class="result-score" id="res-score">9.5</div>
      <div style="font-size:14px; color:#aaa; margin-bottom:15px;">Оценка критиков</div>
      <div style="font-size:20px; font-weight:900; color:var(--green); margin-bottom:20px;" id="res-profit">+$15,000,000</div>
      <button class="btn-buy" style="width:100%;" onclick="closeResult()">Забрать деньги</button>
    </div>
  </div>

  <div class="toast" id="toast">Уведомление</div>

  <script>
  // --- 1. СОСТОЯНИЕ И ДАННЫЕ ---
let state = {
    money: 200000,
    rp: 0,
    date: "1 Янв, 2007",
    officeLvl: 0,
    placedItems: [],
    staff: { researchers: 0, fixers: 0 },
    currentDesign: { quality: 0, cost: 0 },
    dev: { active: false, progress: 0, bugs: 0 }
};

const OFFICES = [
    { name: "Гараж", slots: 5, upgradeCost: 500000 },
    { name: "Небольшой офис", slots: 10, upgradeCost: 2000000 },
    { name: "Этаж офиса", slots: 15, upgradeCost: 10000000 },
    { name: "Студия", slots: 25, upgradeCost: 50000000 },
    { name: "Штаб-квартира", slots: 40, upgradeCost: -1 } // Максимум
];

const BUILD_ITEMS = {
    desks: [
        { id: 'desk_1', name: 'Старый стол', price: 12000, icon: '🪵', quality: 1 },
        { id: 'desk_2', name: 'Рабочий стол', price: 50000, icon: '🪑', quality: 3 },
        { id: 'desk_3', name: 'Стеклянный стол', price: 1500000, icon: '🖥️', quality: 6 }
    ],
    chairs: [
        { id: 'chair_1', name: 'Табурет', price: 0, icon: '🪑', quality: 0 },
        { id: 'chair_2', name: 'Кресло', price: 20000, icon: '💺', quality: 2 },
        { id: 'chair_3', name: 'Игровое кресло', price: 80000, icon: '👑', quality: 4 }
    ],
    pcs: [
        { id: 'pc_1', name: 'ЭЛТ монитор', price: 0, icon: '🖥️', quality: 0 },
        { id: 'pc_2', name: 'Плоский монитор', price: 15000, icon: '📺', quality: 2 },
        { id: 'pc_3', name: 'Два монитора', price: 45000, icon: '🖥️🖥️', quality: 4 }
    ],
    lab: [
        { id: 'lab_1', name: 'Тестовая плата', price: 50000, icon: '🔬', quality: 2 },
        { id: 'lab_2', name: 'Серверные стойки', price: 240000, icon: '🖧', quality: 5 }
    ],
    rest: [
        { id: 'rest_1', name: 'Кулер', price: 1500, icon: '🚰', quality: 1 },
        { id: 'rest_2', name: 'Кофемашина', price: 3000, icon: '☕', quality: 2 },
        { id: 'rest_3', name: 'Диван', price: 6000, icon: '🛋️', quality: 3 }
    ]
};

let currentTab = 'desks';
let currentStep = 1;

// 13 шагов дизайна
const designSteps = [
    { id: 'type', title: "Шаг 1. Устройство", options: [{name: "Телефон", cost: 0, q: 1}, {name: "Планшет", cost: 10000, q: 2}] },
    { id: 'body', title: "Шаг 2. Шасси", options: [{name: "Пластик", cost: 0, q: 0}, {name: "Стекло", cost: 5000, q: 1}, {name: "Титан", cost: 20000, q: 3}] },
    { id: 'size', title: "Шаг 3. Размер", options: [{name: "3.5 дюйма", cost: 0, q: 0}, {name: "5.5 дюймов", cost: 5000, q: 1}, {name: "6.7 дюймов", cost: 15000, q: 2}] },
    { id: 'res', title: "Шаг 4. Разрешение", options: [{name: "240p", cost: 0, q: 0}, {name: "720p", cost: 10000, q: 2}, {name: "1080p", cost: 30000, q: 4}] },
    { id: 'tech', title: "Шаг 5. Экран", options: [{name: "LCD", cost: 0, q: 0}, {name: "OLED", cost: 20000, q: 3}] },
    { id: 'front_cam', title: "Шаг 6. Селфи", options: [{name: "Нет", cost: 0, q: 0}, {name: "2 МП", cost: 2000, q: 1}, {name: "12 МП", cost: 15000, q: 3}] },
    { id: 'rear_cam', title: "Шаг 7. Камера", options: [{name: "2 МП", cost: 0, q: 0}, {name: "12 МП", cost: 10000, q: 2}, {name: "108 МП", cost: 40000, q: 5}] },
    { id: 'port', title: "Шаг 8. Порт", options: [{name: "Micro-USB", cost: 0, q: 0}, {name: "USB-C", cost: 5000, q: 2}] },
    { id: 'cpu', title: "Шаг 9. Процессор", options: [{name: "Слабый", cost: 0, q: 0}, {name: "Средний", cost: 15000, q: 2}, {name: "Мощный", cost: 50000, q: 5}] },
    { id: 'ram', title: "Шаг 10. Память", options: [{name: "1 ГБ", cost: 0, q: 0}, {name: "4 ГБ", cost: 10000, q: 2}, {name: "8 ГБ", cost: 25000, q: 4}] },
    { id: 'battery', title: "Шаг 11. Батарея", options: [{name: "2000 мАч", cost: 0, q: 0}, {name: "4000 мАч", cost: 8000, q: 2}, {name: "6000 мАч", cost: 20000, q: 4}] },
    { id: 'features', title: "Шаг 12. Фишки", options: [{name: "Нет", cost: 0, q: 0}, {name: "NFC + GPS", cost: 15000, q: 3}] },
    { id: 'color', title: "Шаг 13. Цвет", options: [{name: "Черный", cost: 0, q: 0}, {name: "Белый", cost: 0, q: 0}, {name: "Неоновый", cost: 10000, q: 2}, {name: "Радужный", cost: 50000, q: 5}] }
];

// --- 2. ИНИЦИАЛИЗАЦИЯ И UI ---
window.onload = () => {
    loadSave();
    updateUI();
    renderBuildMenu();
    startGameLoop();
};

function updateUI() {
    document.getElementById('ui-money').innerText = '$' + Math.floor(state.money).toLocaleString('ru-RU');
    document.getElementById('ui-rp').innerText = Math.floor(state.rp).toLocaleString('ru-RU') + ' RP';
    document.getElementById('ui-date').innerText = state.date;
    
    const office = OFFICES[state.officeLvl];
    document.getElementById('ui-office-name').innerText = office.name;
    document.getElementById('ui-slots').innerText = `${state.placedItems.length} / ${office.slots} предметов`;
    
    renderPlacedItems();
}

function renderPlacedItems() {
    const container = document.getElementById('placed-items');
    container.innerHTML = '';
    
    if (state.placedItems.length === 0) {
        container.innerHTML = '<div style="color:#666; grid-column: 1/-1; text-align:center; padding: 20px;">Офис пуст. Купи что-нибудь снизу!</div>';
        return;
    }

    state.placedItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item-placed';
        el.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
        container.appendChild(el);
    });
}

function switchBuildTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.b-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderBuildMenu();
}

function renderBuildMenu() {
    const container = document.getElementById('build-items');
    container.innerHTML = '';
    
    BUILD_ITEMS[currentTab].forEach(item => {
        const el = document.createElement('div');
        el.className = 'b-item';
        el.onclick = () => buyItem(item);
        el.innerHTML = `
            <div class="icon">${item.icon}</div>
            <div class="title">${item.name}</div>
            <div class="price">${item.price === 0 ? 'Бесплатно' : '$' + item.price.toLocaleString()}</div>
            <div class="buy-btn">Купить</div>
        `;
        container.appendChild(el);
    });
}

function buyItem(item) {
    if (state.money < item.price) { showToast("Мало денег!"); return; }
    if (state.placedItems.length >= OFFICES[state.officeLvl].slots) { showToast("Офис переполнен! Улучшите офис."); return; }
    
    state.money -= item.price;
    state.placedItems.push(item);
    updateUI();
    save();
    showToast(`Куплено: ${item.name}`);
}

function upgradeOffice() {
    if (state.officeLvl >= OFFICES.length - 1) { showToast("У вас максимальный офис!"); return; }
    const cost = OFFICES[state.officeLvl].upgradeCost;
    if (state.money < cost) { showToast("Недостаточно денег для переезда!"); return; }
    
    state.money -= cost;
    state.officeLvl++;
    updateUI();
    save();
    showToast(`Переезд в: ${OFFICES[state.officeLvl].name}!`);
}

// --- 3. НАЙМ (Меню команды через динамический HTML) ---
function openTeamMenu() {
    if(!document.getElementById('team-modal')) {
        const html = `
        <div class="modal-overlay" id="team-modal">
            <div class="modal-box">
                <div class="modal-title">Найм сотрудников</div>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn-buy" style="flex:1;" onclick="hire('researcher')">🔬 Исследователь<br>($5K)</button>
                    <button class="btn-buy" style="flex:1; background:var(--red); color:#fff;" onclick="hire('fixer')">🔧 Фиксер<br>($5K)</button>
                </div>
                <div style="font-size:12px; color:#aaa; text-align:center; margin-bottom:10px;">
                    Исследователи: <span style="color:var(--blue); font-weight:bold;">${state.staff.researchers}</span> | 
                    Фиксеры: <span style="color:var(--red); font-weight:bold;">${state.staff.fixers}</span>
                </div>
                <button class="btn-buy" style="width:100%; background:#444; color:#fff;" onclick="document.getElementById('team-modal').classList.remove('active')">Закрыть</button>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
    }
    // Обновляем счетчики в модалке
    document.querySelector('#team-modal div[style*="font-size:12px"]').innerHTML = `Исследователи: <span style="color:var(--blue); font-weight:bold;">${state.staff.researchers}</span> | Фиксеры: <span style="color:var(--red); font-weight:bold;">${state.staff.fixers}</span>`;
    document.getElementById('team-modal').classList.add('active');
}

function hire(type) {
    if (state.money < 5000) { showToast("Мало денег на зарплату!"); return; }
    state.money -= 5000;
    if(type === 'researcher') state.staff.researchers++;
    else state.staff.fixers++;
    updateUI(); save();
    showToast(type === 'researcher' ? "Исследователь нанят!" : "Фиксер нанят!");
    
    // Обновляем текст в открытой модалке
    document.querySelector('#team-modal div[style*="font-size:12px"]').innerHTML = `Исследователи: <span style="color:var(--blue); font-weight:bold;">${state.staff.researchers}</span> | Фиксеры: <span style="color:var(--red); font-weight:bold;">${state.staff.fixers}</span>`;
}

// --- 4. ДИЗАЙН (13 ШАГОВ) ---
function openDesignStudio() {
    if (state.dev.active) { showToast("Сначала завершите текущую разработку!"); return; }
    currentStep = 1;
    state.currentDesign = { quality: 0, cost: 0 };
    document.getElementById('design-modal').classList.add('active');
    renderDesignStep();
}

function renderDesignStep() {
    if (currentStep > designSteps.length) {
        // Завершение дизайна
        if (state.money < state.currentDesign.cost) {
            showToast("Не хватает денег на детали!");
            currentStep--;
            return;
        }
        state.money -= state.currentDesign.cost;
        document.getElementById('design-modal').classList.remove('active');
        startDevPhase();
        return;
    }

    const step = designSteps[currentStep - 1];
    document.getElementById('ds-title').innerText = step.title;
    document.getElementById('ds-step-info').innerText = `Шаг ${currentStep} из ${designSteps.length}`;
    
    const opts = document.getElementById('ds-options');
    opts.innerHTML = '';
    step.options.forEach(o => {
        let el = document.createElement('div');
        el.className = 'ds-option';
        el.innerHTML = `<span>${o.name}</span><span class="ds-price">${o.cost === 0 ? 'Бесплатно' : '+$'+o.cost}</span>`;
        el.onclick = () => {
            state.currentDesign.cost += o.cost;
            state.currentDesign.quality += o.q;
            currentStep++;
            renderDesignStep();
            updateUI();
        };
        opts.appendChild(el);
    });
}

// --- 5. ПРОЦЕСС СБОРКИ (DEV PANEL) ---
function startDevPhase() {
    state.dev = { active: true, progress: 0, bugs: 0 };
    document.getElementById('dev-panel').classList.add('active');
    document.getElementById('btn-finish-dev').style.display = 'none';
    document.getElementById('dev-title').innerText = "Разработка...";
    document.getElementById('dev-panel').style.borderColor = "var(--blue)";
    updateDevUI();
}

function updateDevUI() {
    document.getElementById('dev-percent').innerText = Math.floor(state.dev.progress) + '%';
    document.getElementById('dev-bar').style.width = state.dev.progress + '%';
    document.getElementById('dev-quality').innerText = state.currentDesign.quality;
    document.getElementById('dev-bugs').innerText = Math.floor(state.dev.bugs);
    document.getElementById('dev-bugs').style.color = state.dev.bugs > 0 ? 'var(--red)' : 'var(--green)';
}

function startGameLoop() {
    setInterval(() => {
        // Пассивный доход от RP
        if (state.rp > 0) state.money += state.rp * 0.5;
        
        // Логика разработки
        if (state.dev.active) {
            // Прогресс от исследователей
            if (state.staff.researchers > 0) {
                state.dev.progress += state.staff.researchers * 2;
            }
            if (state.dev.progress > 100) state.dev.progress = 100;

            // Генерация багов (если прогресс идет)
            if (state.dev.progress > 0 && state.dev.progress < 100) {
                if (Math.random() < 0.3) {
                    state.dev.bugs += Math.max(1, state.staff.researchers * 2);
                }
            }

            // Починка багов фиксерами
            if (state.dev.bugs > 0 && state.staff.fixers > 0) {
                state.dev.bugs -= state.staff.fixers * 3;
            }
            if (state.dev.bugs < 0) state.dev.bugs = 0;

            updateDevUI();

            // Проверка на завершение
            if (state.dev.progress >= 100 && state.dev.bugs <= 0) {
                document.getElementById('dev-title').innerText = "Готово к запуску!";
                document.getElementById('btn-finish-dev').style.display = 'block';
                document.getElementById('dev-panel').style.borderColor = "var(--green)";
            }
        }
        
        updateUI();
    }, 1000);
}

function launchDevice() {
    if (!state.dev.active) return;
    state.dev.active = false;
    document.getElementById('dev-panel').classList.remove('active');
    
    // Расчет оценки
    let maxPossibleQ = 45; // Примерная максимальная оценка качества
    let baseScore = 5 + (state.currentDesign.quality / maxPossibleQ) * 5;
    let score = Math.min(9.9, baseScore + (Math.random() * 1.5 - 0.5)).toFixed(1);
    
    let profit = Math.floor(score * 5000000) + (state.currentDesign.quality * 100000);
    state.money += profit;
    
    document.getElementById('res-score').innerText = score;
    document.getElementById('res-profit').innerText = '+$' + profit.toLocaleString('ru-RU');
    document.getElementById('result-modal').classList.add('active');
    
    updateUI();
    save();
}

function closeResult() {
    document.getElementById('result-modal').classList.remove('active');
    state.currentDesign = { quality: 0, cost: 0 };
}

// --- 6. ВСПОМОГАТЕЛЬНЫЕ ---
function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function save() {
    localStorage.setItem('tech_empire_final', JSON.stringify(state));
}

function loadSave() {
    const saved = localStorage.getItem('tech_empire_final');
    if (saved) {
        try { state = JSON.parse(saved); } catch(e) {}
    }
    // Добавляем кнопку Команды, если её нет
    if (!document.getElementById('btn-team-action')) {
        const btnHTML = `<button class="btn-action" id="btn-team-action" onclick="openTeamMenu()" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">👥 Найм Команды</button>`;
        document.querySelector('.top-actions').insertAdjacentHTML('beforeend', btnHTML);
    }
    }
  </script>
