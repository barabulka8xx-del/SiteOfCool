<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 3D | Site Of Cool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080b10; color: white; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* --- ШАПКА --- */
    .top-bar { height: 65px; background: #111a22; border-bottom: 2px solid #1f2d3d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .stat-box { display: flex; gap: 15px; align-items: center; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 10px; color: #6c8196; text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 15px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .stat-val.rp { color: #8E2DE2; text-shadow: 0 0 10px rgba(142,45,226,0.3); }

    /* --- 3D КАНВАС --- */
    #game-container { flex: 1; position: relative; outline: none; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }

    /* --- НИЖНЯЯ ПАНЕЛЬ (UI) --- */
    .bottom-bar { height: 65px; background: #111a22; border-top: 2px solid #1f2d3d; display: flex; justify-content: center; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .main-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 5px 20px rgba(79,172,254,0.4); }
    .main-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="top-bar">
    <div class="stat-box">
      <div class="stat">
        <span class="stat-label">Баланс</span>
        <span class="stat-val" id="ui-money">$200,000</span>
      </div>
      <div class="stat">
        <span class="stat-label">Исследования</span>
        <span class="stat-val rp" id="ui-rp">0 RP</span>
      </div>
    </div>
  </div>

  <!-- СЮДА РЕНДЕРИТСЯ 3D -->
  <div id="game-container"></div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="bottom-bar">
    <button class="main-btn" onclick="alert('Режим стройки в следующей части!')">
      🛠 Стройка
    </button>
  </div>

  <!-- ПОДКЛЮЧАЕМ THREE.JS И ORBIT CONTROLS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- НАСТРОЙКИ СЦЕНЫ ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b10);
    // Туман для глубины
    scene.fog = new THREE.Fog(0x080b10, 15, 40);

    // --- КАМЕРА ---
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(12, 12, 12);

    // --- РЕНДЕРЕР ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Оптимизация для мобилок
    renderer.shadowMap.enabled = true; // Включаем тени
    container.appendChild(renderer.domElement);

    // --- УПРАВЛЕНИЕ КАМЕРОЙ (Мышь/Тач) ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Плавность
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.1; // Запрещаем камере уходить под пол
    controls.minDistance = 5;
    controls.maxDistance = 25;
    controls.target.set(0, 0, 0);

    // --- ОСВЕЩЕНИЕ ---
    // Базовый свет
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    // Направленный свет (как лампа сверху)
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 15, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Неоновая подсветка (синяя)
    const pointLight = new THREE.PointLight(0x4facfe, 1, 20);
    pointLight.position.set(-5, 5, -5);
    scene.add(pointLight);

    // --- ПОЛ (СЕТКА 10х10) ---
    // Размер комнаты: 10x10, клетка: 1x1
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x0d151c, 
        roughness: 0.8,
        metalness: 0.2
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2; // Кладем пол горизонтально
    floor.receiveShadow = true;
    scene.add(floor);

    // Визуальная сетка поверх пола
    const gridHelper = new THREE.GridHelper(10, 10, 0x4facfe, 0x1f2d3d);
    gridHelper.position.y = 0.01; // Чуть выше пола, чтобы не было мерцания
    scene.add(gridHelper);

    // --- СТЕНЫ ---
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x111a22, roughness: 1 });
    
    // Задняя стена (ось Z)
    const wallBack = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.2), wallMat);
    wallBack.position.set(0, 1.5, -5);
    wallBack.receiveShadow = true;
    wallBack.castShadow = true;
    scene.add(wallBack);

    // Левая стена (ось X)
    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 10), wallMat);
    wallLeft.position.set(-5, 1.5, 0);
    wallLeft.receiveShadow = true;
    wallLeft.castShadow = true;
    scene.add(wallLeft);

    // Окно на задней стене (Светящийся прямоугольник)
    const windowMat = new THREE.MeshBasicMaterial({ color: 0x4facfe }); // MeshBasicMaterial не зависит от света
    const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 0.1), windowMat);
    windowMesh.position.set(0, 1.8, -4.88); // Чуть впереди стены
    scene.add(windowMesh);

    // --- РАМКА ОКНА ---
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    const frame = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.7, 0.2), frameMat);
    frame.position.set(0, 1.8, -4.9);
    scene.add(frame);


    // --- АДАПТИВНОСТЬ ---
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- АНИМАЦИОННЫЙ ЦИКЛ ---
    function animate() {
        requestAnimationFrame(animate);
        controls.update(); // Обновляем позицию камеры
        renderer.render(scene, camera);
    }

    animate();

    // --- ТЕСТ: СОЗДАДИМ КУБИК (Заглушка для будущего стола) ---
    // Просто чтобы ты увидел, что 3D работает и тени падают
    const testBoxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const testBoxMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
    const testBox = new THREE.Mesh(testBoxGeo, testBoxMat);
    testBox.position.set(0, 0.4, 0);
    testBox.castShadow = true;
    testBox.receiveShadow = true;
    scene.add(testBox);

  </script>
</body>
</html>
