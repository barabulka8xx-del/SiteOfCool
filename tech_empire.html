<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 2D UI v2 | Site Of Cool</title>
  <style>
    :root {
      --bg: #080b10; --panel: #111a22; --panel-lighter: #1a2632;
      --border: #2a3b4c; --green: #00ff88; --blue: #4facfe; --purple: #8E2DE2; --red: #ff0055; --gold: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: white; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ШАПКА */
    .top-bar { height: 60px; background: var(--panel); border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 10; flex-shrink: 0; }
    .stat-box { display: flex; gap: 15px; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 9px; color: #6c8196; text-transform: uppercase; font-weight: 800; }
    .stat-val { font-size: 14px; font-weight: 900; }
    .stat-val.money { color: var(--green); }
    .stat-val.rp { color: var(--purple); }
    .stat-val.date { color: var(--blue); }

    /* ЭКРАНЫ */
    .screen { flex: 1; position: relative; overflow-y: auto; display: none; flex-direction: column; }
    .screen.active { display: flex; }

    /* ГЛАВНЫЙ ОФИС */
    .office-view { padding: 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; }
    .office-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-lighter); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); }
    .office-level { font-weight: 900; color: var(--gold); }
    .office-slots { font-size: 12px; color: #aaa; }
    
    .placed-area { display: flex; flex-wrap: wrap; gap: 10px; }
    .placed-workstation { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; width: 90px; display: flex; flex-direction: column; align-items: center; position: relative; }
    .placed-workstation .desk-ico { font-size: 30px; }
    .placed-workstation .chair-ico { position: absolute; bottom: -5px; right: 5px; font-size: 16px; }
    .placed-workstation .pc-ico { position: absolute; top: -5px; left: 5px; font-size: 16px; }
    .placed-workstation .name { font-size: 9px; font-weight: bold; text-align: center; margin-top: 5px; }

    /* МЕНЮ СТРОЙКИ (КАК НА СКРИНШОТАХ) */
    .build-menu { background: var(--panel); border-top: 2px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
    .build-tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); background: #0a0f14; }
    .build-tabs::-webkit-scrollbar { display: none; }
    .b-tab { background: transparent; border: none; color: #6c8196; padding: 10px 15px; font-weight: 900; font-size: 11px; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; }
    .b-tab.active { color: var(--blue); border-bottom-color: var(--blue); background: rgba(79, 172, 254, 0.1); }
    
    .build-items { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; background: #0a0f14; }
    .build-items::-webkit-scrollbar { display: none; }
    .b-item { flex-shrink: 0; width: 90px; background: var(--panel-lighter); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
    .b-item:active { transform: scale(0.95); border-color: var(--green); }
    .b-item .icon { font-size: 24px; margin-bottom: 5px; }
    .b-item .title { font-size: 9px; font-weight: bold; text-align: center; margin-bottom: 3px; }
    .b-item .price { font-size: 10px; font-weight: 900; color: var(--gold); }

    /* ПАНЕЛЬ РАЗРАБОТКИ */
    .dev-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 2px solid var(--border); padding: 10px 15px; z-index: 30; display: none; flex-direction: column; gap: 5px; }
    .dev-panel.active { display: flex; }
    .progress-bg { width: 100%; height: 8px; background: #000; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }
    .bug-fill { background: var(--red); }

    /* ДИЗАЙН-СТУДИЯ (ПОЛНОЭКРАННАЯ) */
    .design-screen { position: fixed; inset: 0; background: #060a0f; z-index: 100; display: none; flex-direction: column; }
    .design-screen.active { display: flex; }
    .ds-header { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }
    .ds-body { flex: 1; display: flex; }
    .ds-left { flex: 1; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #101922 0%, #060a0f 100%); position: relative; }
    .ds-phone-preview { width: 150px; height: 300px; border: 4px solid #333; border-radius: 20px; background: #111; position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 20px; box-shadow: 0 0 50px rgba(79,172,254,0.2); }
    .ds-phone-screen { width: 90%; height: 80%; background: #0a0f14; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 40px; }
    
    .ds-right { width: 50%; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .ds-step-header { padding: 15px; border-bottom: 1px solid var(--border); }
    .ds-step-title { font-size: 18px; font-weight: 900; margin-bottom: 5px; }
    .ds-step-desc { font-size: 11px; color: #aaa; }
    .ds-options { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
    .ds-option { background: var(--panel-lighter); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .ds-option:active { border-color: var(--blue); }
    .ds-opt-name { font-size: 13px; font-weight: bold; }
    .ds-opt-price { font-size: 12px; color: var(--gold); font-weight: 900; }
    
    .ds-footer { padding: 15px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; background: #0a0f14; }
    .btn-nav { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    .btn-next { background: var(--blue); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; }

    /* УВЕДОМЛЕНИЯ */
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--panel); border: 1px solid var(--green); padding: 10px 20px; border-radius: 20px; font-weight: bold; color: var(--green); z-index: 2000; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; width: 80%; max-width: 300px; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* КНОПКИ ВВЕРХУ */
    .top-actions { display: flex; gap: 10px; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .btn-action { flex: 1; background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="stat-box">
      <div class="stat"><span class="stat-label">Баланс</span><span class="stat-val money" id="ui-money">$200,000</span></div>
      <div class="stat"><span class="stat-label">Исследования</span><span class="stat-val rp" id="ui-rp">0 RP</span></div>
    </div>
    <div class="stat"><span class="stat-label">Дата</span><span class="stat-val date" id="ui-date">1 Янв, 2007</span></div>
  </div>

  <div class="top-actions">
    <button class="btn-action" onclick="openTeamMenu()" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">👥 Найм</button>
    <button class="btn-action" onclick="openDesignStudio()">🎨 Дизайн</button>
  </div>

  <!-- ЭКРАН ОФИСА -->
  <div class="screen active" id="screen-office">
    <div class="office-view">
      <div class="office-header">
        <div class="office-level" id="ui-office-name">Гараж</div>
        <div class="office-slots" id="ui-slots">0 / 5</div>
        <button class="btn-buy" style="padding:5px 10px; font-size:10px;" onclick="upgradeOffice()">Улучшить</button>
      </div>
      <div class="placed-area" id="placed-items"></div>
    </div>
    
    <!-- ПАНЕЛЬ СБОРКИ (Прячется за меню) -->
    <div class="dev-panel" id="dev-panel">
      <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold;"><span id="dev-title">Разработка...</span><span id="dev-percent">0%</span></div>
      <div class="progress-bg"><div class="progress-fill" id="dev-bar"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:#aaa; margin-bottom:5px;"><span>Качество: <span id="dev-quality" style="color:var(--green)">0</span></span><span>Ошибки: <span id="dev-bugs" style="color:var(--red)">0</span></span></div>
      <button class="btn-buy" id="btn-finish-dev" onclick="launchDevice()" style="display:none; width:100%; background:var(--green);">Запустить 🚀</button>
    </div>
  </div>

  <!-- МЕНЮ СТРОЙКИ -->
  <div class="build-menu">
    <div class="build-tabs">
      <button class="b-tab active" id="tab-desks" onclick="switchBuildTab('desks')">Рабочие столы</button>
      <button class="b-tab" id="tab-chairs" onclick="switchBuildTab('chairs')">Стулья</button>
      <button class="b-tab" id="tab-pcs" onclick="switchBuildTab('pcs')">Компьютеры</button>
    </div>
    <div class="build-items" id="build-items"></div>
  </div>

  <!-- ДИЗАЙН-СТУДИЯ (ПОЛНОЭКРАННАЯ) -->
  <div class="design-screen" id="design-screen">
    <div class="ds-header">
      <div style="font-weight:900; font-size:16px;">Студия Дизайна</div>
      <button class="btn-nav" style="padding:6px 12px;" onclick="closeDesignStudio()">В офис</button>
    </div>
    <div class="ds-body">
      <div class="ds-left">
        <div class="ds-phone-preview">
          <div class="ds-phone-screen" id="ds-phone-emoji">📱</div>
        </div>
      </div>
      <div class="ds-right">
        <div class="ds-step-header">
          <div class="ds-step-title" id="ds-title">Шаг 1</div>
          <div class="ds-step-desc" id="ds-step-info">1 из 13</div>
        </div>
        <div class="ds-options" id="ds-options"></div>
        <div class="ds-footer">
          <button class="btn-nav" onclick="prevDesignStep()">Назад</button>
          <button class="btn-next" onclick="nextDesignStep()">Далее</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Уведомление</div>

  <script>
  // --- 1. СОСТОЯНИЕ ---
let state = {
    money: 200000,
    rp: 0,
    date: "1 Янв, 2007",
    officeLvl: 0,
    workstations: [], // { desk: {...}, chair: null, pc: null }
    staff: { researchers: 0, fixers: 0 },
    currentDesign: { quality: 0, cost: 0 },
    dev: { active: false, progress: 0, bugs: 0 }
};

const OFFICES = [
    { name: "Гараж", slots: 3, upgradeCost: 500000 },
    { name: "Небольшой офис", slots: 6, upgradeCost: 2000000 },
    { name: "Этаж офиса", slots: 10, upgradeCost: 10000000 }
];

const BUILD_ITEMS = {
    desks: [
        { id: 'desk_1', name: 'Старый стол', price: 12000, icon: '🪵', quality: 1 },
        { id: 'desk_2', name: 'Рабочий стол', price: 50000, icon: '🪑', quality: 3 },
        { id: 'desk_3', name: 'Стеклянный', price: 150000, icon: '🖥️', quality: 6 }
    ],
    chairs: [
        { id: 'chair_1', name: 'Табурет', price: 2000, icon: '🪑', quality: 0 },
        { id: 'chair_2', name: 'Кресло', price: 20000, icon: '💺', quality: 2 },
        { id: 'chair_3', name: 'Игровое', price: 80000, icon: '👑', quality: 4 }
    ],
    pcs: [
        { id: 'pc_1', name: 'ЭЛТ', price: 5000, icon: '🖥️', quality: 0 },
        { id: 'pc_2', name: 'Плоский', price: 15000, icon: '📺', quality: 2 },
        { id: 'pc_3', name: 'Два монитора', price: 45000, icon: '🖥️🖥️', quality: 4 }
    ]
};

let currentTab = 'desks';
let currentStep = 1;

const designSteps = [
    { id: 'type', title: "Шаг 1. Устройство", options: [{name: "Телефон", cost: 0, q: 1}, {name: "Планшет", cost: 10000, q: 2}] },
    { id: 'body', title: "Шаг 2. Шасси", options: [{name: "Пластик", cost: 0, q: 0}, {name: "Стекло", cost: 5000, q: 1}, {name: "Титан", cost: 20000, q: 3}] },
    { id: 'size', title: "Шаг 3. Размер", options: [{name: "3.5\"", cost: 0, q: 0}, {name: "5.5\"", cost: 5000, q: 1}, {name: "6.7\"", cost: 15000, q: 2}] },
    { id: 'res', title: "Шаг 4. Разрешение", options: [{name: "240p", cost: 0, q: 0}, {name: "720p", cost: 10000, q: 2}, {name: "1080p", cost: 30000, q: 4}] },
    { id: 'tech', title: "Шаг 5. Экран", options: [{name: "LCD", cost: 0, q: 0}, {name: "OLED", cost: 20000, q: 3}] },
    { id: 'front_cam', title: "Шаг 6. Селфи", options: [{name: "Нет", cost: 0, q: 0}, {name: "2 МП", cost: 2000, q: 1}, {name: "12 МП", cost: 15000, q: 3}] },
    { id: 'rear_cam', title: "Шаг 7. Камера", options: [{name: "2 МП", cost: 0, q: 0}, {name: "12 МП", cost: 10000, q: 2}, {name: "108 МП", cost: 40000, q: 5}] },
    { id: 'port', title: "Шаг 8. Порт", options: [{name: "Micro-USB", cost: 0, q: 0}, {name: "USB-C", cost: 5000, q: 2}] },
    { id: 'cpu', title: "Шаг 9. Процессор", options: [{name: "Слабый", cost: 0, q: 0}, {name: "Средний", cost: 15000, q: 2}, {name: "Мощный", cost: 50000, q: 5}] },
    { id: 'ram', title: "Шаг 10. Память", options: [{name: "1 ГБ", cost: 0, q: 0}, {name: "4 ГБ", cost: 10000, q: 2}, {name: "8 ГБ", cost: 25000, q: 4}] },
    { id: 'battery', title: "Шаг 11. Батарея", options: [{name: "2000 мАч", cost: 0, q: 0}, {name: "4000 мАч", cost: 8000, q: 2}, {name: "6000 мАч", cost: 20000, q: 4}] },
    { id: 'features', title: "Шаг 12. Фишки", options: [{name: "Нет", cost: 0, q: 0}, {name: "NFC + GPS", cost: 15000, q: 3}] },
    { id: 'color', title: "Шаг 13. Цвет", options: [{name: "Черный", cost: 0, q: 0}, {name: "Белый", cost: 0, q: 0}, {name: "Неоновый", cost: 10000, q: 2}, {name: "Радужный", cost: 50000, q: 5}] }
];

// --- 2. ИНИЦИАЛИЗАЦИЯ ---
window.onload = () => {
    loadSave();
    updateUI();
    renderBuildMenu();
    startGameLoop();
};

function updateUI() {
    document.getElementById('ui-money').innerText = '$' + Math.floor(state.money).toLocaleString('ru-RU');
    document.getElementById('ui-rp').innerText = Math.floor(state.rp).toLocaleString('ru-RU') + ' RP';
    document.getElementById('ui-date').innerText = state.date;
    
    const office = OFFICES[state.officeLvl];
    document.getElementById('ui-office-name').innerText = office.name;
    document.getElementById('ui-slots').innerText = `${state.workstations.length} / ${office.slots}`;
    
    renderPlacedItems();
}

function renderPlacedItems() {
    const container = document.getElementById('placed-items');
    container.innerHTML = '';
    
    if (state.workstations.length === 0) {
        container.innerHTML = '<div style="color:#666; text-align:center; padding: 20px; width:100%;">Офис пуст. Купи стол снизу!</div>';
        return;
    }

    state.workstations.forEach((ws, index) => {
        const el = document.createElement('div');
        el.className = 'placed-workstation';
        
        // Визуализация: Стол + Стул (если есть) + ПК (если есть)
        let chairHTML = ws.chair ? `<div class="chair-ico">${ws.chair.icon}</div>` : '';
        let pcHTML = ws.pc ? `<div class="pc-ico">${ws.pc.icon}</div>` : '';

        el.innerHTML = `
            ${pcHTML}
            <div class="desk-ico">${ws.desk.icon}</div>
            ${chairHTML}
            <div class="name">${ws.desk.name}</div>
        `;
        container.appendChild(el);
    });
}

// --- 3. МАГАЗИН И ПРИВЯЗКА ---
function switchBuildTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.b-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderBuildMenu();
}

function renderBuildMenu() {
    const container = document.getElementById('build-items');
    container.innerHTML = '';
    
    BUILD_ITEMS[currentTab].forEach(item => {
        const el = document.createElement('div');
        el.className = 'b-item';
        el.onclick = () => buyItem(item);
        el.innerHTML = `
            <div class="icon">${item.icon}</div>
            <div class="title">${item.name}</div>
            <div class="price">${item.price === 0 ? 'Free' : '$' + item.price.toLocaleString()}</div>
        `;
        container.appendChild(el);
    });
}

function buyItem(item) {
    if (state.money < item.price) { showToast("Мало денег!"); return; }

    // Логика привязки
    if (currentTab === 'desks') {
        // Проверка слотов
        if (state.workstations.length >= OFFICES[state.officeLvl].slots) {
            showToast("Нет места! Улучшите офис."); return;
        }
        // Покупаем новый стол
        state.money -= item.price;
        state.workstations.push({ desk: item, chair: null, pc: null });
        showToast(`Куплен ${item.name}`);
    } 
    else if (currentTab === 'chairs') {
        // Ищем стол без стула
        const emptyDesk = state.workstations.find(w => !w.chair);
        if (!emptyDesk) { showToast("Сначала купите стол (без стула)!"); return; }
        state.money -= item.price;
        emptyDesk.chair = item;
        showToast(`Стул установлен за стол!`);
    }
    else if (currentTab === 'pcs') {
        // Ищем стол без ПК
        const emptyDesk = state.workstations.find(w => !w.pc);
        if (!emptyDesk) { showToast("Сначала купите стол (без ПК)!"); return; }
        state.money -= item.price;
        emptyDesk.pc = item;
        showToast(`Компьютер установлен!`);
    }

    updateUI();
    save();
}

function upgradeOffice() {
    if (state.officeLvl >= OFFICES.length - 1) { showToast("Максимальный офис!"); return; }
    const cost = OFFICES[state.officeLvl].upgradeCost;
    if (state.money < cost) { showToast("Недостаточно денег для переезда!"); return; }
    
    state.money -= cost;
    state.officeLvl++;
    updateUI();
    save();
    showToast(`Переезд в: ${OFFICES[state.officeLvl].name}!`);
}

// --- 4. КОМАНДА ---
function openTeamMenu() {
    // Простое модальное окно через prompt/confirm (для скорости, чтобы не раздувать код)
    let action = prompt(`Ваша команда:\n🔬 Исследователи: ${state.staff.researchers}\n🔧 Фиксеры: ${state.staff.fixers}\n\nВведите 1, чтобы нанять Исследователя ($5K)\nВведите 2, чтобы нанять Фиксера ($5K)`);
    
    if (action === '1') {
        if (state.money < 5000) { showToast("Мало денег!"); return; }
        state.money -= 5000; state.staff.researchers++;
        showToast("Исследователь нанят!");
    } else if (action === '2') {
        if (state.money < 5000) { showToast("Мало денег!"); return; }
        state.money -= 5000; state.staff.fixers++;
        showToast("Фиксер нанят!");
    }
    updateUI(); save();
}

// --- 5. ДИЗАЙН-СТУДИЯ (ПОЛНОЭКРАННАЯ) ---
function openDesignStudio() {
    if (state.dev.active) { showToast("Идет разработка!"); return; }
    currentStep = 1;
    state.currentDesign = { quality: 0, cost: 0 };
    document.getElementById('design-screen').classList.add('active');
    renderDesignStep();
}
function closeDesignStudio() {
    document.getElementById('design-screen').classList.remove('active');
}

function renderDesignStep() {
    if (currentStep > designSteps.length) {
        // Завершение
        if (state.money < state.currentDesign.cost) { showToast("Не хватает денег!"); currentStep--; return; }
        state.money -= state.currentDesign.cost;
        closeDesignStudio();
        startDevPhase();
        return;
    }

    const step = designSteps[currentStep - 1];
    document.getElementById('ds-title').innerText = step.title;
    document.getElementById('ds-step-info').innerText = `Шаг ${currentStep} из 13`;
    document.getElementById('ds-phone-emoji').innerText = step.id === 'body' ? '📲' : step.id === 'color' ? '🌈' : '📱';
    
    const opts = document.getElementById('ds-options');
    opts.innerHTML = '';
    step.options.forEach(o => {
        let el = document.createElement('div');
        el.className = 'ds-option';
        el.innerHTML = `<span class="ds-opt-name">${o.name}</span><span class="ds-opt-price">${o.cost === 0 ? 'Free' : '+$'+o.cost}</span>`;
        el.onclick = () => {
            state.currentDesign.cost += o.cost;
            state.currentDesign.quality += o.q;
            currentStep++;
            renderDesignStep();
        };
        opts.appendChild(el);
    });
}
function nextDesignStep() { currentStep++; renderDesignStep(); }
function prevDesignStep() { if (currentStep > 1) { currentStep--; renderDesignStep(); } }

// --- 6. СБОРКА ---
function startDevPhase() {
    state.dev = { active: true, progress: 0, bugs: 0 };
    document.getElementById('dev-panel').classList.add('active');
    document.getElementById('btn-finish-dev').style.display = 'none';
    document.getElementById('dev-title').innerText = "Исследователи собирают...";
    document.getElementById('dev-panel').style.borderColor = "var(--blue)";
    updateDevUI();
}

function updateDevUI() {
    document.getElementById('dev-percent').innerText = Math.floor(state.dev.progress) + '%';
    document.getElementById('dev-bar').style.width = state.dev.progress + '%';
    document.getElementById('dev-quality').innerText = state.currentDesign.quality;
    document.getElementById('dev-bugs').innerText = Math.floor(state.dev.bugs);
}

function startGameLoop() {
    setInterval(() => {
        // Доход от RP
        if (state.rp > 0) state.money += state.rp * 0.5;
        
        // Процесс сборки
        if (state.dev.active) {
            if (state.staff.researchers > 0) state.dev.progress += state.staff.researchers * 2;
            if (state.dev.progress > 100) state.dev.progress = 100;

            if (state.dev.progress > 0 && state.dev.progress < 100) {
                if (Math.random() < 0.3) state.dev.bugs += state.staff.researchers;
            }

            if (state.dev.bugs > 0 && state.staff.fixers > 0) state.dev.bugs -= state.staff.fixers * 3;
            if (state.dev.bugs < 0) state.dev.bugs = 0;

            updateDevUI();

            if (state.dev.progress >= 100 && state.dev.bugs <= 0) {
                document.getElementById('dev-title').innerText = "Готово к запуску!";
                document.getElementById('btn-finish-dev').style.display = 'block';
                document.getElementById('dev-panel').style.borderColor = "var(--green)";
            }
        }
        updateUI();
    }, 1000);
}

function launchDevice() {
    if (!state.dev.active) return;
    state.dev.active = false;
    document.getElementById('dev-panel').classList.remove('active');
    
    let score = (5 + (state.currentDesign.quality / 10)).toFixed(1);
    if (score > 9.9) score = 9.9;
    let profit = Math.floor(score * 5000000) + (state.currentDesign.quality * 100000);
    state.money += profit;
    
    alert(`🎉 Устройство готово!\nОценка критиков: ${score}/10\nПрибыль: $${profit.toLocaleString()}`);
    updateUI();
    save();
}

// --- 7. СОХРАНЕНИЕ ---
function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}
function save() { localStorage.setItem('tech_empire_v3', JSON.stringify(state)); }
function loadSave() {
    const saved = localStorage.getItem('tech_empire_v3');
    if (saved) { try { state = JSON.parse(saved); } catch(e){} }
    }
  </script>
