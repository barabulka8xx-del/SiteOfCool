<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 3D | Site Of Cool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080b10; color: white; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* --- ПЛАШКА ДЛЯ ПОВОРОТА --- */
    .rotate-warning { position: fixed; inset: 0; background: #080b10; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .rotate-warning .icon { font-size: 50px; margin-bottom: 20px; animation: rotateAnim 2s infinite; }
    @keyframes rotateAnim { 0% { transform: rotate(0); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0); } }
    @media (orientation: portrait) {
      /* Показываем плашку только если это не ПК */
      body.is-mobile .rotate-warning { display: flex; }
    }

    /* --- ШАПКА --- */
    .top-bar { height: 60px; background: #111a22; border-bottom: 2px solid #1f2d3d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .stat-box { display: flex; gap: 15px; align-items: center; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 10px; color: #6c8196; text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 15px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .stat-val.rp { color: #8E2DE2; text-shadow: 0 0 10px rgba(142,45,226,0.3); }

    /* --- 3D КАНВАС --- */
    #game-container { flex: 1; position: relative; outline: none; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* --- ПАНЕЛЬ СТРОЙКИ --- */
    .build-panel { position: absolute; bottom: -100%; left: 0; width: 100%; background: #111a22; border-top: 2px solid #1f2d3d; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 200; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); padding-bottom: env(safe-area-inset-bottom); }
    .build-panel.active { bottom: 0; }

    .build-header { padding: 15px; border-bottom: 1px solid #1f2d3d; display: flex; justify-content: space-between; align-items: center; }
    .build-title { font-weight: 900; font-size: 16px; color: #fff; }
    .btn-done { background: #00ff88; color: #000; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
    
    .build-items { display: flex; gap: 12px; padding: 15px; overflow-x: auto; }
    .build-items::-webkit-scrollbar { display: none; }
    .item { flex-shrink: 0; width: 100px; background: #0a0f14; border: 1px solid #2a3b4c; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
    .item:active { transform: scale(0.95); border-color: #00ff88; }
    .item.selected { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.3); background: #11221a; }
    .item-img { width: 100%; height: 40px; background: #1f2d3d; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
    .item-title { font-size: 11px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .item-price { font-size: 12px; font-weight: 900; color: #ffd700; }

    /* --- НИЖНЯЯ ПАНЕЛЬ --- */
    .bottom-bar { height: 60px; background: #111a22; border-top: 2px solid #1f2d3d; display: flex; justify-content: center; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .main-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; border: none; padding: 12px 30px; border-radius: 12px; font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 5px 20px rgba(79,172,254,0.4); }
    .main-btn:active { transform: scale(0.95); }

    /* Подсказка */
    .hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00ff88; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 50; display: none; border: 1px solid #00ff88; text-align: center; width: 90%; max-width: 300px; }
    .hint.active { display: block; }
  </style>
</head>
<body>

  <!-- ПЛАШКА ПОВОРОТА -->
  <div class="rotate-warning">
    <div class="icon">📱</div>
    <div style="font-size: 20px; font-weight: 900; color: #4facfe; margin-bottom: 10px;">Поверни телефон</div>
    <div style="font-size: 14px; color: #aaa;">Для лучшего 3D-обзора играй в горизонтальном режиме</div>
  </div>

  <!-- ШАПКА -->
  <div class="top-bar">
    <div class="stat-box">
      <div class="stat">
        <span class="stat-label">Баланс</span>
        <span class="stat-val" id="ui-money">$200,000</span>
      </div>
      <div class="stat">
        <span class="stat-label">Исследования</span>
        <span class="stat-val rp" id="ui-rp">0 RP</span>
      </div>
    </div>
    <div class="stat">
        <span class="stat-label">Столы</span>
        <span class="stat-val" id="ui-desks" style="color:#fff; text-shadow:none;">0 / 5</span>
    </div>
  </div>

  <!-- СЮДА РЕНДЕРИТСЯ 3D -->
  <div id="game-container">
    <div class="hint" id="build-hint">Тапни по полу, чтобы поставить стол</div>
  </div>

  <!-- ПАНЕЛЬ СТРОЙКИ -->
  <div class="build-panel" id="build-panel">
    <div class="build-header">
      <div class="build-title">🛠 Строительство</div>
      <button class="btn-done" onclick="closeBuildMenu()">Done</button>
    </div>
    <div class="build-items">
      <!-- Рабочий стол -->
      <div class="item" id="item-desk" onclick="selectItem('desk', 15000)">
        <div class="item-img">
          <div style="width:30px; height:20px; background:#1f2d3d; border:1px solid #4facfe; border-radius:2px;"></div>
        </div>
        <div class="item-title">Рабочий стол</div>
        <div class="item-price">$15.0K</div>
      </div>
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="bottom-bar">
    <button class="main-btn" onclick="openBuildMenu()">
      🛠 Стройка
    </button>
  </div>

  <!-- ПОДКЛЮЧАЕМ THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Определяем мобилку для плашки
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        document.body.classList.add('is-mobile');
    }

    // --- 1. СОСТОЯНИЕ ---
    let state = {
        money: 200000,
        rp: 0,
        objects: [], // {x, z, type}
        maxDesks: 5
    };
    let buildMode = false;
    let selectedItem = null;

    // --- 2. НАСТРОЙКИ СЦЕНЫ (ДЕНЬ) ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    
    // Дневное небо
    scene.background = new THREE.Color(0x87CEEB); 
    // Легкий туман для глубины
    scene.fog = new THREE.Fog(0x87CEEB, 20, 50);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(10, 10, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Камера (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.1;
    controls.minDistance = 5;
    controls.maxDistance = 25;

    // --- 3. ОСВЕЩЕНИЕ (СОЛНЕЧНЫЙ ДЕНЬ) ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.6)); // Больше базового света

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.0); // Теплый солнечный свет
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // --- 4. КОМНАТА (Пол и стены) ---
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    // Темный пол, чтобы сочеталось с интерфейсом
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d151c, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(10, 10, 0x4facfe, 0x1f2d3d);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x111a22, roughness: 1 });
    
    const wallBack = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.2), wallMat);
    wallBack.position.set(0, 1.5, -5);
    wallBack.receiveShadow = true;
    scene.add(wallBack);

    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 10), wallMat);
    wallLeft.position.set(-5, 1.5, 0);
    wallLeft.receiveShadow = true;
    scene.add(wallLeft);

    // Окно (Стекло)
    const windowMat = new THREE.MeshPhysicalMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.2, 
        roughness: 0.1, 
        metalness: 0, 
        transmission: 0.9 
    });
    const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 0.1), windowMat);
    windowMesh.position.set(0, 1.8, -4.88);
    scene.add(windowMesh);

    // Окно (Облака снаружи)
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
    for(let i = 0; i < 3; i++) {
        const cloud = new THREE.Mesh(new THREE.BoxGeometry(1, 0.4, 0.2), cloudMat);
        cloud.position.set(-1 + i*1.5, 1.5 + Math.random() * 1.5, -6);
        scene.add(cloud);
    }

    // --- 5. СОЗДАНИЕ 3D-МОДЕЛИ СТОЛА ---
    function createDesk(x, z) {
        const deskGroup = new THREE.Group();

        // Столешница (Стекло)
        const topGeo = new THREE.BoxGeometry(1.2, 0.05, 0.8);
        const topMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x1f2d3d, 
            transparent: true, 
            opacity: 0.8, 
            roughness: 0.1, 
            metalness: 0.5, 
            clearcoat: 1.0 
        });
        const top = new THREE.Mesh(topGeo, topMat);
        top.position.y = 0.6;
        top.castShadow = true;
        top.receiveShadow = true;
        deskGroup.add(top);

        // Ножки (Металл)
        const legGeo = new THREE.BoxGeometry(0.08, 0.6, 0.08);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8, roughness: 0.2 });
        
        const legPositions = [
            [-0.5, 0.3, -0.3], [0.5, 0.3, -0.3],
            [-0.5, 0.3, 0.3],  [0.5, 0.3, 0.3]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            deskGroup.add(leg);
        });

        // Подставка монитора (Шея) - Сдвинута назад!
        const standGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.25);
        const standMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 });
        const stand = new THREE.Mesh(standGeo, standMat);
        stand.position.set(0, 0.75, -0.3); // z = -0.3, чтобы не мешать
        stand.castShadow = true;
        deskGroup.add(stand);

        // Монитор (Корпус)
        const monitorGeo = new THREE.BoxGeometry(0.7, 0.4, 0.04);
        const monitorMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const monitor = new THREE.Mesh(monitorGeo, monitorMat);
        monitor.position.set(0, 0.95, -0.3);
        monitor.castShadow = true;
        deskGroup.add(monitor);

        // Экран (Светится)
        const screenGeo = new THREE.PlaneGeometry(0.65, 0.35);
        const screenMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(0, 0.95, -0.27);
        deskGroup.add(screen);

        // Клавиатура
        const kbGeo = new THREE.BoxGeometry(0.5, 0.02, 0.15);
        const kbMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const kb = new THREE.Mesh(kbGeo, kbMat);
        kb.position.set(0, 0.63, 0.1);
        deskGroup.add(kb);

        // Мышка
        const mouseGeo = new THREE.BoxGeometry(0.08, 0.03, 0.12);
        const mouseMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const mouse = new THREE.Mesh(mouseGeo, mouseMat);
        mouse.position.set(0.4, 0.64, 0.1);
        deskGroup.add(mouse);

        // Позиционируем весь стол на сетке
        deskGroup.position.set(x, 0, z);
        
        scene.add(deskGroup);
        return deskGroup;
    }

    // --- 6. RAYCASTER (Клик по 3D-полу) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('pointerdown', (e) => {
        if (!buildMode || !selectedItem) return;

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(floor);

        if (intersects.length > 0) {
            const point = intersects[0].point;
            const gridX = Math.round(point.x) - 0.5; 
            const gridZ = Math.round(point.z) - 0.5;

            // Проверка: не занято ли место?
            const isOccupied = state.objects.some(o => o.x === gridX && o.z === gridZ);
            if (isOccupied) {
                alert("Здесь уже стоит стол!");
                return;
            }

            // Проверка лимита столов
            const deskCount = state.objects.filter(o => o.type === 'desk').length;
            if (deskCount >= state.maxDesks) {
                alert(`Лимит столов для этого офиса (${state.maxDesks})! Сначала перейдите в новый офис.`);
                return;
            }

            placeDesk(gridX, gridZ);
        }
    });

    // --- 7. ЛОГИКА СТРОИТЕЛЬСТВА ---
    function placeDesk(x, z) {
        state.money -= selectedItem.price;
        state.objects.push({ x, z, type: selectedItem.type });
        
        createDesk(x, z);
        updateUI();
        saveLocal();
        closeBuildMenu();
    }

    function openBuildMenu() {
        document.getElementById('build-panel').classList.add('active');
        document.getElementById('build-hint').classList.remove('active');
        buildMode = false; 
    }

    function closeBuildMenu() {
        document.getElementById('build-panel').classList.remove('active');
        document.getElementById('build-hint').classList.remove('active');
        buildMode = false;
        selectedItem = null;
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
    }

    function selectItem(type, price) {
        if (state.money < price) { alert("Недостаточно денег!"); return; }
        selectedItem = { type, price };
        buildMode = true;
        
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
        document.getElementById('item-desk').classList.add('selected');
        
        document.getElementById('build-panel').classList.remove('active');
        document.getElementById('build-hint').classList.add('active');
    }

    // --- 8. UI И СОХРАНЕНИЯ ---
    function updateUI() {
        document.getElementById('ui-money').innerText = '$' + Math.floor(state.money).toLocaleString('ru-RU');
        document.getElementById('ui-rp').innerText = Math.floor(state.rp).toLocaleString('ru-RU') + ' RP';
        
        const deskCount = state.objects.filter(o => o.type === 'desk').length;
        document.getElementById('ui-desks').innerText = `${deskCount} / ${state.maxDesks}`;
    }

    function saveLocal() {
        localStorage.setItem('tech_empire_v5', JSON.stringify(state));
    }

    function loadLocal() {
        const saved = localStorage.getItem('tech_empire_v5');
        if (saved) {
            state = JSON.parse(saved);
            state.objects.forEach(obj => {
                createDesk(obj.x, obj.z);
            });
        }
        updateUI();
    }

    // --- 9. ЦИКЛ РЕНДЕРА ---
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Запуск
    window.onload = () => {
        loadLocal();
        animate();
    };
  </script>
</body>
</html>
