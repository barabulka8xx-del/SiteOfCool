<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 3D | Site Of Cool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080b10; color: white; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* --- ПЛАШКА ДЛЯ ПОВОРОТА --- */
    .rotate-warning { position: fixed; inset: 0; background: #080b10; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .rotate-warning .icon { font-size: 50px; margin-bottom: 20px; animation: rotateAnim 2s infinite; }
    @keyframes rotateAnim { 0% { transform: rotate(0); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0); } }
    @media (orientation: portrait) { body.is-mobile .rotate-warning { display: flex; } }

    /* --- ШАПКА --- */
    .top-bar { height: 55px; background: #111a22; border-bottom: 2px solid #1f2d3d; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .stat-box { display: flex; gap: 10px; align-items: center; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 9px; color: #6c8196; text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 14px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .stat-val.rp { color: #8E2DE2; text-shadow: 0 0 10px rgba(142,45,226,0.3); }
    
    .btn-icon { background: rgba(255,255,255,0.1); border: 1px solid #2a3b4c; color: #fff; width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; }

    /* --- 3D КАНВАС --- */
    #game-container { flex: 1; position: relative; outline: none; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* --- ПАНЕЛЬ СТРОЙКИ --- */
    .build-panel { position: absolute; bottom: -100%; left: 0; width: 100%; background: #111a22; border-top: 2px solid #1f2d3d; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 200; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); padding-bottom: env(safe-area-inset-bottom); }
    .build-panel.active { bottom: 0; }

    .build-header { padding: 12px 15px; border-bottom: 1px solid #1f2d3d; display: flex; justify-content: space-between; align-items: center; }
    .build-title { font-weight: 900; font-size: 15px; color: #fff; }
    .btn-done { background: #00ff88; color: #000; border: none; padding: 6px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    
    .build-items { display: flex; gap: 12px; padding: 15px; overflow-x: auto; }
    .build-items::-webkit-scrollbar { display: none; }
    .item { flex-shrink: 0; width: 100px; background: #0a0f14; border: 1px solid #2a3b4c; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
    .item:active { transform: scale(0.95); border-color: #00ff88; }
    .item.selected { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.3); background: #11221a; }
    .item-img { width: 100%; height: 40px; background: #1f2d3d; border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
    .item-title { font-size: 11px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .item-price { font-size: 12px; font-weight: 900; color: #ffd700; }

    /* --- НИЖНЯЯ ПАНЕЛЬ --- */
    .bottom-bar { height: 60px; background: #111a22; border-top: 2px solid #1f2d3d; display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .main-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 5px 20px rgba(79,172,254,0.4); }
    .main-btn.hire { background: linear-gradient(135deg, #00ff88, #00cc6a); box-shadow: 0 5px 20px rgba(0,255,136,0.4); }
    .main-btn:active { transform: scale(0.95); }

    /* Подсказка */
    .hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00ff88; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 50; display: none; border: 1px solid #00ff88; text-align: center; width: 90%; max-width: 300px; }
    .hint.active { display: block; }
  </style>
</head>
<body>

  <div class="rotate-warning">
    <div class="icon">📱</div>
    <div style="font-size: 20px; font-weight: 900; color: #4facfe; margin-bottom: 10px;">Поверни телефон</div>
    <div style="font-size: 14px; color: #aaa;">Для лучшего 3D-обзора играй в горизонтальном режиме</div>
  </div>

  <div class="top-bar">
    <div class="stat-box">
      <div class="stat">
        <span class="stat-label">Баланс</span>
        <span class="stat-val" id="ui-money">$200,000</span>
      </div>
      <div class="stat">
        <span class="stat-label">Исследования</span>
        <span class="stat-val rp" id="ui-rp">0 RP</span>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <div class="stat">
            <span class="stat-label">Столы / Люди</span>
            <span class="stat-val" id="ui-desks" style="color:#fff; text-shadow:none;">0 / 0</span>
        </div>
        <button class="btn-icon" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>

  <div id="game-container">
    <div class="hint" id="build-hint">Тапни по полу, чтобы поставить стол</div>
  </div>

  <div class="build-panel" id="build-panel">
    <div class="build-header">
      <div class="build-title">🛠 Строительство</div>
      <button class="btn-done" onclick="closeBuildMenu()">Done</button>
    </div>
    <div class="build-items">
      <div class="item" id="item-desk" onclick="selectItem('desk', 15000)">
        <div class="item-img">
          <div style="width:30px; height:20px; background:#1f2d3d; border:1px solid #4facfe; border-radius:2px;"></div>
        </div>
        <div class="item-title">Рабочий стол</div>
        <div class="item-price">$15.0K</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="main-btn" onclick="openBuildMenu()">🛠 Стройка</button>
    <button class="main-btn hire" onclick="hireEmployee()">👨‍💻 Нанять</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        document.body.classList.add('is-mobile');
    }

    let state = { money: 200000, rp: 0, objects: [], employees: [], maxDesks: 5 };
    let buildMode = false;
    let selectedItem = null;
    let activeEmployees = 0;

    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    // Убрал туман, чтобы стены были четкими
    // scene.fog = new THREE.Fog(0x87CEEB, 20, 50); 

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(8, 8, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.1;
    controls.minDistance = 4;
    controls.maxDistance = 20;

    // --- СВЕТ ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.7)); 
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // --- КОМНАТА ---
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a3b4c, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(10, 10, 0x4facfe, 0x1f2d3d);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Стены (Темно-синий офисный цвет)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
    
    // Задняя стена
    const wallBack = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 0.2), wallMat);
    wallBack.position.set(0, 2, -5); 
    wallBack.receiveShadow = true; 
    scene.add(wallBack);

    // Левая стена
    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 10), wallMat);
    wallLeft.position.set(-5, 2, 0); 
    wallLeft.receiveShadow = true; 
    scene.add(wallLeft);

    // Окно (С нормальной рамой)
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const frame = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.7, 0.2), frameMat);
    frame.position.set(0, 2, -4.88); 
    scene.add(frame);

    const glassMat = new THREE.MeshPhysicalMaterial({ 
        color: 0xaaccff, 
        transparent: true, 
        opacity: 0.4, 
        transmission: 0.9,
        roughness: 0.1
    });
    const glass = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 0.1), glassMat);
    glass.position.set(0, 2, -4.85); 
    scene.add(glass);

    // --- МОДЕЛИ ---
    function createDesk(x, z) {
        const deskGroup = new THREE.Group();
        const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.8), new THREE.MeshPhysicalMaterial({ color: 0x1f2d3d, transparent: true, opacity: 0.8, metalness: 0.5 }));
        top.position.y = 0.6; top.castShadow = true; deskGroup.add(top);

        const legGeo = new THREE.BoxGeometry(0.08, 0.6, 0.08);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8 });
        [[-0.5, 0.3, -0.3], [0.5, 0.3, -0.3], [-0.5, 0.3, 0.3], [0.5, 0.3, 0.3]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(...pos); leg.castShadow = true; deskGroup.add(leg);
        });

        const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.2), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 }));
        stand.position.set(0, 0.7, -0.38); stand.castShadow = true; deskGroup.add(stand);

        const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.04), new THREE.MeshStandardMaterial({ color: 0x000000 }));
        monitor.position.set(0, 0.9, -0.35); monitor.castShadow = true; deskGroup.add(monitor);

        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.35), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
        screen.position.set(0, 0.9, -0.32); deskGroup.add(screen);

        const kb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.15), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        kb.position.set(0, 0.63, 0.1); deskGroup.add(kb);

        const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 0.12), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        mouse.position.set(0.4, 0.64, 0.1); deskGroup.add(mouse);

        deskGroup.position.set(x, 0, z);
        scene.add(deskGroup);
        return deskGroup;
    }

    function createCharacter(x, z) {
        const charGroup = new THREE.Group();
        
        // Ноги (Зеленые штаны)
        const legMat = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
        const legGeo = new THREE.BoxGeometry(0.15, 0.4, 0.15);
        const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.1, 0.2, 0); legL.castShadow = true;
        const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(0.1, 0.2, 0); legR.castShadow = true;
        charGroup.add(legL, legR);

        // Торс (Синяя футболка)
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.2), new THREE.MeshStandardMaterial({ color: 0x4facfe }));
        body.position.set(0, 0.625, 0); body.castShadow = true; charGroup.add(body);

        // Руки (Желтая кожа, прилегают к телу)
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd700 }); // Классический желтый Роблокс
        const armGeo = new THREE.BoxGeometry(0.12, 0.45, 0.12);
        const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.26, 0.65, 0); armL.castShadow = true;
        const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.26, 0.65, 0); armR.castShadow = true;
        charGroup.add(armL, armR);

        // Голова (Круглая / скругленный куб)
        const headGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.set(0, 0.95, 0); head.castShadow = true;
        charGroup.add(head);

        // --- ТЕКСТУРА ЛИЦА (Улыбка Роблокса) ---
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffd700'; // Фон под цвет головы
        ctx.fillRect(0, 0, 128, 128);
        
        // Глаза
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.ellipse(40, 50, 8, 12, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(88, 50, 8, 12, 0, 0, Math.PI*2); ctx.fill();
        
        // Улыбка
        ctx.beginPath();
        ctx.arc(64, 70, 25, 0, Math.PI, false);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        const faceMat = new THREE.MeshBasicMaterial({ map: texture });
        const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.29, 0.29), faceMat);
        facePlane.position.set(0, 0.95, 0.151); // Чуть впереди головы
        charGroup.add(facePlane);

        charGroup.position.set(x, 0, z);
        scene.add(charGroup);
        return charGroup;
    }

    // --- КЛИКИ И ЛОГИКА ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.addEventListener('pointerdown', (e) => {
        if (!buildMode || !selectedItem) return;

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(floor);

        if (intersects.length > 0) {
            const point = intersects[0].point;
            const gridX = Math.round(point.x) - 0.5; 
            const gridZ = Math.round(point.z) - 0.5;

            if (state.objects.some(o => o.x === gridX && o.z === gridZ)) {
                alert("Здесь уже стоит стол!"); return;
            }
            const deskCount = state.objects.filter(o => o.type === 'desk').length;
            if (deskCount >= state.maxDesks) {
                alert(`Лимит столов для этого офиса (${state.maxDesks})!`); return;
            }
            placeDesk(gridX, gridZ);
        }
    });

    function placeDesk(x, z) {
        state.money -= selectedItem.price;
        state.objects.push({ x, z, type: selectedItem.type });
        createDesk(x, z);
        updateUI();
        saveLocal();
        closeBuildMenu();
    }

    function hireEmployee() {
        const freeDesk = state.objects.find(o => 
            o.type === 'desk' && 
            !state.employees.some(e => e.targetDesk && e.targetDesk.x === o.x && e.targetDesk.z === o.z)
        );

        if (!freeDesk) { alert("Нет свободных столов!"); return; }

        // Спавним Роблоксера у входа
        const charMesh = createCharacter(-4, 4); 
        const employee = {
            id: Date.now(),
            mesh: charMesh,
            status: 'walking',
            targetDesk: { x: freeDesk.x, z: freeDesk.z }
        };
        
        state.employees.push(employee);
        updateUI();
    }

    // --- ИГРОВОЙ ЦИКЛ ---
    function animate() {
        requestAnimationFrame(animate);

        state.employees.forEach(emp => {
            if (emp.status === 'walking') {
                const targetX = emp.targetDesk.x;
                const targetZ = emp.targetDesk.z + 0.8; // Встаем перед столом
                
                const dx = targetX - emp.mesh.position.x;
                const dz = targetZ - emp.mesh.position.z;
                const distance = Math.sqrt(dx*dx + dz*dz);

                if (distance > 0.1) {
                    const speed = 0.06;
                    emp.mesh.position.x += (dx / distance) * speed;
                    emp.mesh.position.z += (dz / distance) * speed;
                    
                    // Анимация ходьбы (покачивание)
                    emp.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.1;
                    
                    emp.mesh.rotation.y = Math.atan2(dx, dz);
                } else {
                    emp.status = 'working';
                    activeEmployees++;
                    emp.mesh.position.y = 0; // Приземляем
                    emp.mesh.rotation.y = Math.PI; // Разворачиваем лицом к столу
                }
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }

    // --- ЭКОНОМИКА ---
    setInterval(() => {
        if (activeEmployees > 0) {
            state.money += activeEmployees * 150;
            state.rp += activeEmployees * 2;
            updateUI();
        }
    }, 1000);

    // --- UI ---
    function updateUI() {
        document.getElementById('ui-money').innerText = '$' + Math.floor(state.money).toLocaleString('ru-RU');
        document.getElementById('ui-rp').innerText = Math.floor(state.rp).toLocaleString('ru-RU') + ' RP';
        const deskCount = state.objects.filter(o => o.type === 'desk').length;
        const empCount = state.employees.length;
        document.getElementById('ui-desks').innerText = `${deskCount} / ${empCount}`;
    }

    function openBuildMenu() {
        document.getElementById('build-panel').classList.add('active');
        document.getElementById('build-hint').classList.remove('active');
        buildMode = false; 
    }

    function closeBuildMenu() {
        document.getElementById('build-panel').classList.remove('active');
        document.getElementById('build-hint').classList.remove('active');
        buildMode = false;
        selectedItem = null;
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
    }

    function selectItem(type, price) {
        if (state.money < price) { alert("Недостаточно денег!"); return; }
        selectedItem = { type, price };
        buildMode = true;
        document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
        document.getElementById('item-desk').classList.add('selected');
        document.getElementById('build-panel').classList.remove('active');
        document.getElementById('build-hint').classList.add('active');
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
        else document.exitFullscreen();
    }

    function saveLocal() {
        localStorage.setItem('tech_empire_v8', JSON.stringify({
            money: state.money,
            rp: state.rp,
            objects: state.objects
        }));
    }

    function loadLocal() {
        const saved = localStorage.getItem('tech_empire_v8');
        if (saved) {
            const data = JSON.parse(saved);
            state.money = data.money;
            state.rp = data.rp;
            state.objects = data.objects;
            state.objects.forEach(obj => createDesk(obj.x, obj.z));
        }
        updateUI();
    }

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    window.onload = () => {
        loadLocal();
        animate();
    };
  </script>
</body>
</html>
