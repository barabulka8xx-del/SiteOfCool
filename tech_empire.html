<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tech Empire 3D | Site Of Cool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080b10; color: white; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    /* --- ПЛАШКА ДЛЯ ПОВОРОТА --- */
    .rotate-warning { position: fixed; inset: 0; background: #080b10; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .rotate-warning .icon { font-size: 50px; margin-bottom: 20px; animation: rotateAnim 2s infinite; }
    @keyframes rotateAnim { 0% { transform: rotate(0); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0); } }
    @media (orientation: portrait) { body.is-mobile .rotate-warning { display: flex; } }

    /* --- ШАПКА --- */
    .top-bar { height: 55px; background: #111a22; border-bottom: 2px solid #1f2d3d; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .stat-box { display: flex; gap: 10px; align-items: center; }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 9px; color: #6c8196; text-transform: uppercase; font-weight: 700; }
    .stat-val { font-size: 14px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .stat-val.rp { color: #8E2DE2; text-shadow: 0 0 10px rgba(142,45,226,0.3); }
    
    .btn-icon { background: rgba(255,255,255,0.1); border: 1px solid #2a3b4c; color: #fff; width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; }

    /* --- 3D КАНВАС --- */
    #game-container { flex: 1; position: relative; outline: none; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* --- МЕНЮ СТРОЙКИ --- */
    .build-panel { position: absolute; bottom: -100%; left: 0; width: 100%; background: #111a22; border-top: 2px solid #1f2d3d; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 200; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); padding-bottom: env(safe-area-inset-bottom); }
    .build-panel.active { bottom: 0; }

    .build-header { padding: 12px 15px; border-bottom: 1px solid #1f2d3d; display: flex; justify-content: space-between; align-items: center; }
    .build-title { font-weight: 900; font-size: 15px; color: #fff; }
    .btn-done { background: #00ff88; color: #000; border: none; padding: 6px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    
    .build-items { display: flex; gap: 12px; padding: 15px; overflow-x: auto; }
    .build-items::-webkit-scrollbar { display: none; }
    .item { flex-shrink: 0; width: 110px; background: #0a0f14; border: 1px solid #2a3b4c; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; align-items: center; }
    .item:active { transform: scale(0.95); border-color: #00ff88; }
    .item.selected { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.3); background: #11221a; }
    
    /* ИКОНКА СТОЛА (Рисуем через CSS) */
    .icon-desk { width: 60px; height: 40px; position: relative; margin-bottom: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .icon-desk .monitor { width: 30px; height: 22px; background: #000; border: 2px solid #555; border-radius: 4px; position: relative; margin-bottom: 2px; }
    .icon-desk .monitor::after { content:''; position: absolute; inset: 2px; background: #00ff88; opacity: 0.8; }
    .icon-desk .board { width: 50px; height: 6px; background: #8b5a2b; border-radius: 2px; border-bottom: 2px solid #5a3a1b; }

    .item-title { font-size: 11px; font-weight: 900; color: #fff; margin-bottom: 4px; text-align: center; }
    .item-price { font-size: 12px; font-weight: 900; color: #ffd700; }

    /* --- ПАНЕЛЬ СОТРУДНИКОВ (Как на скрине) --- */
    .team-panel { position: fixed; inset: 0; background: #0d141c; z-index: 300; display: none; flex-direction: column; }
    .team-panel.active { display: flex; }
    
    .team-header { height: 60px; background: #111a22; border-bottom: 2px solid #1f2d3d; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-shrink: 0; }
    .team-title { font-size: 18px; font-weight: 900; color: #fff; }
    
    .team-tabs { display: flex; gap: 10px; padding: 15px; flex-shrink: 0; overflow-x: auto; }
    .team-tab { flex: 1; background: #1f2d3d; border: 1px solid #2a3b4c; color: #aaa; padding: 10px; border-radius: 10px; font-weight: 900; font-size: 13px; cursor: pointer; text-align: center; white-space: nowrap; }
    .team-tab.active { background: rgba(79, 172, 254, 0.2); border-color: #4facfe; color: #4facfe; }
    .team-tab.fixer.active { background: rgba(255, 0, 85, 0.2); border-color: #ff0055; color: #ff0055; }

    .team-list { flex: 1; overflow-y: auto; padding: 0 15px 20px 15px; display: flex; flex-direction: column; gap: 10px; }
    
    .candidate-card { background: #151f2b; border: 1px solid #2a3b4c; border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; }
    .cand-avatar { width: 50px; height: 50px; background: #0a0f14; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: 2px solid #333; }
    .cand-info { flex: 1; }
    .cand-name { font-weight: 900; font-size: 16px; color: #fff; margin-bottom: 4px; }
    .cand-role { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .cand-stars { color: #ffd700; font-size: 12px; letter-spacing: 2px; margin-bottom: 6px; }
    .cand-salary { font-size: 13px; font-weight: 900; color: #00ff88; }
    
    .btn-hire { background: #4facfe; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .btn-hire:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* --- НИЖНЯЯ ПАНЕЛЬ --- */
    .bottom-bar { height: 65px; background: #111a22; border-top: 2px solid #1f2d3d; display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .main-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; box-shadow: 0 5px 20px rgba(79,172,254,0.4); flex: 1; max-width: 140px; justify-content: center; }
    .main-btn.team { background: linear-gradient(135deg, #8E2DE2, #4A00E0); box-shadow: 0 5px 20px rgba(142,45,226,0.4); color: #fff; }
    .main-btn:active { transform: scale(0.95); }

    /* Подсказка */
    .hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #00ff88; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 50; display: none; border: 1px solid #00ff88; text-align: center; width: 90%; max-width: 300px; }
    .hint.active { display: block; }
  </style>
</head>
<body>

  <div class="rotate-warning">
    <div class="icon">📱</div>
    <div style="font-size: 20px; font-weight: 900; color: #4facfe; margin-bottom: 10px;">Поверни телефон</div>
    <div style="font-size: 14px; color: #aaa;">Для лучшего 3D-обзора играй в горизонтальном режиме</div>
  </div>

  <div class="top-bar">
    <div class="stat-box">
      <div class="stat">
        <span class="stat-label">Баланс</span>
        <span class="stat-val" id="ui-money">$200,000</span>
      </div>
      <div class="stat">
        <span class="stat-label">Исследования</span>
        <span class="stat-val rp" id="ui-rp">0 RP</span>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <div class="stat">
            <span class="stat-label">Столы / Люди</span>
            <span class="stat-val" id="ui-desks" style="color:#fff; text-shadow:none;">0 / 0</span>
        </div>
        <button class="btn-icon" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>

  <div id="game-container">
    <div class="hint" id="build-hint">Тапни по полу, чтобы поставить</div>
  </div>

  <!-- МЕНЮ СТРОЙКИ -->
  <div class="build-panel" id="build-panel">
    <div class="build-header">
      <div class="build-title">🛠 Строительство</div>
      <button class="btn-done" onclick="closeBuildMenu()">Done</button>
    </div>
    <div class="build-items">
      <!-- Стол -->
      <div class="item" id="item-desk" onclick="selectItem('desk', 15000)">
        <div class="icon-desk">
          <div class="monitor"></div>
          <div class="board"></div>
        </div>
        <div class="item-title">Рабочий стол</div>
        <div class="item-price">$15.0K</div>
      </div>
      <!-- Стул (Добавим в следующей части логику) -->
      <div class="item" id="item-chair" onclick="selectItem('chair', 2000)">
        <div class="icon-desk" style="justify-content:center;">
           <div style="width:20px; height:20px; background:#5a3a1b; border-radius:4px; border-bottom:10px solid #3a201b;"></div>
        </div>
        <div class="item-title">Деревянный стул</div>
        <div class="item-price">$2.0K</div>
      </div>
    </div>
  </div>

  <!-- ПАНЕЛЬ КОМАНДЫ (Как на скрине) -->
  <div class="team-panel" id="team-panel">
    <div class="team-header">
      <div class="team-title">👥 Найм сотрудников</div>
      <button class="btn-done" onclick="closeTeamPanel()">Закрыть</button>
    </div>
    
    <div class="team-tabs">
      <button class="team-tab active" onclick="switchTeamTab('researcher')">🔬 Исследователи</button>
      <button class="team-tab fixer" onclick="switchTeamTab('fixer')">🔧 Исправители ошибок</button>
    </div>

    <div class="team-list" id="team-list">
      <!-- Сюда JS будет добавлять карточки кандидатов -->
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="bottom-bar">
    <button class="main-btn" onclick="openBuildMenu()">🛠 Стройка</button>
    <button class="main-btn team" onclick="openTeamPanel()">👥 Команда</button>
  </div>

  <script>
  // Определяем мобилку
if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    document.body.classList.add('is-mobile');
}

// --- 1. СОСТОЯНИЕ ---
let state = {
    money: 200000,
    rp: 0,
    objects: [], // {x, z, type, id}
    employees: [], // {id, mesh, status: 'walking'|'working', type: 'researcher'|'fixer', targetDesk}
    maxDesks: 5
};
let buildMode = false;
let selectedItem = null;
let activeTeamTab = 'researcher';
let currentCandidates = [];

// --- 2. НАСТРОЙКИ СЦЕНЫ ---
const container = document.getElementById('game-container');
const scene = new THREE.Scene();

// Небо (голубое)
scene.background = new THREE.Color(0x87CEEB); 

// Камера
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(8, 8, 8);

// Рендерер
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Управление
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.1;
controls.minDistance = 4;
controls.maxDistance = 20;

// --- 3. ОСВЕЩЕНИЕ ---
scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 

// Солнечный свет
const sunLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// --- 4. КОМНАТА (Кофейные стены, прозрачное стекло) ---
const floorGeo = new THREE.PlaneGeometry(10, 10);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a3b4c, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const gridHelper = new THREE.GridHelper(10, 10, 0x4facfe, 0x1f2d3d);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Стены (Кофейный / деревянный цвет)
const wallMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 });

const wallBack = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.2), wallMat);
wallBack.position.set(0, 1.5, -5);
wallBack.receiveShadow = true;
scene.add(wallBack);

const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 10), wallMat);
wallLeft.position.set(-5, 1.5, 0);
wallLeft.receiveShadow = true;
scene.add(wallLeft);

// Окно (Стекло)
const windowMat = new THREE.MeshPhysicalMaterial({ 
    color: 0xffffff, 
    transparent: true, 
    opacity: 0.3, 
    transmission: 0.9, // Пропускает свет
    roughness: 0.1,
    side: THREE.DoubleSide
});
const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 0.1), windowMat);
windowMesh.position.set(0, 1.8, -4.88);
scene.add(windowMesh);

// Рама окна
const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const frameTop = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.1, 0.2), frameMat);
frameTop.position.set(0, 2.6, -4.88);
scene.add(frameTop);
const frameBottom = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.1, 0.2), frameMat);
frameBottom.position.set(0, 1.0, -4.88);
scene.add(frameBottom);

// Облака снаружи
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
for(let i = 0; i < 4; i++) {
    const cloud = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.2), cloudMat);
    cloud.position.set(-2 + i*1.5, 1.5 + Math.random() * 1.5, -6.5);
    scene.add(cloud);
}

// --- 5. МОДЕЛИ (Стол со старым монитором, стул) ---
function createWorkstation(x, z) {
    const group = new THREE.Group();

    // 1. Стол (Деревянная столешница)
    const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.8), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 }));
    top.position.y = 0.6; top.castShadow = true; top.receiveShadow = true; group.add(top);
    
    const legGeo = new THREE.BoxGeometry(0.08, 0.6, 0.08);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1b });
    [[-0.5, 0.3, -0.3], [0.5, 0.3, -0.3], [-0.5, 0.3, 0.3], [0.5, 0.3, 0.3]].forEach(pos => {
        const leg = new THREE.Mesh(legGeo, legMat); leg.position.set(...pos); leg.castShadow = true; group.add(leg);
    });

    // 2. Старый CRT Монитор
    const monitorBox = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x888888 })); // Серый корпус
    monitorBox.position.set(0, 0.85, -0.2); monitorBox.castShadow = true; group.add(monitorBox);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.35), new THREE.MeshBasicMaterial({ color: 0x00ff88 })); // Зеленый ЭЛТ экран
    screen.position.set(0, 0.85, 0.01); group.add(screen); // Выдвинут вперед

    // 3. Деревянный стул
    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    chairSeat.position.set(0, 0.4, 0.6); chairSeat.castShadow = true; group.add(chairSeat);
    
    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.05), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    chairBack.position.set(0, 0.6, 0.78); chairBack.castShadow = true; group.add(chairBack);

    const chairLegGeo = new THREE.BoxGeometry(0.05, 0.4, 0.05);
    [[-0.15, 0.2, 0.45], [0.15, 0.2, 0.45], [-0.15, 0.2, 0.75], [0.15, 0.2, 0.75]].forEach(pos => {
        const leg = new THREE.Mesh(chairLegGeo, legMat); leg.position.set(...pos); leg.castShadow = true; group.add(leg);
    });

    group.position.set(x, 0, z);
    scene.add(group);
    return group;
}

// --- 6. ПЕРСОНАЖ (С анимацией сидения) ---
function createCharacter(x, z) {
    const charGroup = new THREE.Group();
    
    // Ноги
    const legMat = new THREE.MeshStandardMaterial({ color: 0x00ff88 }); // Зеленые штаны
    const legGeo = new THREE.BoxGeometry(0.15, 0.4, 0.15);
    const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.1, 0.2, 0); legL.castShadow = true;
    const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(0.1, 0.2, 0); legR.castShadow = true;
    charGroup.add(legL, legR);

    // Тело
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.2), new THREE.MeshStandardMaterial({ color: 0x4facfe })); // Синяя футболка
    body.position.set(0, 0.625, 0); body.castShadow = true; charGroup.add(body);

    // Руки
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd700 }); // Желтая кожа
    const armGeo = new THREE.BoxGeometry(0.12, 0.4, 0.12);
    const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.26, 0.65, 0); armL.castShadow = true;
    const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.26, 0.65, 0); armR.castShadow = true;
    charGroup.add(armL, armR);

    // Голова + Лицо
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), skinMat);
    head.position.set(0, 0.95, 0); head.castShadow = true; charGroup.add(head);
    
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffd700'; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(40, 50, 8, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(88, 50, 8, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(64, 70, 25, 0, Math.PI, false); ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.stroke();
    const texture = new THREE.CanvasTexture(canvas);
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.29, 0.29), new THREE.MeshBasicMaterial({ map: texture }));
    facePlane.position.set(0, 0.95, 0.151); charGroup.add(facePlane);

    charGroup.position.set(x, 0, z);
    scene.add(charGroup);
    return charGroup;
}

// --- 7. ЛОГИКА 3D (Клики по полу) ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

container.addEventListener('pointerdown', (e) => {
    if (!buildMode || !selectedItem) return;

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(floor);

    if (intersects.length > 0) {
        const point = intersects[0].point;
        const gridX = Math.round(point.x) - 0.5; 
        const gridZ = Math.round(point.z) - 0.5;

        // Проверка занятости (учитываем, что стол теперь включает стул)
        if (state.objects.some(o => o.x === gridX && o.z === gridZ)) {
            alert("Здесь уже занято!"); return;
        }
        const deskCount = state.objects.length;
        if (deskCount >= state.maxDesks) {
            alert(`Лимит мебели (${state.maxDesks})!`); return;
        }
        
        // Строим рабочий стол со стулом
        state.money -= selectedItem.price;
        state.objects.push({ x: gridX, z: gridZ });
        createWorkstation(gridX, gridZ);
        
        updateUI();
        saveLocal();
        closeBuildMenu();
    }
});

// --- 8. ПАНЕЛЬ НАЙМА (UI) ---
function openTeamPanel() {
    document.getElementById('team-panel').classList.add('active');
    generateCandidates();
}

function closeTeamPanel() {
    document.getElementById('team-panel').classList.remove('active');
}

function switchTeamTab(tab) {
    activeTeamTab = tab;
    document.querySelectorAll('.team-tab').forEach(t => t.classList.remove('active'));
    if (tab === 'researcher') document.querySelectorAll('.team-tab')[0].classList.add('active');
    else document.querySelectorAll('.team-tab')[1].classList.add('active');
    generateCandidates();
}

function generateCandidates() {
    const list = document.getElementById('team-list');
    list.innerHTML = '';
    currentCandidates = [];

    // Генерируем 5 случайных кандидатов нужного типа
    for (let i = 0; i < 5; i++) {
        const name = ["Alex", "Max", "Sam", "John", "Igor", "Kot", "Doge", "Pepe"][Math.floor(Math.random()*8)] + Math.floor(Math.random()*100);
        const stars = Math.floor(Math.random() * 3) + 3; // 3-5 звезд
        const salary = (stars * 1000) + Math.floor(Math.random() * 5000);

        const cand = { id: Date.now()+i, name, stars, salary, type: activeTeamTab };
        currentCandidates.push(cand);

        // Отрисовка карточки
        const card = document.createElement('div');
        card.className = 'candidate-card';
        card.innerHTML = `
            <div class="cand-avatar" style="border-color: ${activeTeamTab === 'researcher' ? '#4facfe' : '#ff0055'}">${activeTeamTab === 'researcher' ? '🔬' : '🔧'}</div>
            <div class="cand-info">
                <div class="cand-name">${name}</div>
                <div class="cand-role">${activeTeamTab === 'researcher' ? 'Исследователь' : 'Исправитель ошибок'}</div>
                <div class="cand-stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
                <div class="cand-salary">$${salary.toLocaleString()} / мес</div>
            </div>
            <button class="btn-hire" onclick="hireEmployee(${cand.id})">Нанять</button>
        `;
        list.appendChild(card);
    }
}

function hireEmployee(candId) {
    const cand = currentCandidates.find(c => c.id === candId);
    if (state.money < cand.salary) {
        alert("Недостаточно денег для найма (нужна зарплата за месяц)!"); return;
    }

    // Ищем свободный стол (у которого нет работника)
    const freeDesk = state.objects.find(o => 
        !state.employees.some(e => e.targetX === o.x && e.targetZ === o.z)
    );

    if (!freeDesk) {
        alert("Нет свободных рабочих мест! Постройте еще стол."); return;
    }

    // Списываем деньги (за первый месяц)
    state.money -= cand.salary;

    // Создаем 3D модель
    const charMesh = createCharacter(-4, 4); // Спавн у входа
    
    // Добавляем в стейт
    state.employees.push({
        id: cand.id,
        mesh: charMesh,
        status: 'walking',
        type: cand.type,
        targetX: freeDesk.x,
        targetZ: freeDesk.z
    });

    closeTeamPanel();
    updateUI();
}

// --- 9. ИГРОВОЙ ЦИКЛ (Анимация ходьбы и сидения) ---
function animate() {
    requestAnimationFrame(animate);

    state.employees.forEach(emp => {
        if (emp.status === 'walking') {
            // Идем к стулу (стул находится на +0.6 по Z от центра стола)
            const targetX = emp.targetX;
            const targetZ = emp.targetZ + 0.6; 
            
            const dx = targetX - emp.mesh.position.x;
            const dz = targetZ - emp.mesh.position.z;
            const distance = Math.sqrt(dx*dx + dz*dz);

            if (distance > 0.1) {
                const speed = 0.05;
                emp.mesh.position.x += (dx / distance) * speed;
                emp.mesh.position.z += (dz / distance) * speed;
                emp.mesh.rotation.y = Math.atan2(dx, dz);
                
                // Анимация покачивания при ходьбе
                emp.mesh.position.y = Math.abs(Math.sin(Date.now() * 0.01)) * 0.1;
            } else {
                // Дошли до стула - САДИМСЯ
                emp.status = 'working';
                emp.mesh.position.y = -0.2; // Опускаем тело, чтобы сесть на стул
                emp.mesh.rotation.y = Math.PI; // Разворачиваем лицом к монитору (лицом к -Z)
            }
        }
    });

    controls.update();
    renderer.render(scene, camera);
}

// --- 10. ЭКОНОМИКА (Начисление дохода) ---
setInterval(() => {
    let income = 0;
    let rpGain = 0;

    state.employees.forEach(emp => {
        if (emp.status === 'working') {
            if (emp.type === 'researcher') rpGain += 5; // Исследователи дают RP
            else income += 250; // Фиксеры дают бабки
        }
    });

    if (income > 0 || rpGain > 0) {
        state.money += income;
        state.rp += rpGain;
        updateUI();
    }
}, 1000);

// --- 11. UI И СОХРАНЕНИЯ ---
function updateUI() {
    document.getElementById('ui-money').innerText = '$' + Math.floor(state.money).toLocaleString('ru-RU');
    document.getElementById('ui-rp').innerText = Math.floor(state.rp).toLocaleString('ru-RU') + ' RP';
    document.getElementById('ui-desks').innerText = `${state.objects.length} / ${state.employees.length}`;
}

function openBuildMenu() {
    document.getElementById('build-panel').classList.add('active');
    document.getElementById('build-hint').classList.remove('active');
    buildMode = false; 
}

function closeBuildMenu() {
    document.getElementById('build-panel').classList.remove('active');
    document.getElementById('build-hint').classList.remove('active');
    buildMode = false;
    selectedItem = null;
    document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
}

function selectItem(type, price) {
    if (state.money < price) { alert("Недостаточно денег!"); return; }
    selectedItem = { type, price };
    buildMode = true;
    document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
    if(type === 'desk') document.getElementById('item-desk').classList.add('selected');
    else document.getElementById('item-chair').classList.add('selected');
    
    document.getElementById('build-panel').classList.remove('active');
    document.getElementById('build-hint').classList.add('active');
}

function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
    else document.exitFullscreen();
}

function saveLocal() {
    localStorage.setItem('tech_empire_v9', JSON.stringify({
        money: state.money,
        rp: state.rp,
        objects: state.objects
    }));
}

function loadLocal() {
    const saved = localStorage.getItem('tech_empire_v9');
    if (saved) {
        const data = JSON.parse(saved);
        state.money = data.money;
        state.rp = data.rp;
        state.objects = data.objects;
        state.objects.forEach(obj => createWorkstation(obj.x, obj.z));
    }
    updateUI();
}

window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

window.onload = () => {
    loadLocal();
    animate();
};
  </script>
</body>
