<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Роблокс-Биржа 📈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f2027;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #203a43;
      padding: 15px 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: sticky;
      top: 15px;
      z-index: 50;
    }

    .balance { font-size: 22px; font-weight: bold; color: #00ff00; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
    .balance-label { font-size: 12px; color: #aaa; display: block; margin-bottom: 2px; }

    .games-list {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding-bottom: 40px;
    }

    .game-card {
      background: #203a43;
      border-radius: 15px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2c5364;
      transition: 0.2s;
      cursor: pointer;
      position: relative;
    }
    
    .game-card:hover { border-color: #4facfe; transform: scale(1.03); }

    /* РАМКА ДЛЯ ИКОНКИ */
    .icon-box {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #2c5364, #203a43);
      border-radius: 16px; /* Квадрат с закругленными углами */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .game-icon {
      font-size: 34px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    .game-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; text-align: center; min-height: 34px; display: flex; align-items: center; justify-content: center;}
    .game-online { font-size: 12px; color: #4facfe; font-weight: bold; text-align: center; }
    .game-price { font-size: 13px; color: #ffe066; margin-top: 5px; text-align: center; font-weight: bold;}
    
    .bought-badge {
      position: absolute; top: 5px; right: 5px;
      font-size: 10px; background: #ffeb3b; color: #000; 
      padding: 2px 5px; border-radius: 5px; font-weight: bold;
    }

    /* --- МОДАЛЬНОЕ ОКНО --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(5px); padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #1a1a24; padding: 20px; border-radius: 20px;
      width: 100%; max-width: 400px; border: 2px solid #4facfe;
      display: flex; flex-direction: column; gap: 15px;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 5px;}
    
    /* Рамка для большой иконки */
    .icon-box-large {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #2c5364, #203a43);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 5px 15px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-icon { font-size: 50px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }

    .modal-title { font-size: 22px; font-weight: bold; text-align: center; }
    
    .chart-container {
      width: 100%; height: 150px; background: #0f2027;
      border-radius: 10px; border: 1px solid #333; position: relative; overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .modal-stats { display: flex; justify-content: space-between; font-size: 15px; color: #aaa; padding: 0 10px;}
    
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

    .btn {
      padding: 12px; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; font-size: 14px; flex: 1; transition: 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-buy { background: #00ff00; color: #000; }
    .btn-buy:disabled { background: #555; color: #888; cursor: not-allowed; }
    .btn-sell { background: #ff0055; color: #fff; }
    .btn-sell:disabled { background: #555; color: #888; cursor: not-allowed; }
    
    .btn-close { background: transparent; border: 1px solid #555; color: #aaa; flex: none; width: 100%; margin-top: 5px;}
    .btn-close:active { background: #333; }

    .notification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: rgba(0,0,0,0.9); padding: 10px 20px; border-radius: 10px;
      font-weight: bold; border: 1px solid #fff; transition: transform 0.3s; z-index: 200;
    }
    .notification.show { transform: translateX(-50%) translateY(0); }
    .notification.good { border-color: #00ff00; color: #00ff00; }
    .notification.bad { border-color: #ff0055; color: #ff0055; }

  </style>
</head>
<body>

  <div class="header">
    <div>
      <span class="balance-label">Твой баланс:</span>
      <span class="balance" id="balance">0</span> 💵
    </div>
    <div style="font-size: 24px;">📈</div>
  </div>

  <div class="games-list" id="games-list"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="icon-box-large">
          <div class="modal-icon" id="modal-icon">🎮</div>
        </div>
        <div class="modal-title" id="modal-title">Название</div>
      </div>
      
      <div class="chart-container">
        <canvas id="modal-chart"></canvas>
      </div>

      <div class="modal-stats">
        <span>Онлайн: <strong id="modal-online" style="color:#4facfe;">0</strong></span>
        <span>Цена: <strong id="modal-price" style="color:#ffe066;">0</strong> 💵</span>
      </div>

      <div id="modal-portfolio" style="font-size: 13px; color: #aaa; text-align: center;"></div>

      <div class="modal-actions">
        <button class="btn btn-buy" id="modal-btn-buy">Купить</button>
        <button class="btn btn-sell" id="modal-btn-sell">Продать</button>
      </div>

      <button class="btn btn-close" id="modal-btn-close">Закрыть</button>
    </div>
  </div>

  <div class="notification" id="notification"></div>

  <script>
    // 25 ИГР
    const gamesData = [
      { id: 'grow', name: 'Grow a Garden', icon: '🌱', online: 650000, history: [] },
      { id: 'steal', name: 'Steal a Brainrot', icon: '🧠', online: 480000, history: [] },
      { id: 'brook', name: 'Brookhaven', icon: '🏡', online: 350000, history: [] },
      { id: 'adopt', name: 'Adopt Me!', icon: '🐶', online: 220000, history: [] },
      { id: 'blox', name: 'Blox Fruits', icon: '🍎', online: 180000, history: [] },
      { id: 'dress', name: 'Dress to Impress', icon: '👗', online: 150000, history: [] },
      { id: 'piggy', name: 'Piggy', icon: '🐷', online: 120000, history: [] },
      { id: 'doors', name: 'DOORS', icon: '👁️', online: 85000, history: [] },
      { id: 'bedwars', name: 'BedWars', icon: '🛏️', online: 60000, history: [] },
      { id: 'jail', name: 'Jailbreak', icon: '🚓', online: 45000, history: [] },
      { id: 'arsenal', name: 'Arsenal', icon: '🔫', online: 35000, history: [] },
      { id: 'tower', name: 'Tower Defense', icon: '🏰', online: 25000, history: [] },
      { id: 'murder', name: 'Murder Mystery', icon: '🔪', online: 18000, history: [] },
      { id: 'royale', name: 'Royale High', icon: '👑', online: 12000, history: [] },
      { id: 'speed', name: 'Speed Run 4', icon: '🏃', online: 8000, history: [] },
      { id: 'theme', name: 'Theme Park Tycoon', icon: '🎢', online: 5000, history: [] },
      { id: 'work', name: 'Pizza Place', icon: '🍕', online: 3500, history: [] },
      { id: 'survive', name: 'Survive Disasters', icon: '🌪️', online: 1500, history: [] },
      { id: 'natural', name: 'Natural Disaster', icon: '🌋', online: 900, history: [] },
      { id: 'obby', name: 'Mega Easy Obby', icon: '🌈', online: 500, history: [] },
      { id: 'escape', name: 'Escape Dungeon', icon: '🗝️', online: 300, history: [] },
      { id: 'stone', name: 'Симулятор Камня', icon: '🪨', online: 150, history: [] },
      { id: 'box', name: 'Симулятор Коробки', icon: '📦', online: 80, history: [] },
      { id: 'dead', name: 'Особняк', icon: '🏚️', online: 35, history: [] },
      { id: 'void', name: 'Пустота', icon: '🕳️', online: 10, history: [] }
    ];

    let balance = 1000000; // Стартовый баланс 1 млн, так как цены = онлайн
    let portfolio = {}; 
    
    const balanceEl = document.getElementById('balance');
    const gamesListEl = document.getElementById('games-list');
    const notifEl = document.getElementById('notification');
    const modalOverlay = document.getElementById('modal');
    const modalChart = document.getElementById('modal-chart');
    const ctx = modalChart.getContext('2d');

    let activeGameId = null;

    // Загрузка
    const saved = localStorage.getItem('robloxExchangeV4');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        balance = data.balance !== undefined ? data.balance : 1000000;
        portfolio = data.portfolio || {};
        if (data.gamesData) {
          data.gamesData.forEach(savedGame => {
            const game = gamesData.find(g => g.id === savedGame.id);
            if (game) {
              game.online = savedGame.online;
              game.history = savedGame.history || [];
            }
          });
        }
      } catch(e) {}
    }

    // Инициализация истории
    gamesData.forEach(game => {
      if (game.history.length === 0) {
        for (let i = 0; i < 20; i++) game.history.push(game.online);
      }
    });

    function formatMoney(num) {
      return Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function showNotification(text, type) {
      notifEl.textContent = text;
      notifEl.className = `notification show ${type}`;
      setTimeout(() => { notifEl.className = 'notification'; }, 2000);
    }

    function saveGame() {
      localStorage.setItem('robloxExchangeV4', JSON.stringify({ balance, portfolio, gamesData }));
    }

    // Цена = Онлайн (как ты и просил)
    function getPrice(game) {
      return game.online;
    }

    function renderGames() {
      gamesListEl.innerHTML = '';
      balanceEl.textContent = formatMoney(balance);

      gamesData.forEach(game => {
        const bought = portfolio[game.id];
        const price = getPrice(game);
        
        const lastOnline = game.history[game.history.length - 1];
        const prevOnline = game.history[game.history.length - 2] || lastOnline;
        const isGrowing = lastOnline >= prevOnline;
        const trendColor = isGrowing ? '#00ff00' : '#ff0055';
        const trendArrow = isGrowing ? '▲' : '▼';

        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openModal(game.id);
        
        card.innerHTML = `
          <div class="icon-box">
            <div class="game-icon">${game.icon}</div>
          </div>
          <div class="game-title">${game.name}</div>
          <div class="game-online">${formatMoney(game.online)} <span style="color:${trendColor}">${trendArrow}</span></div>
          <div class="game-price">${formatMoney(price)} 💵</div>
          ${bought ? `<div class="bought-badge">${bought.shares} шт.</div>` : ''}
        `;
        gamesListEl.appendChild(card);
      });
    }

    function drawChart(game) {
      modalChart.width = modalChart.offsetWidth;
      modalChart.height = modalChart.offsetHeight;
      ctx.clearRect(0, 0, modalChart.width, modalChart.height);
      
      const history = game.history;
      const max = Math.max(...history) * 1.1;
      const min = Math.min(...history) * 0.9;
      const range = max - min || 1;

      ctx.beginPath();
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';

      for (let i = 0; i < history.length; i++) {
        const x = (i / (history.length - 1)) * modalChart.width;
        const y = modalChart.height - ((history[i] - min) / range) * modalChart.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.lineTo(modalChart.width, modalChart.height);
      ctx.lineTo(0, modalChart.height);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
      ctx.fill();
    }

    function openModal(id) {
      activeGameId = id;
      const game = gamesData.find(g => g.id === id);
      if (!game) return;

      document.getElementById('modal-title').textContent = game.name;
      document.getElementById('modal-icon').textContent = game.icon;
      updateModalUI();
      
      modalOverlay.classList.add('active');
      setTimeout(() => drawChart(game), 50);
    }

    function updateModalUI() {
      if (!activeGameId) return;
      const game = gamesData.find(g => g.id === activeGameId);
      if (!game) return;

      const price = getPrice(game);
      document.getElementById('modal-online').textContent = formatMoney(game.online);
      document.getElementById('modal-price').textContent = formatMoney(price);

      const portfolioEl = document.getElementById('modal-portfolio');
      const bought = portfolio[game.id];

      if (bought) {
        portfolioEl.innerHTML = `У тебя: <strong>${bought.shares}</strong> акций.<br>Ср. цена: <strong>${formatMoney(bought.avgPrice)}</strong> 💵`;
      } else {
        portfolioEl.innerHTML = `У тебя нет акций этой игры.`;
      }

      document.getElementById('modal-btn-buy').disabled = balance < price;
      document.getElementById('modal-btn-sell').disabled = !bought;
    }

    document.getElementById('modal-btn-buy').onclick = () => {
      const game = gamesData.find(g => g.id === activeGameId);
      const price = getPrice(game);
      
      if (balance >= price) {
        balance -= price;
        if (!portfolio[game.id]) portfolio[game.id] = { shares: 0, avgPrice: 0 };
        
        const totalCost = (portfolio[game.id].shares * portfolio[game.id].avgPrice) + price;
        portfolio[game.id].shares++;
        portfolio[game.id].avgPrice = totalCost / portfolio[game.id].shares;
        
        showNotification(`Куплено! -${formatMoney(price)} 💵`, 'good');
        updateModalUI();
        renderGames();
        saveGame();
      }
    };

    document.getElementById('modal-btn-sell').onclick = () => {
      const game = gamesData.find(g => g.id === activeGameId);
      const price = getPrice(game);
      
      if (portfolio[game.id] && portfolio[game.id].shares > 0) {
        const avgPrice = portfolio[game.id].avgPrice;
        const profit = price - avgPrice;
        
        balance += price;
        portfolio[game.id].shares--;
        
        if (portfolio[game.id].shares === 0) delete portfolio[game.id];

        if (profit > 0) showNotification(`Продано! +${formatMoney(profit)} 💵`, 'good');
        else showNotification(`Продано в минус: ${formatMoney(profit)} 💵`, 'bad');

        updateModalUI();
        renderGames();
        saveGame();
      }
    };

    document.getElementById('modal-btn-close').onclick = () => {
      modalOverlay.classList.remove('active');
      activeGameId = null;
    };

    modalOverlay.onclick = (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        activeGameId = null;
      }
    };

    setInterval(() => {
      gamesData.forEach(game => {
        const isDead = game.online < 10000;
        const volatility = isDead ? 0.4 : 0.15;
        const change = (Math.random() * volatility * 2) - volatility;
        game.online = Math.floor(game.online * (1 + change));
        
        if (game.online < 5) game.online = 5; 
        if (game.online > 2000000) game.online = 2000000;

        game.history.push(game.online);
        if (game.history.length > 30) game.history.shift();
      });

      renderGames();
      if (activeGameId) {
        updateModalUI();
        const game = gamesData.find(g => g.id === activeGameId);
        drawChart(game);
      }
      saveGame();
    }, 2000);

    renderGames();
  </script>
</body>
</html>
