<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Роблокс-Биржа</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f2027;
      background-image: linear-gradient(to bottom, #203a43, #0f2027);
      color: white;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* --- ШАПКА --- */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 32, 39, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-bottom: 1px solid rgba(79, 172, 254, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 10px;
    }

    .header-top {
      display: flex; justify-content: space-between; align-items: center;
    }

    .balance-box {
      display: flex; flex-direction: column;
    }
    .balance-label { font-size: 11px; color: #888; text-transform: uppercase; }
    .balance-val { font-size: 24px; font-weight: bold; color: #00ff00; text-shadow: 0 0 10px rgba(0,255,0,0.3); transition: 0.2s; }
    .balance-val.negative { color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.3); }

    .actions-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px;
    }
    .actions-bar::-webkit-scrollbar { display: none; }

    .btn-action {
      flex: 1; min-width: 120px;
      padding: 10px;
      border: none; border-radius: 10px;
      font-weight: bold; font-size: 12px; cursor: pointer;
      transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-action:active { transform: scale(0.95); }
    
    .btn-reset { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
    .btn-create { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #00ff00; }
    .btn-create:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }

    /* --- СЕТКА ИГР --- */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .game-card {
      background: rgba(32, 58, 67, 0.8);
      border: 1px solid #2c5364;
      border-radius: 16px;
      padding: 15px 10px;
      display: flex; flex-direction: column; align-items: center;
      transition: 0.2s; position: relative; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .game-card:hover { border-color: #4facfe; transform: translateY(-3px); }
    
    /* Стиль для твоей созданной игры */
    .game-card.custom-game {
      border: 2px dashed #ffeb3b;
      background: linear-gradient(135deg, rgba(255, 235, 59, 0.1), rgba(32, 58, 67, 0.8));
      box-shadow: 0 0 15px rgba(255, 235, 59, 0.2);
    }

    .game-icon { font-size: 40px; margin-bottom: 8px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5)); }
    .game-name { font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 5px; height: 32px; display: flex; align-items: center; justify-content: center; }
    
    .game-online { font-size: 12px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
    .trend-up { color: #00ff00; }
    .trend-down { color: #ff0055; }
    
    .game-price { font-size: 15px; font-weight: bold; color: #ffd700; margin-bottom: 10px; }
    
    .portfolio-info {
      font-size: 11px; color: #aaa; margin-bottom: 10px; text-align: center;
      background: rgba(0,0,0,0.3); padding: 4px; border-radius: 6px; width: 100%;
    }

    .trade-controls {
      display: flex; gap: 5px; width: 100%;
    }
    .btn-trade {
      flex: 1; padding: 8px 0; border: none; border-radius: 8px;
      font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.1s;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .btn-trade:active { transform: scale(0.9); }
    .btn-buy { background: #00b09b; }
    .btn-sell { background: #cb2d3e; }
    
    .btn-upgrade {
      width: 100%; margin-top: 8px; padding: 8px 0; border: none; border-radius: 8px;
      background: linear-gradient(90deg, #8E2DE2, #4A00E0); color: #fff; font-weight: bold; font-size: 12px; cursor: pointer;
      box-shadow: 0 0 10px rgba(142, 45, 226, 0.5); transition: 0.2s;
    }
    .btn-upgrade:active { transform: scale(0.95); }

    /* ПЛАВАЮЩИЙ ТЕКСТ (ДЛЯ ПРИБЫЛИ/УБЫТКА) */
    .floating-income {
      position: fixed; font-size: 20px; font-weight: bold; pointer-events: none;
      animation: floatUp 1.5s ease-out forwards; z-index: 999; text-shadow: 2px 2px 0 #000;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="balance-box">
        <div class="balance-label">Баланс</div>
        <div class="balance-val" id="balance-display">0 💵</div>
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn-action btn-create" onclick="createGame()" id="btn-create">➕ Создать игру</button>
      <button class="btn-action btn-reset" onclick="resetGame()">🔄 Сброс</button>
    </div>
  </div>

  <div class="games-grid" id="games-grid"></div>

  <script>
    const SAVE_KEY = 'ROBLOX_EXCHANGE_ALPHA_SAVE';

    // Базовые игры
    const BASE_GAMES = [
      { id: 'grow_a_garden', name: 'Grow a Garden', icon: '🌱', baseOnline: 1058604 },
      { id: 'dress_to_impress', name: 'Dress to Impress', icon: '👗', baseOnline: 473514 },
      { id: 'steal_a_brainrot', name: 'Steal a Brainrot', icon: '🧠', baseOnline: 424918 },
      { id: 'brookhaven', name: 'Brookhaven', icon: '🏡', baseOnline: 385126 },
      { id: 'adopt_me', name: 'Adopt Me!', icon: '🐶', baseOnline: 306463 },
      { id: 'blox_fruits', name: 'Blox Fruits', icon: '🍎', baseOnline: 278081 },
      { id: 'doors', name: 'Doors', icon: '🚪', baseOnline: 150000 },
      { id: 'piggy', name: 'Piggy', icon: '🐷', baseOnline: 120000 },
      { id: 'arsenal', name: 'Arsenal', icon: '🔫', baseOnline: 90000 },
      { id: 'jailbreak', name: 'Jailbreak', icon: '🚓', baseOnline: 80000 }
      // ... остальные базовые игры (сокращено для читаемости, система работает с любым кол-вом)
    ];

    let state = {
      balance: 1000,
      portfolio: {}, // { gameId: { shares: 0 } }
      gamesData: [], // Тут храним ВСЕ игры (и базовые, и созданные)
      nextGamePrice: 10000 // Стартовая цена создания
    };

    let gameLoopInterval = null;

    function init() {
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          
          // ЗАЩИТА: Если ключи не совпадают с новой структурой, восстанавливаем базу
          state.balance = parsed.balance !== undefined ? parsed.balance : 1000;
          state.portfolio = parsed.portfolio || {};
          state.nextGamePrice = parsed.nextGamePrice !== undefined ? parsed.nextGamePrice : 10000;
          
          // Если массив игр пуст или сломан, берем базовые
          if (!parsed.gamesData || parsed.gamesData.length === 0) {
            state.gamesData = JSON.parse(JSON.stringify(BASE_GAMES));
          } else {
            state.gamesData = parsed.gamesData;
          }
          
        } catch(e) {
          console.error("Сейв сломан, создаем новый.");
          state.gamesData = JSON.parse(JSON.stringify(BASE_GAMES));
        }
      } else {
        // Первый запуск
        state.gamesData = JSON.parse(JSON.stringify(BASE_GAMES));
        state.gamesData.forEach(g => g.online = g.baseOnline);
      }

      updateUI();
      startGameLoop();
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    // Функция для создания своей игры
    function createGame() {
      if (state.balance < state.nextGamePrice) {
        alert(`Недостаточно средств! Нужно: ${state.nextGamePrice.toLocaleString('ru-RU')} 💵`);
        return;
      }

      state.balance -= state.nextGamePrice;

      const newGameId = 'custom_' + Date.now();
      const newGame = {
        id: newGameId,
        name: 'Твоя игра ' + (state.gamesData.filter(g => g.id.startsWith('custom_')).length + 1),
        icon: '🛠️',
        baseOnline: 100, // Начальный онлайн
        online: 100,
        trend: 'up',
        isCustom: true,
        upgrades: 0
      };

      state.gamesData.push(newGame);
      
      // Увеличиваем цену следующей игры на 50к
      state.nextGamePrice += 50000;

      updateUI();
      saveGame();
      startGameLoop(); // Перезапускаем цикл, чтобы новая игра начала генерить доход
    }

    // Улучшение (Обнова) своей игры
    function upgradeGame(gameId) {
      const game = state.gamesData.find(g => g.id === gameId);
      if (!game) return;

      const upgradeCost = state.nextGamePrice; // Цена обновы = цене следующей игры

      if (state.balance < upgradeCost) {
        alert(`Недостаточно средств для обновы! Нужно: ${upgradeCost.toLocaleString('ru-RU')} 💵`);
        return;
      }

      state.balance -= upgradeCost;
      
      // Апгрейд: даем +10 к активу (базовому онлайну) и немного подкидываем текущий онлайн
      game.upgrades = (game.upgrades || 0) + 1;
      game.baseOnline += 10; 
      game.online += 10;

      updateUI();
      saveGame();
    }

    // Покупка/продажа акций
    function buy(gameId) {
      const game = state.gamesData.find(g => g.id === gameId);
      if (!game) return;

      const price = game.online;
      if (state.balance < price) {
        showFloatIncome('-', price, '#ff0055', event.target);
        return;
      }

      state.balance -= price;
      state.portfolio[gameId] = state.portfolio[gameId] || { shares: 0 };
      state.portfolio[gameId].shares += 1;

      updateUI();
      saveGame();
    }

    function sell(gameId) {
      const game = state.gamesData.find(g => g.id === gameId);
      if (!game) return;

      if (!state.portfolio[gameId] || state.portfolio[gameId].shares <= 0) return;

      const price = game.online;
      state.balance += price;
      state.portfolio[gameId].shares -= 1;

      updateUI();
      saveGame();
    }

    // --- ГЛАВНЫЙ ЦИКЛ ---
    function startGameLoop() {
      if (gameLoopInterval) clearInterval(gameLoopInterval);

      gameLoopInterval = setInterval(() => {
        let totalIncome = 0;

        state.gamesData.forEach(game => {
          // Если это твоя игра, она генерит доход/убыток
          if (game.isCustom) {
            // Шанс 50/50 упасть или полететь
            const isFlying = Math.random() > 0.5;
            
            if (isFlying) {
              // Летит: онлайн растет, прибыль идет в карман
              const income = Math.floor(Math.random() * 5) + 1;
              game.online += income;
              totalIncome += income;
            } else {
              // Падает: онлайн падает, убыток уходит в минус баланса
              const loss = Math.floor(Math.random() * 5) + 1;
              game.online = Math.max(1, game.online - loss);
              totalIncome -= loss;
            }
            
            // Не даем онлайну уйти ниже нуля
            if (game.online < 1) game.online = 1;
          } else {
            // Обычные игры просто колеблются
            const change = Math.floor(Math.random() * 21) - 10;
            game.online = Math.max(0, game.online + change);
          }
        });

        // Применяем общий доход/убыток к балансу
        if (totalIncome !== 0) {
          state.balance += totalIncome;
          
          // Показываем визуальный эффект
          if (totalIncome > 0) {
             showFloatIncome('+', totalIncome, '#00ff00', document.getElementById('balance-display'));
          } else {
             showFloatIncome('', totalIncome, '#ff0055', document.getElementById('balance-display'));
          }
        }

        updateUI();
        saveGame();

      }, 3000); // Каждые 3 секунды (для теста, можно увеличить)
    }

    // --- ОТРИСОВКА ИНТЕРФЕЙСА ---
    function updateUI() {
      const balEl = document.getElementById('balance-display');
      balEl.innerText = state.balance.toLocaleString('ru-RU') + ' 💵';
      if (state.balance < 0) {
        balEl.classList.add('negative');
      } else {
        balEl.classList.remove('negative');
      }

      const createBtn = document.getElementById('btn-create');
      createBtn.innerText = `➕ Создать игру (${state.nextGamePrice.toLocaleString('ru-RU')} 💵)`;
      if (state.balance < state.nextGamePrice) {
        createBtn.disabled = true;
      } else {
        createBtn.disabled = false;
      }

      const grid = document.getElementById('games-grid');
      
      // Если сетки нет (первый рендер), создаем карточки
      if (grid.children.length !== state.gamesData.length) {
        grid.innerHTML = '';
        state.gamesData.forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card' + (game.isCustom ? ' custom-game' : '');
          card.id = 'card-' + game.id;
          grid.appendChild(card);
        });
      }

      // Обновляем данные внутри карточек (чтобы не пересоздавать DOM каждый тик)
      state.gamesData.forEach(game => {
        const card = document.getElementById('card-' + game.id);
        if (!card) return;

        const shares = state.portfolio[game.id] ? state.portfolio[game.id].shares : 0;
        
        // Определяем тренд для стрелочки
        const isUp = game.online >= game.baseOnline; // Условный тренд

        let customHTML = '';
        if (game.isCustom) {
          const upgradeCost = state.nextGamePrice; // Цена обнова = цена новой игры
          customHTML = `
            <div class="portfolio-info" style="color: #ffeb3b; margin-bottom: 5px;">
               ⚡ Актив: ${game.upgrades} обнов
            </div>
            <button class="btn-upgrade" onclick="upgradeGame('${game.id}')">
              🚀 Обнова (${upgradeCost.toLocaleString('ru-RU')} 💵)
            </button>
          `;
        }

        card.innerHTML = `
          <div class="game-icon">${game.icon}</div>
          <div class="game-name">${game.name}</div>
          <div class="game-online ${isUp ? 'trend-up' : 'trend-down'}">
            ${game.online.toLocaleString('ru-RU')} ${isUp ? '▲' : '▼'}
          </div>
          <div class="game-price">Цена: ${game.online.toLocaleString('ru-RU')}</div>
          <div class="portfolio-info">
            Акции: ${shares} ${shares > 0 ? '✅' : '❌'}
          </div>
          <div class="trade-controls">
            <button class="btn-trade btn-buy" onclick="buy('${game.id}')">Купить</button>
            <button class="btn-trade btn-sell" onclick="sell('${game.id}')" ${shares === 0 ? 'disabled' : ''}>Продать</button>
          </div>
          ${customHTML}
        `;
      });
    }

    // Всплывающий текст прибыли/убытка
    function showFloatIncome(prefix, amount, color, targetEl) {
      const el = document.createElement('div');
      el.className = 'floating-income';
      el.style.color = color;
      
      const text = prefix === '' ? amount.toLocaleString('ru-RU') : `${prefix}${amount.toLocaleString('ru-RU')} 💵`;
      el.innerText = text;

      // Позиционируем возле целевого элемента
      if (targetEl) {
        const rect = targetEl.getBoundingClientRect();
        el.style.left = rect.left + 'px';
        el.style.top = (rect.top - 20) + 'px';
      } else {
        el.style.left = '50%';
        el.style.top = '30%';
        el.style.transform = 'translateX(-50%)';
      }

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    function resetGame() {
      if (confirm("Ты уверен, что хочешь полностью сбросить прогресс?")) {
        localStorage.removeItem(SAVE_KEY);
        location.reload();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
