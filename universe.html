<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Пиксельный Пульт 🕹️</title>
  <!-- Подключаем ретро-шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #1a1a1a;
      --panel-bg: #333333;
      --text: #ffffff;
      --accent: #55ff55; /* Кислотно-зеленый */
      --accent-dark: #228822;
      --pixel-border: 4px solid #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(0,0,0,0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.8) 1px, transparent 1px);
      background-size: 20px 20px; /* Легкий пиксельный фон */
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: filter 0.2s;
    }

    #animation-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Пульт */
    .panel {
      position: relative;
      z-index: 10;
      background: var(--panel-bg);
      padding: 30px 20px;
      border: var(--pixel-border);
      box-shadow: 
        8px 8px 0px #000,
        inset -4px -4px 0px rgba(0,0,0,0.5),
        inset 4px 4px 0px rgba(255,255,255,0.2);
      width: min(400px, 90vw);
    }

    h1 {
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
      color: var(--accent);
      text-shadow: 3px 3px 0px #000;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 4px dashed #555;
    }
    .toggle-row:last-child { border-bottom: none; }

    .toggle-label {
      font-size: 10px;
      line-height: 1.4;
    }

    /* Пиксельный тумблер */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #222;
      border: 4px solid #fff;
      box-shadow: inset 4px 4px 0 rgba(0,0,0,0.5);
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 2px; bottom: 2px;
      background-color: #fff;
      transition: .1s steps(2); /* Рывком */
    }
    
    input:checked + .slider {
      background-color: var(--accent);
    }
    
    input:checked + .slider:before {
      transform: translateX(30px);
    }

    /* --- ПИКСЕЛЬНЫЙ КОТ (нарисован через box-shadow) --- */
    .pixel-cat {
      position: absolute;
      width: 10px;
      height: 10px;
      background: transparent;
      /* Оранжевый кот с черными глазами */
      box-shadow: 
        10px 0 0 #ff9900, 20px 0 0 #ff9900, 30px 0 0 #ff9900, 40px 0 0 #ff9900, 50px 0 0 #ff9900,
        0 10px 0 #ff9900, 10px 10px 0 #ff9900, 20px 10px 0 #ff9900, 30px 10px 0 #ff9900, 40px 10px 0 #ff9900, 50px 10px 0 #ff9900, 60px 10px 0 #ff9900,
        0 20px 0 #ff9900, 10px 20px 0 #000, 20px 20px 0 #ff9900, 30px 20px 0 #ff9900, 40px 20px 0 #ff9900, 50px 20px 0 #000, 60px 20px 0 #ff9900,
        10px 30px 0 #ff9900, 20px 30px 0 #ff9900, 30px 30px 0 #ff9900, 40px 30px 0 #ff9900, 50px 30px 0 #ff9900,
        10px 40px 0 #ff9900, 20px 40px 0 #ff9900, 40px 40px 0 #ff9900, 50px 40px 0 #ff9900,
        10px 50px 0 #ff9900, 50px 50px 0 #ff9900;
    }

    /* --- ПИКСЕЛЬНАЯ ПИЦЦА --- */
    .pixel-pizza {
      position: absolute;
      width: 10px;
      height: 10px;
      background: transparent;
      /* Треугольник пиццы */
      box-shadow: 
        20px 0 0 #ffcc00,
        10px 10px 0 #ffcc00, 20px 10px 0 #ff3333, 30px 10px 0 #ffcc00,
        0 20px 0 #ffcc00, 10px 20px 0 #ffcc00, 20px 20px 0 #ffcc00, 30px 20px 0 #ff3333, 40px 20px 0 #ffcc00;
    }

    /* Анимации */
    .run-anim { animation: runAcross steps(15) infinite; }
    @keyframes runAcross {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(100vw); }
    }

    .float-anim {
      animation: floatUp steps(20) forwards !important;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }

    .fall-anim { animation: fallDown steps(15) forwards; }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(180deg); }
    }

    .reality-inverted {
      filter: invert(1) hue-rotate(90deg);
    }
  </style>
</head>
<body>

  <div id="animation-layer"></div>

  <div class="panel">
    <h1>ПИКСЕЛЬНЫЙ ПУЛЬТ</h1>

    <div class="toggle-row">
      <span class="toggle-label">Квадратные<br>коты</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cats">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Гравитация</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gravity" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Дождь<br>пиццы</span>
      <label class="switch">
        <input type="checkbox" id="toggle-pizza">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Сменить<br>реальность</span>
      <label class="switch">
        <input type="checkbox" id="toggle-reality">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script>
    const layer = document.getElementById('animation-layer');
    
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const realityToggle = document.getElementById('toggle-reality');

    let catInterval = null;
    let pizzaInterval = null;

    // КОТЫ
    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        spawnCat();
        catInterval = setInterval(spawnCat, 1200);
      } else {
        clearInterval(catInterval);
      }
    });

    function spawnCat() {
      const cat = document.createElement('div');
      cat.className = 'pixel-cat';
      
      // Позиция и скорость
      cat.style.top = (Math.random() * 70 + 15) + 'vh';
      const duration = Math.random() * 2 + 2; // 2-4 секунды
      cat.style.animationDuration = duration + 's';

      if (!gravityToggle.checked) {
        applyFloat(cat);
      } else {
        cat.classList.add('run-anim');
      }

      cat.addEventListener('animationend', () => cat.remove());
      layer.appendChild(cat);
    }

    // ГРАВИТАЦИЯ
    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.pixel-cat');
      
      if (!e.target.checked) {
        cats.forEach(cat => {
          cat.classList.remove('run-anim');
          applyFloat(cat);
        });
      } else {
        cats.forEach(cat => {
          cat.classList.remove('float-anim');
          cat.style.animation = 'none';
          cat.offsetHeight;
          cat.style.animation = '';
          cat.classList.add('run-anim');
        });
      }
    });

    function applyFloat(cat) {
      const floatDuration = Math.random() * 2 + 2; 
      cat.style.animationDuration = floatDuration + 's';
      cat.classList.add('float-anim');
    }

    // ПИЦЦА
    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        pizzaInterval = setInterval(spawnPizza, 500);
      } else {
        clearInterval(pizzaInterval);
      }
    });

    function spawnPizza() {
      const pizza = document.createElement('div');
      pizza.className = 'pixel-pizza';
      
      pizza.style.left = (Math.random() * 85 + 5) + 'vw';
      const duration = Math.random() * 1 + 1.5; // Быстрое падение
      pizza.style.animationDuration = duration + 's';
      
      pizza.classList.add('fall-anim');
      pizza.addEventListener('animationend', () => pizza.remove());
      
      layer.appendChild(pizza);
    }

    // РЕАЛЬНОСТЬ
    realityToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.body.classList.add('reality-inverted');
      } else {
        document.body.classList.remove('reality-inverted');
      }
    });

  </script>
</body>
</html>
