<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Пиксельный Пульт</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #111;
      background-image: linear-gradient(rgba(0,0,0,0.7) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.7) 1px, transparent 1px);
      background-size: 20px 20px;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
      /* Ограничиваем, чтобы коты не улетали за экран */
      overflow: hidden; 
    }

    .panel {
      position: relative; z-index: 10;
      background: #333;
      padding: 20px;
      border: 4px solid #fff;
      box-shadow: 8px 8px 0px #000;
      width: 90vw;
      max-width: 350px;
    }

    h1 {
      text-align: center; 
      font-size: 12px; 
      margin-bottom: 20px;
      color: #55ff55; 
      text-shadow: 2px 2px 0px #000;
    }

    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 4px dashed #555;
    }
    .toggle-row:last-child { border-bottom: none; }

    .toggle-label { font-size: 8px; line-height: 1.5; }

    .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #222; border: 4px solid #fff;
    }
    .slider:before {
      position: absolute; content: ""; height: 10px; width: 10px;
      left: 4px; bottom: 4px; background-color: #fff; transition: .1s steps(2);
    }
    input:checked + .slider { background-color: #55ff55; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* --- ДЕТАЛЬНЫЙ ПИКСЕЛЬНЫЙ КОТ --- */
    .pixel-cat {
      position: absolute;
      width: 6px; height: 6px; 
      box-shadow: 
        12px 0 0 #f4a460, 36px 0 0 #f4a460,
        6px 6px 0 #f4a460, 12px 6px 0 #f4a460, 18px 6px 0 #f4a460, 30px 6px 0 #f4a460, 36px 6px 0 #f4a460, 42px 6px 0 #f4a460,
        0 12px 0 #f4a460, 6px 12px 0 #f4a460, 12px 12px 0 #f4a460, 18px 12px 0 #f4a460, 24px 12px 0 #f4a460, 30px 12px 0 #f4a460, 36px 12px 0 #f4a460, 42px 12px 0 #f4a460, 48px 12px 0 #f4a460,
        0 18px 0 #f4a460, 6px 18px 0 #000, 12px 18px 0 #000, 18px 18px 0 #f4a460, 24px 18px 0 #f4a460, 30px 18px 0 #000, 36px 18px 0 #000, 42px 18px 0 #f4a460, 48px 18px 0 #f4a460,
        0 24px 0 #f4a460, 6px 24px 0 #f4a460, 12px 24px 0 #f4a460, 18px 24px 0 #f4a460, 24px 24px 0 #ff69b4, 30px 24px 0 #f4a460, 36px 24px 0 #f4a460, 42px 24px 0 #f4a460, 48px 24px 0 #f4a460,
        0 30px 0 #f4a460, 6px 30px 0 #f4a460, 12px 30px 0 #f4a460, 18px 30px 0 #f4a460, 24px 30px 0 #f4a460, 30px 30px 0 #f4a460, 36px 30px 0 #f4a460, 42px 30px 0 #f4a460, 48px 30px 0 #f4a460,
        6px 36px 0 #f4a460, 12px 36px 0 #f4a460, 18px 36px 0 #f4a460, 24px 36px 0 #f4a460, 30px 36px 0 #f4a460, 36px 36px 0 #f4a460, 42px 36px 0 #f4a460,
        6px 42px 0 #f4a460, 12px 42px 0 #f4a460, 18px 42px 0 #f4a460, 24px 42px 0 #f4a460, 30px 42px 0 #f4a460, 36px 42px 0 #f4a460, 42px 42px 0 #f4a460,
        6px 48px 0 #f4a460, 12px 48px 0 #000, 18px 48px 0 #f4a460, 30px 48px 0 #f4a460, 36px 48px 0 #000, 42px 48px 0 #f4a460,
        48px 36px 0 #f4a460, 54px 30px 0 #f4a460, 54px 24px 0 #f4a460;
      
      /* Плавные переходы для JS */
      transition: top 1s ease-in, transform 1s ease-in;
    }

    .pixel-pizza {
      position: absolute;
      width: 8px; height: 8px;
      box-shadow: 
        16px 0 0 #ffcc00,
        8px 8px 0 #ffcc00, 16px 8px 0 #ff0000, 24px 8px 0 #ffcc00,
        0 16px 0 #ffcc00, 8px 16px 0 #ffcc00, 16px 16px 0 #ffcc00, 24px 16px 0 #ffcc00, 32px 16px 0 #ffcc00;
    }

    /* Анимация бега (бесконечная) */
    .run-anim { animation: runAcross steps(20) infinite; }
    @keyframes runAcross {
      0% { transform: translateX(-100px) scaleX(1); }
      49% { transform: translateX(100vw) scaleX(1); }
      50% { transform: translateX(100vw) scaleX(-1); }
      100% { transform: translateX(-100px) scaleX(-1); }
    }

    /* Анимация парения в невесомости */
    .float-anim { animation: hover steps(10) infinite alternate; }
    @keyframes hover {
      0% { transform: translateY(0) rotate(-10deg); }
      100% { transform: translateY(-20px) rotate(10deg); }
    }

    .fall-anim { animation: fallDown steps(15) forwards; }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(180deg); }
    }

    .reality-inverted { filter: invert(1) hue-rotate(90deg); }
  </style>
</head>
<body>

  <div id="animation-layer"></div>

  <div class="panel">
    <h1>ПУЛЬТ ВСЕЛЕННОЙ</h1>

    <div class="toggle-row">
      <span class="toggle-label">Квадратные<br>коты</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cats">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Гравитация</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gravity" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Дождь<br>пиццы</span>
      <label class="switch">
        <input type="checkbox" id="toggle-pizza">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Сменить<br>реальность</span>
      <label class="switch">
        <input type="checkbox" id="toggle-reality">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script>
    const layer = document.getElementById('animation-layer');
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const realityToggle = document.getElementById('toggle-reality');

    let catInterval = null;
    let pizzaInterval = null;

    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        spawnCat();
        catInterval = setInterval(spawnCat, 1500);
      } else {
        clearInterval(catInterval);
      }
    });

    function spawnCat() {
      const cat = document.createElement('div');
      cat.className = 'pixel-cat';
      
      // Задаем стартовую позицию (внизу экрана)
      const startY = Math.random() * 40 + 50; 
      cat.style.top = startY + 'vh';
      cat.dataset.startY = startY; // Запоминаем высоту

      if (!gravityToggle.checked) {
        // Если гравитация выключена, сразу закидываем наверх
        cat.style.top = '10vh'; 
        cat.classList.add('float-anim');
      } else {
        cat.classList.add('run-anim');
      }
      
      layer.appendChild(cat);
    }

    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.pixel-cat');
      
      if (!e.target.checked) {
        // Гравитация ВЫКЛ - коты улетают вверх и остаются там парить
        cats.forEach(cat => {
          cat.classList.remove('run-anim');
          cat.style.animation = 'none'; // Сбрасываем анимацию бега
          
          // Плавно перемещаем кота наверх экрана (в невесомость)
          cat.style.top = (Math.random() * 15 + 5) + 'vh'; 
          
          // Включаем анимацию парения
          setTimeout(() => {
            cat.classList.add('float-anim');
          }, 1000); // Ждем, пока долетит
        });
      } else {
        // Гравитация ВКЛ - коты падают вниз и бегут
        cats.forEach(cat => {
          cat.classList.remove('float-anim');
          
          // Возвращаем кота на его изначальную высоту (или рандомную внизу)
          cat.style.top = (Math.random() * 40 + 50) + 'vh';
          
          // Через секунду (когда упадет) включаем бег
          setTimeout(() => {
            cat.classList.add('run-anim');
          }, 1000);
        });
      }
    });

    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        pizzaInterval = setInterval(() => {
          const pizza = document.createElement('div');
          pizza.className = 'pixel-pizza';
          pizza.style.left = (Math.random() * 85 + 5) + 'vw';
          pizza.style.animationDuration = (Math.random() * 1 + 1) + 's';
          pizza.classList.add('fall-anim');
          pizza.addEventListener('animationend', () => pizza.remove());
          layer.appendChild(pizza);
        }, 600);
      } else {
        clearInterval(pizzaInterval);
      }
    });

    realityToggle.addEventListener('change', (e) => {
      document.body.classList.toggle('reality-inverted', e.target.checked);
    });
  </script>
</body>
</html>
