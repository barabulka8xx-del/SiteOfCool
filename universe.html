<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление Вселенной</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
      overflow: hidden; 
    }

    .panel {
      position: relative; z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 90vw;
      max-width: 380px;
    }

    h1 {
      text-align: center; 
      font-size: 22px; 
      font-weight: 700;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .toggle-row:last-child { border-bottom: none; }

    .toggle-label { font-size: 15px; font-weight: 500; color: #e0e0e0; }

    .switch { position: relative; display: inline-block; width: 52px; height: 28px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .4s;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; 
      background-color: #fff; 
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #4facfe; border-color: #4facfe; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* --- КВАДРАТНЫЙ КОТ (Стильный минимализм) --- */
    .modern-cat {
      position: absolute;
      width: 60px;
      height: 60px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      transition: top 1s ease-in-out;
    }
    
    /* Голова */
    .modern-cat .head {
      position: absolute;
      top: 0; left: 0;
      width: 40px; height: 40px;
      background-color: #ff9900;
      border-radius: 4px; /* Чуть скругляем углы для стиля */
    }
    /* Ушки */
    .modern-cat .head::before, .modern-cat .head::after {
      content: ''; position: absolute; top: -10px;
      width: 15px; height: 15px; background-color: #ff9900;
      border-radius: 2px;
    }
    .modern-cat .head::before { left: 0; }
    .modern-cat .head::after { right: 0; }
    
    /* Глаза и нос */
    .modern-cat .eye-l, .modern-cat .eye-r {
      position: absolute; top: 15px; width: 8px; height: 8px;
      background-color: #222; border-radius: 50%;
    }
    .modern-cat .eye-l { left: 8px; }
    .modern-cat .eye-r { right: 8px; }
    .modern-cat .nose {
      position: absolute; top: 25px; left: 17px;
      width: 6px; height: 4px; background-color: #ff69b4; border-radius: 2px;
    }

    /* Тело */
    .modern-cat .body {
      position: absolute;
      top: 40px; left: 5px;
      width: 35px; height: 20px;
      background-color: #ff9900;
      border-radius: 4px;
    }
    /* Хвост */
    .modern-cat .tail {
      position: absolute;
      top: 45px; left: 40px;
      width: 20px; height: 8px;
      background-color: #ff9900;
      border-radius: 4px;
    }

    /* Лапки */
    .modern-cat .paw-l, .modern-cat .paw-r {
      position: absolute; bottom: 0; width: 10px; height: 10px;
      background-color: #cc7a00; border-radius: 2px;
    }
    .modern-cat .paw-l { left: 10px; }
    .modern-cat .paw-r { right: 15px; }

    /* --- ПИЦЦА --- */
    .flying-pizza {
      position: absolute;
      font-size: 45px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
    }

    /* Анимации */
    .run-anim { animation: runAcross steps(20) infinite; }
    @keyframes runAcross {
      0% { transform: translateX(-100px) scaleX(1); }
      49% { transform: translateX(100vw) scaleX(1); }
      50% { transform: translateX(100vw) scaleX(-1); }
      100% { transform: translateX(-100px) scaleX(-1); }
    }

    .float-anim { animation: hover steps(10) infinite alternate; }
    @keyframes hover {
      0% { transform: translateY(0) rotate(-10deg); }
      100% { transform: translateY(-30px) rotate(10deg); }
    }

    .fall-anim { animation: fallDown linear forwards; }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(360deg); }
    }

    .reality-inverted { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>
<body>

  <div id="animation-layer"></div>

  <div class="panel">
    <h1>Управление Вселенной</h1>

    <div class="toggle-row">
      <span class="toggle-label">🐈 Квадратные коты</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cats">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌍 Гравитация</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gravity" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🍕 Дождь из пиццы</span>
      <label class="switch">
        <input type="checkbox" id="toggle-pizza">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌀 Сменить реальность</span>
      <label class="switch">
        <input type="checkbox" id="toggle-reality">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script>
    const layer = document.getElementById('animation-layer');
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const realityToggle = document.getElementById('toggle-reality');

    let catInterval = null;
    let pizzaInterval = null;

    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        spawnCat();
        catInterval = setInterval(spawnCat, 1500);
      } else {
        clearInterval(catInterval);
      }
    });

    function spawnCat() {
      const cat = document.createElement('div');
      cat.className = 'modern-cat';
      
      // Собираем кота из частей
      cat.innerHTML = `
        <div class="head">
          <div class="eye-l"></div>
          <div class="eye-r"></div>
          <div class="nose"></div>
        </div>
        <div class="body"></div>
        <div class="tail"></div>
        <div class="paw-l"></div>
        <div class="paw-r"></div>
      `;
      
      const startY = Math.random() * 60 + 20; 
      cat.style.top = startY + 'vh';

      if (!gravityToggle.checked) {
        cat.style.top = '10vh'; 
        cat.classList.add('float-anim');
      } else {
        cat.classList.add('run-anim');
      }
      
      layer.appendChild(cat);
    }

    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.modern-cat');
      
      if (!e.target.checked) {
        cats.forEach(cat => {
          cat.classList.remove('run-anim');
          cat.style.animation = 'none'; 
          cat.style.top = (Math.random() * 20 + 5) + 'vh'; 
          setTimeout(() => cat.classList.add('float-anim'), 1000);
        });
      } else {
        cats.forEach(cat => {
          cat.classList.remove('float-anim');
          cat.style.top = (Math.random() * 60 + 20) + 'vh';
          setTimeout(() => cat.classList.add('run-anim'), 1000);
        });
      }
    });

    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        pizzaInterval = setInterval(() => {
          const pizza = document.createElement('div');
          pizza.className = 'flying-pizza';
          pizza.textContent = '🍕';
          pizza.style.left = (Math.random() * 85 + 5) + 'vw';
          pizza.style.top = '-60px';
          pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          pizza.classList.add('fall-anim');
          pizza.addEventListener('animationend', () => pizza.remove());
          layer.appendChild(pizza);
        }, 500);
      } else {
        clearInterval(pizzaInterval);
      }
    });

    realityToggle.addEventListener('change', (e) => {
      document.body.classList.toggle('reality-inverted', e.target.checked);
    });
  </script>
</body>
</html>
