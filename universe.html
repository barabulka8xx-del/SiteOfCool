<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление Вселенной</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 1s ease;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
      overflow: hidden; 
    }

    /* --- КАТСЦЕНА --- */
    #cutscene {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      z-index: 100;
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #cutscene.active { display: flex; opacity: 1; }

    .cutscene-text {
      position: absolute;
      top: 30%;
      font-size: 24px; font-weight: 700; text-align: center;
      opacity: 0; animation: fadeInOut 2.5s forwards; z-index: 10;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      color: #fff;
      width: 100%;
      padding: 0 20px;
    }
    
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* --- ГОРОД --- */
    .street-scene { position: absolute; bottom: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1;}
    .road-surface { position: absolute; bottom: 0; width: 100%; height: 25%; background: #2a2a35; border-top: 4px solid #444; }
    
    .buildings-back {
      position: absolute; bottom: 25%; width: 100%; height: 200px; background: #151b26;
      clip-path: polygon(0 100%, 0 30%, 5% 30%, 5% 60%, 15% 60%, 15% 10%, 25% 10%, 25% 80%, 40% 80%, 40% 20%, 55% 20%, 55% 50%, 65% 50%, 65% 40%, 80% 40%, 80% 90%, 90% 90%, 90% 30%, 100% 30%, 100% 100%);
    }
    .buildings-front {
      position: absolute; bottom: 25%; width: 100%; height: 120px; background: #0b1017;
      clip-path: polygon(0 100%, 0 50%, 10% 50%, 10% 20%, 20% 20%, 20% 60%, 35% 60%, 35% 40%, 50% 40%, 50% 90%, 70% 90%, 70% 10%, 85% 10%, 85% 70%, 100% 70%, 100% 100%);
      background-image: radial-gradient(circle at 12% 70%, #ffcc00 3px, transparent 4px), radial-gradient(circle at 40% 80%, #ffcc00 3px, transparent 4px), radial-gradient(circle at 75% 50%, #ffcc00 3px, transparent 4px), radial-gradient(circle at 92% 85%, #ffcc00 3px, transparent 4px);
      background-size: 100% 100%;
    }

    /* --- ИНТЕРФЕЙС --- */
    .panel {
      position: relative; z-index: 10; background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px 25px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 90vw; max-width: 380px;
      max-height: 90vh; overflow-y: auto;
    }

    h1 {
      text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 25px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 15px; font-weight: 500; color: #e0e0e0; }

    .switch { position: relative; display: inline-block; width: 52px; height: 28px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4facfe; border-color: #4facfe; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* --- КВАДРАТНЫЙ КОТ --- */
    .modern-cat {
      position: absolute; width: 60px; height: 60px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      transition: all 0.5s ease;
    }
    
    .cat-head { position: absolute; top: 0; left: 0; width: 40px; height: 40px; background-color: #ff9900; border-radius: 4px; }
    .cat-head::before, .cat-head::after { content: ''; position: absolute; top: -10px; width: 15px; height: 15px; background-color: #ff9900; border-radius: 2px; }
    .cat-head::before { left: 0; }
    .cat-head::after { right: 0; }
    
    .cat-eye-l, .cat-eye-r { position: absolute; top: 15px; width: 8px; height: 8px; background-color: #222; border-radius: 50%; }
    .cat-eye-l { left: 8px; }
    .cat-eye-r { right: 8px; }
    .cat-nose { position: absolute; top: 25px; left: 17px; width: 6px; height: 4px; background-color: #ff69b4; border-radius: 2px; }

    .cat-body { position: absolute; top: 40px; left: 5px; width: 35px; height: 20px; background-color: #ff9900; border-radius: 4px; }
    .cat-tail { position: absolute; top: 45px; left: 40px; width: 20px; height: 8px; background-color: #ff9900; border-radius: 4px; }
    
    .cat-paw-l, .cat-paw-r { position: absolute; bottom: 0; width: 10px; height: 10px; background-color: #cc7a00; border-radius: 2px; }
    .cat-paw-l { left: 10px; }
    .cat-paw-r { right: 15px; }

    /* Пицца и Рыба */
    .flying-item { position: absolute; font-size: 50px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); transition: all 0.5s ease; }

    /* Анимации */
    .run-anim { animation: runAcross linear forwards; }
    @keyframes runAcross {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(100vw); }
    }

    .float-anim { animation: hover 2s ease-in-out infinite alternate; }
    @keyframes hover {
      0% { transform: translateY(0) rotate(-15deg); }
      100% { transform: translateY(-30px) rotate(15deg); }
    }

    .fall-anim { animation: fallDown linear forwards; }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(360deg); }
    }

    .fly-up-anim { animation: flyUp linear forwards; }
    @keyframes flyUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(-360deg); opacity: 1; }
    }

    /* Смена неба */
    .sky-day { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) !important; }
    .sky-sunset { background: linear-gradient(135deg, #2b1055, #7597de) !important; }
    .sky-night { background: linear-gradient(135deg, #000000, #434343) !important; }
    .sky-matrix { background: linear-gradient(135deg, #000000, #003300) !important; }

    .reality-inverted { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>
<body class="sky-day" id="main-body">

  <!-- Катсцена -->
  <div id="cutscene">
    <div class="cutscene-text" id="cutscene-text"></div>
    
    <div class="street-scene">
      <div class="buildings-back"></div>
      <div class="buildings-front"></div>
      <div class="road-surface"></div>
    </div>
    
    <div id="cutscene-objects" style="position:absolute; width:100%; height:100%; top:0; left:0; z-index:5; pointer-events:none;"></div>
  </div>

  <div id="animation-layer"></div>

  <div class="panel">
    <h1>Управление Вселенной</h1>

    <div class="toggle-row">
      <span class="toggle-label">🐈 Квадратные коты</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cats">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌍 Гравитация</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gravity" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🍕 Дождь из пиццы</span>
      <label class="switch">
        <input type="checkbox" id="toggle-pizza">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🐟 Рыбный дождь</span>
      <label class="switch">
        <input type="checkbox" id="toggle-fish">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌅 Сменить небо</span>
      <label class="switch">
        <input type="checkbox" id="toggle-sky">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌀 Сменить реальность</span>
      <label class="switch">
        <input type="checkbox" id="toggle-reality">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script>
    const body = document.getElementById('main-body');
    const layer = document.getElementById('animation-layer');
    
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const fishToggle = document.getElementById('toggle-fish');
    const skyToggle = document.getElementById('toggle-sky');
    const realityToggle = document.getElementById('toggle-reality');
    
    const cutscene = document.getElementById('cutscene');
    const cutsceneText = document.getElementById('cutscene-text');
    const cutsceneObjects = document.getElementById('cutscene-objects');

    let catInterval = null;
    let pizzaInterval = null;
    let fishInterval = null;
    
    const played = { cats: false, pizza: false, gravity: false, fish: false, sky: false };

    const catHTML = `
      <div class="cat-head"><div class="cat-eye-l"></div><div class="cat-eye-r"></div><div class="cat-nose"></div></div>
      <div class="cat-body"></div><div class="cat-tail"></div>
      <div class="cat-paw-l"></div><div class="cat-paw-r"></div>
    `;

    function showCutscene(text, duration = 2500) {
      cutscene.classList.add('active');
      cutsceneText.textContent = text;
      cutsceneObjects.innerHTML = '';
      
      // Если включена гравитация, объекты падают. Если нет - улетают.
      const isGravityOn = gravityToggle.checked;

      // Спавним объекты, которые сейчас включены
      if (catsToggle.checked) {
        for(let i=0; i<3; i++) {
          const cat = document.createElement('div');
          cat.className = 'modern-cat';
          cat.innerHTML = catHTML;
          cat.style.bottom = '25%'; // На дороге
          
          if (isGravityOn) {
             cat.classList.add('run-anim');
             cat.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
             cat.style.animationDelay = i * 0.3 + 's';
          } else {
             cat.classList.add('fly-up-anim');
             cat.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
             cat.style.animationDelay = i * 0.2 + 's';
          }
          cutsceneObjects.appendChild(cat);
        }
      }

      if (pizzaToggle.checked) {
        for(let i=0; i<5; i++) {
          const pizza = document.createElement('div');
          pizza.className = 'flying-item';
          pizza.textContent = '🍕';
          pizza.style.left = (Math.random() * 80 + 10) + '%';
          
          if (isGravityOn) {
             pizza.classList.add('fall-anim');
             pizza.style.top = '-100px';
             pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
             pizza.style.animationDelay = i * 0.2 + 's';
          } else {
             pizza.classList.add('fly-up-anim');
             pizza.style.bottom = '10%';
             pizza.style.top = 'auto';
             pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
             pizza.style.animationDelay = i * 0.2 + 's';
          }
          cutsceneObjects.appendChild(pizza);
        }
      }

      if (fishToggle.checked) {
        for(let i=0; i<7; i++) {
          const fish = document.createElement('div');
          fish.className = 'flying-item';
          fish.textContent = '🐟';
          fish.style.left = (Math.random() * 90 + 5) + '%';
          
          if (isGravityOn) {
             fish.classList.add('fall-anim');
             fish.style.top = '-100px';
             fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
             fish.style.animationDelay = i * 0.15 + 's';
          } else {
             fish.classList.add('fly-up-anim');
             fish.style.bottom = '10%';
             fish.style.top = 'auto';
             fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
             fish.style.animationDelay = i * 0.15 + 's';
          }
          cutsceneObjects.appendChild(fish);
        }
      }

      setTimeout(() => {
        cutscene.classList.remove('active');
        setTimeout(() => { cutsceneObjects.innerHTML = ''; }, 500);
      }, duration); 
    }

    // --- КОТЫ ---
    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.cats) {
          played.cats = true;
          showCutscene("Квадратные коты выходят на связь...");
          setTimeout(startCats, 2500);
        } else {
          startCats();
        }
      } else {
        clearInterval(catInterval);
      }
    });

    function startCats() {
      catInterval = setInterval(() => {
        const cat = document.createElement('div');
        cat.className = 'modern-cat';
        cat.innerHTML = catHTML;
        cat.style.top = (Math.random() * 60 + 20) + 'vh';
        cat.style.animationDuration = (Math.random() * 2 + 3) + 's';
        
        if (!gravityToggle.checked) {
          cat.classList.add('float-anim');
        } else {
          cat.classList.add('run-anim');
        }
        cat.addEventListener('animationend', () => cat.remove());
        layer.appendChild(cat);
      }, 1000);
    }

    // --- ПИЦЦА ---
    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.pizza) {
          played.pizza = true;
          showCutscene("Пицца вызывается на ковёр...");
          setTimeout(startPizza, 2500);
        } else {
          startPizza();
        }
      } else {
        clearInterval(pizzaInterval);
        document.querySelectorAll('.pizza-item').forEach(p => p.remove());
      }
    });

    function startPizza() {
      pizzaInterval = setInterval(() => {
        const pizza = document.createElement('div');
        pizza.className = 'flying-item pizza-item';
        pizza.textContent = '🍕';
        pizza.style.left = (Math.random() * 85 + 5) + 'vw';
        
        if (gravityToggle.checked) {
          pizza.style.top = '-60px';
          pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          pizza.classList.add('fall-anim');
        } else {
          pizza.style.top = '100vh';
          pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          pizza.classList.add('fly-up-anim');
        }
        pizza.addEventListener('animationend', () => pizza.remove());
        layer.appendChild(pizza);
      }, 500);
    }

    // --- РЫБНЫЙ ДОЖДЬ ---
    fishToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.fish) {
          played.fish = true;
          showCutscene("Рыбный шторм неизбежен...");
          setTimeout(startFish, 2500);
        } else {
          startFish();
        }
      } else {
        clearInterval(fishInterval);
        document.querySelectorAll('.fish-item').forEach(f => f.remove());
      }
    });

    function startFish() {
      fishInterval = setInterval(() => {
        const fish = document.createElement('div');
        fish.className = 'flying-item fish-item';
        fish.textContent = '🐟';
        fish.style.left = (Math.random() * 85 + 5) + 'vw';
        
        if (gravityToggle.checked) {
          fish.style.top = '-60px';
          fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          fish.classList.add('fall-anim');
        } else {
          fish.style.top = '100vh';
          fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          fish.classList.add('fly-up-anim');
        }
        fish.addEventListener('animationend', () => fish.remove());
        layer.appendChild(fish);
      }, 300); 
    }

    // --- ГРАВИТАЦИЯ ---
    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.modern-cat');
      const items = document.querySelectorAll('.flying-item');
      
      if (!e.target.checked) {
        if (!played.gravity) {
          played.gravity = true;
          showCutscene("Гравитация отключена...");
        }

        cats.forEach(cat => {
          cat.classList.remove('run-anim');
          setTimeout(() => cat.classList.add('float-anim'), 100);
        });
        items.forEach(item => {
          item.className = 'flying-item fly-up-anim ' + (item.classList.contains('pizza-item') ? 'pizza-item' : 'fish-item');
          item.style.top = '100vh';
          item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        });

      } else {
        cats.forEach(cat => {
          cat.classList.remove('float-anim');
          setTimeout(() => cat.classList.add('run-anim'), 100);
        });
        items.forEach(item => {
          item.className = 'flying-item fall-anim ' + (item.classList.contains('pizza-item') ? 'pizza-item' : 'fish-item');
          item.style.top = '-60px';
          item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        });
      }
    });

    // --- СМЕНА НЕБА ---
    let skyState = 0; 
    skyToggle.addEventListener('change', (e) => {
      // Каждый раз при клике меняем фон (даже если тумблер уже включен)
      skyState = (skyState + 1) % 4;
      body.classList.remove('sky-day', 'sky-sunset', 'sky-night', 'sky-matrix');
      
      if (skyState === 0) body.classList.add('sky-day');
      if (skyState === 1) body.classList.add('sky-sunset');
      if (skyState === 2) body.classList.add('sky-night');
      if (skyState === 3) body.classList.add('sky-matrix');

      if (!played.sky) {
        played.sky = true;
        showCutscene("Время суток меняется...");
      }
      
      // Оставляем тумблер включенным, чтобы он горел зеленым
    });

    // --- РЕАЛЬНОСТЬ ---
    realityToggle.addEventListener('change', (e) => {
      body.classList.toggle('reality-inverted', e.target.checked);
    });
  </script>
</body>
</html>
