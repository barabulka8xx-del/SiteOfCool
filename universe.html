<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление Вселенной</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 1;
      overflow: hidden; 
    }

    /* --- КАТСЦЕНА --- */
    #cutscene {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #000000 0%, #050a1a 40%, #1a1a3a 100%);
      z-index: 100;
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 1s ease;
      overflow: hidden;
    }

    #cutscene.active { display: flex; opacity: 1; }

    .cutscene-text {
      position: absolute; top: 20%; font-size: 24px; font-weight: 700;
      text-align: center; opacity: 0; animation: fadeInOut 3s forwards; z-index: 10;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* Улица */
    .street-scene { position: absolute; bottom: 0; width: 100%; height: 60%; overflow: hidden; }
    .road-surface { position: absolute; bottom: 0; width: 100%; height: 40%; background: #1a1a24; border-top: 4px solid #333; }
    .road-lines {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80%; height: 40%;
      background-image: 
        linear-gradient(to top right, transparent 49%, #555 49%, #555 51%, transparent 51%),
        linear-gradient(to top left, transparent 49%, #555 49%, #555 51%, transparent 51%);
      background-size: 50% 100%; background-position: left bottom, right bottom; background-repeat: no-repeat; opacity: 0.3;
    }
    .buildings {
      position: absolute; bottom: 40%; width: 100%; height: 150px; background: #0a0a12;
      background-image: radial-gradient(circle at 20% 80%, #ffcc00 2px, transparent 3px), radial-gradient(circle at 30% 60%, #ffcc00 2px, transparent 3px), radial-gradient(circle at 80% 70%, #ffcc00 2px, transparent 3px), radial-gradient(circle at 60% 50%, #ffcc00 2px, transparent 3px), radial-gradient(circle at 90% 90%, #ffcc00 2px, transparent 3px);
      background-size: 100% 100%; background-repeat: no-repeat;
      clip-path: polygon(0 100%, 0 40%, 10% 40%, 10% 70%, 20% 70%, 20% 20%, 35% 20%, 35% 60%, 50% 60%, 50% 30%, 60% 30%, 60% 80%, 75% 80%, 75% 10%, 85% 10%, 85% 50%, 100% 50%, 100% 100%);
    }
    .fog { position: absolute; bottom: 40%; width: 100%; height: 50%; background: linear-gradient(to top, rgba(26,26,58,1) 0%, rgba(26,26,58,0) 100%); z-index: 4; pointer-events: none; }

    /* Контейнер для катсцены */
    .cutscene-items-container { position: absolute; bottom: 15%; width: 100%; z-index: 5; }

    /* Анимация для котов в катсцене (просто пробегают) */
    .cutscene-cat-wrapper { position: absolute; animation: runAcrossCutscene linear forwards; }
    
    @keyframes runAcrossCutscene {
      0% { transform: translateX(-100px) scale(1); opacity: 1; }
      100% { transform: translateX(100vw) scale(1); opacity: 1; }
    }

    /* Анимация для пиццы в катсцене (падает) */
    .cutscene-pizza-wrapper { position: absolute; font-size: 60px; animation: fallDownCutscene linear forwards; }

    @keyframes fallDownCutscene {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 1; }
    }

    /* --- ИНТЕРФЕЙС --- */
    .panel {
      position: relative; z-index: 10; background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px 25px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 90vw; max-width: 380px;
    }

    h1 {
      text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 25px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 15px; font-weight: 500; color: #e0e0e0; }

    .switch { position: relative; display: inline-block; width: 52px; height: 28px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px;
      left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #4facfe; border-color: #4facfe; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* --- КВАДРАТНЫЙ КОТ --- */
    .modern-cat {
      position: absolute; width: 60px; height: 60px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      transition: top 1s ease-in-out;
    }
    
    .cat-head { position: absolute; top: 0; left: 0; width: 40px; height: 40px; background-color: #ff9900; border-radius: 4px; }
    .cat-head::before, .cat-head::after { content: ''; position: absolute; top: -10px; width: 15px; height: 15px; background-color: #ff9900; border-radius: 2px; }
    .cat-head::before { left: 0; }
    .cat-head::after { right: 0; }
    
    .cat-eye-l, .cat-eye-r { position: absolute; top: 15px; width: 8px; height: 8px; background-color: #222; border-radius: 50%; }
    .cat-eye-l { left: 8px; }
    .cat-eye-r { right: 8px; }
    .cat-nose { position: absolute; top: 25px; left: 17px; width: 6px; height: 4px; background-color: #ff69b4; border-radius: 2px; }

    .cat-body { position: absolute; top: 40px; left: 5px; width: 35px; height: 20px; background-color: #ff9900; border-radius: 4px; }
    .cat-tail { position: absolute; top: 45px; left: 40px; width: 20px; height: 8px; background-color: #ff9900; border-radius: 4px; }
    
    .cat-paw-l, .cat-paw-r { position: absolute; bottom: 0; width: 10px; height: 10px; background-color: #cc7a00; border-radius: 2px; }
    .cat-paw-l { left: 10px; }
    .cat-paw-r { right: 15px; }

    /* Пицца */
    .flying-pizza { position: absolute; font-size: 45px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }

    /* Анимации для пульта */
    /* Коты просто пробегают слева направо без разворота */
    .run-anim { animation: runAcross linear forwards; }
    @keyframes runAcross {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(100vw); }
    }
    
    /* Анимация перебирания лапками */
    .run-anim .cat-paw-l { animation: step 0.2s infinite alternate; }
    .run-anim .cat-paw-r { animation: step 0.2s infinite alternate-reverse; }
    @keyframes step {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    /* Левитация для котов (когда нет гравитации) */
    .float-anim { animation: hover 2s ease-in-out infinite alternate; }
    @keyframes hover {
      0% { transform: translateY(0) rotate(-15deg); }
      100% { transform: translateY(-30px) rotate(15deg); }
    }

    /* Падение пиццы (когда гравитация есть) */
    .fall-anim { animation: fallDown linear forwards; }
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(120vh) rotate(360deg); }
    }

    /* Улет пиццы (когда гравитации нет) */
    .fly-up-anim { animation: flyUp linear forwards; }
    @keyframes flyUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(-360deg); opacity: 1; }
    }

    .reality-inverted { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>
<body>

  <!-- Катсцена -->
  <div id="cutscene">
    <div class="cutscene-text" id="cutscene-text">Загрузка...</div>
    
    <!-- Улица (появляется только если включены коты) -->
    <div class="street-scene" id="cutscene-street" style="display: none;">
      <div class="buildings"></div>
      <div class="road-surface"></div>
      <div class="road-lines"></div>
      <div class="fog"></div>
    </div>

    <!-- Контейнер для объектов катсцены -->
    <div class="cutscene-items-container" id="cutscene-items">
      <!-- Сюда будут добавляться объекты через JS -->
    </div>
  </div>

  <div id="animation-layer"></div>

  <div class="panel">
    <h1>Управление Вселенной</h1>

    <div class="toggle-row">
      <span class="toggle-label">🐈 Квадратные коты</span>
      <label class="switch">
        <input type="checkbox" id="toggle-cats">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌍 Гравитация</span>
      <label class="switch">
        <input type="checkbox" id="toggle-gravity" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🍕 Дождь из пиццы</span>
      <label class="switch">
        <input type="checkbox" id="toggle-pizza">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">🌀 Сменить реальность</span>
      <label class="switch">
        <input type="checkbox" id="toggle-reality">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script>
    const layer = document.getElementById('animation-layer');
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const realityToggle = document.getElementById('toggle-reality');
    
    const cutscene = document.getElementById('cutscene');
    const cutsceneText = document.getElementById('cutscene-text');
    const cutsceneStreet = document.getElementById('cutscene-street');
    const cutsceneItems = document.getElementById('cutscene-items');

    let catInterval = null;
    let pizzaInterval = null;
    
    // Флаги, чтобы катсцены показывались только при первом включении
    let playedCats = false;
    let playedPizza = false;
    let playedGravity = false;

    const catHTML = `
      <div class="cat-head"><div class="cat-eye-l"></div><div class="cat-eye-r"></div><div class="cat-nose"></div></div>
      <div class="cat-body"></div><div class="cat-tail"></div>
      <div class="cat-paw-l"></div><div class="cat-paw-r"></div>
    `;

    // --- ФУНКЦИЯ ЗАПУСКА КАТСЦЕНЫ ---
    function playCutscene(text, showStreet, spawnObjects) {
      cutscene.classList.add('active');
      cutsceneText.textContent = text;
      cutsceneItems.innerHTML = '';
      cutsceneStreet.style.display = showStreet ? 'block' : 'none';

      // Спавним объекты для катсцены
      if (spawnObjects) spawnObjects();

      setTimeout(() => {
        cutscene.classList.remove('active');
        // Очищаем катсцену после завершения
        setTimeout(() => { cutsceneItems.innerHTML = ''; }, 1000);
      }, 3000); 
    }

    // --- КОТЫ ---
    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!playedCats) {
          playedCats = true;
          playCutscene("Квадратные коты выходят на связь...", true, () => {
            // Спавним 3 котов, которые пробегают
            for(let i=0; i<3; i++) {
               const wrapper = document.createElement('div');
               wrapper.className = 'cutscene-cat-wrapper';
               wrapper.style.bottom = (Math.random() * 20 + 10) + '%';
               wrapper.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
               wrapper.style.animationDelay = i * 0.3 + 's';
               wrapper.innerHTML = `<div class="modern-cat run-anim" style="position:relative; animation:none;">${catHTML}</div>`;
               cutsceneItems.appendChild(wrapper);
            }
          });
          setTimeout(startCats, 3000);
        } else {
          startCats();
        }
      } else {
        clearInterval(catInterval);
      }
    });

    function startCats() {
      spawnCat();
      catInterval = setInterval(spawnCat, 1500);
    }

    function spawnCat() {
      const cat = document.createElement('div');
      cat.className = 'modern-cat';
      cat.innerHTML = catHTML;
      
      cat.style.top = (Math.random() * 60 + 20) + 'vh';
      // Скорость пробега
      const duration = Math.random() * 2 + 3; 
      cat.style.animationDuration = duration + 's';

      if (!gravityToggle.checked) {
        cat.classList.add('float-anim');
      } else {
        cat.classList.add('run-anim');
      }
      
      // Удаляем кота после того, как он убежал за экран
      cat.addEventListener('animationend', () => cat.remove());
      
      layer.appendChild(cat);
    }

    // --- ПИЦЦА ---
    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!playedPizza) {
          playedPizza = true;
          playCutscene("Пицца вызывается на ковёр...", false, () => {
            // Спавним пиццу, которая падает (или улетает, если нет гравитации)
            for(let i=0; i<5; i++) {
               const pizza = document.createElement('div');
               pizza.className = 'cutscene-pizza-wrapper';
               pizza.textContent = '🍕';
               pizza.style.left = (Math.random() * 80 + 10) + '%';
               
               if (gravityToggle.checked) {
                 pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                 pizza.style.animationDelay = i * 0.2 + 's';
               } else {
                 // Если гравитации нет, она улетает вверх
                 pizza.style.bottom = '10%'; // Ставим внизу
                 pizza.style.animation = `flyUp ${Math.random() * 1.5 + 1}s linear forwards`;
                 pizza.style.animationDelay = i * 0.2 + 's';
               }
               cutsceneItems.appendChild(pizza);
            }
          });
          setTimeout(startPizza, 3000);
        } else {
          startPizza();
        }
      } else {
        clearInterval(pizzaInterval);
        // Удаляем все пиццы с экрана, если выключили
        document.querySelectorAll('.flying-pizza').forEach(p => p.remove());
      }
    });

    function startPizza() {
      spawnPizza();
      pizzaInterval = setInterval(spawnPizza, 500);
    }

    function spawnPizza() {
      const pizza = document.createElement('div');
      pizza.className = 'flying-pizza';
      pizza.textContent = '🍕';
      pizza.style.left = (Math.random() * 85 + 5) + 'vw';
      
      if (gravityToggle.checked) {
        // Падает
        pizza.style.top = '-60px';
        pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        pizza.classList.add('fall-anim');
      } else {
        // Улетает вверх (если гравитации нет)
        pizza.style.top = '100vh'; // начинаем снизу
        pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        pizza.classList.add('fly-up-anim');
      }

      pizza.addEventListener('animationend', () => pizza.remove());
      layer.appendChild(pizza);
    }

    // --- ГРАВИТАЦИЯ ---
    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.modern-cat');
      const pizzas = document.querySelectorAll('.flying-pizza');
      
      if (!e.target.checked) {
        // ГРАВИТАЦИЯ ВЫКЛ
        if (!playedGravity) {
          playedGravity = true;
          playCutscene("Гравитация отключена...", true, () => {
            // В катсцене все коты улетают
            for(let i=0; i<4; i++) {
               const wrapper = document.createElement('div');
               wrapper.className = 'cutscene-cat-wrapper';
               wrapper.style.bottom = '15%';
               wrapper.style.animation = `flyUp ${Math.random() * 1.5 + 1}s linear forwards`;
               wrapper.innerHTML = `<div class="modern-cat" style="position:relative;">${catHTML}</div>`;
               cutsceneItems.appendChild(wrapper);
            }
          });
        }

        cats.forEach(cat => {
          cat.classList.remove('run-anim');
          cat.style.animation = 'none'; 
          cat.style.top = (Math.random() * 20 + 5) + 'vh'; 
          setTimeout(() => cat.classList.add('float-anim'), 1000);
        });
        
        // Пицца теперь тоже улетает вверх!
        pizzas.forEach(pizza => {
          const currentLeft = pizza.style.left;
          pizza.className = 'flying-pizza fly-up-anim';
          pizza.style.top = '100vh'; // Сбрасываем вниз
          pizza.style.left = currentLeft;
          pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        });

      } else {
        // ГРАВИТАЦИЯ ВКЛ
        cats.forEach(cat => {
          cat.classList.remove('float-anim');
          cat.style.top = (Math.random() * 60 + 20) + 'vh';
          setTimeout(() => {
            cat.classList.add('run-anim');
          }, 1000);
        });

        // Пицца снова начинает падать
        pizzas.forEach(pizza => {
           const currentLeft = pizza.style.left;
           pizza.className = 'flying-pizza fall-anim';
           pizza.style.top = '-60px';
           pizza.style.left = currentLeft;
           pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        });
      }
    });

    // --- РЕАЛЬНОСТЬ ---
    realityToggle.addEventListener('change', (e) => {
      document.body.classList.toggle('reality-inverted', e.target.checked);
    });
  </script>
</body>
</html>
