<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌌Управление Вселенной🌌</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 1s ease;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 50; 
      overflow: hidden; 
    }

    /* --- КАТСЦЕНА И РЕЖИМ МИРА --- */
    #world-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); 
      z-index: 40; 
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease, background 1s ease;
      overflow: hidden;
    }

    #world-view.active { display: flex; opacity: 1; }

    .world-sky-day { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%) !important; }
    .world-sky-sunset { background: linear-gradient(to bottom, #ff7e5f 0%, #feb47b 100%) !important; }
    .world-sky-night { background: linear-gradient(to bottom, #0f2027 0%, #203a43 100%) !important; }
    .world-sky-matrix { background: linear-gradient(to bottom, #000000 0%, #003300 100%) !important; }

    .world-text {
      position: absolute; top: 25%; font-size: 24px; font-weight: 700; text-align: center;
      z-index: 100; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); color: #fff;
      opacity: 0; animation: fadeInOut 2.5s forwards;
      width: 100%; padding: 0 20px; pointer-events: none;
    }
    
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    .close-world-btn {
      position: absolute; top: 20px; right: 20px; z-index: 110;
      background: rgba(255, 0, 85, 0.8); color: white;
      border: none; padding: 10px 20px; border-radius: 20px;
      font-weight: bold; cursor: pointer; backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none; font-size: 14px;
    }
    .close-world-btn.active { display: block; }

    /* --- ГОРОД --- */
    .street-scene { position: absolute; bottom: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1;}
    .road-surface { position: absolute; bottom: 0; width: 100%; height: 25%; background: #1a1a24; border-top: 4px solid #444; z-index: 2; transition: background 1s; }

    /* ОПУСТИЛИ ДЕРЕВЬЯ НА ЗЕМЛЮ */
    .trees-container { position: absolute; bottom: 20%; width: 100%; height: 100px; z-index: 3; display: flex; justify-content: space-around; pointer-events: none; }
    .tree { font-size: 50px; transform: scale(0); transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .trees-container.active .tree { transform: scale(1); }

    .buildings-back {
      position: absolute; bottom: 25%; width: 100%; height: 200px; 
      background: linear-gradient(to right, #1b263b, #2b2d42, #1b263b);
      clip-path: polygon(0 100%, 0 30%, 5% 30%, 5% 60%, 15% 60%, 15% 10%, 25% 10%, 25% 80%, 40% 80%, 40% 20%, 55% 20%, 55% 50%, 65% 50%, 65% 40%, 80% 40%, 80% 90%, 90% 90%, 90% 30%, 100% 30%, 100% 100%);
      opacity: 0.8;
    }

    .buildings-front {
      position: absolute; bottom: 25%; width: 100%; height: 120px; background: #0d1117;
      clip-path: polygon(0 100%, 0 50%, 10% 50%, 10% 20%, 20% 20%, 20% 60%, 35% 60%, 35% 40%, 50% 40%, 50% 90%, 70% 90%, 70% 10%, 85% 10%, 85% 70%, 100% 70%, 100% 100%);
      background-image: 
        radial-gradient(circle at 5% 70%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 15% 60%, #00f2fe 3px, transparent 4px),
        radial-gradient(circle at 25% 80%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 40% 50%, #ff69b4 3px, transparent 4px),
        radial-gradient(circle at 55% 70%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 75% 30%, #00f2fe 3px, transparent 4px),
        radial-gradient(circle at 80% 60%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 90% 80%, #ff69b4 3px, transparent 4px);
      background-size: 100% 100%;
    }

    /* --- ИНТЕРФЕЙС --- */
    .main-container {
      display: flex; gap: 20px; z-index: 60; align-items: flex-start; justify-content: center;
      width: 100%; padding: 20px; transition: opacity 0.5s ease;
    }
    .main-container.hidden { opacity: 0; pointer-events: none; display: none; }

    .panel {
      background: rgba(15, 25, 35, 0.8);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 90vw; max-width: 380px; max-height: 90vh; overflow-y: auto;
    }

    .news-panel {
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      padding: 15px; width: 280px; max-height: 80vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .news-panel h2 {
      font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
      color: #ff0055; text-align: center; margin-bottom: 5px;
      border-bottom: 2px solid #ff0055; padding-bottom: 10px;
    }

    .news-item {
      font-size: 12px; line-height: 1.4; padding: 8px;
      background: rgba(255, 255, 255, 0.05); border-left: 3px solid #4facfe;
      border-radius: 4px; animation: slideIn 0.3s ease-out forwards;
    }

    .news-item.red-team {
      border-left: 3px solid #ffd700; background: rgba(255, 215, 0, 0.1);
      color: #ffd700; font-weight: bold; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }
    .news-item .press-name { font-weight: 900; color: #fff; margin-right: 5px; }
    .news-item.red-team .press-name { color: #ffd700; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    h1 {
      text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 15px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 13px; font-weight: 500; color: #e0e0e0; }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%;
    }
    
    #toggle-cats:checked + .slider { background-color: #ff9900; border-color: #ff9900; }
    #toggle-gravity:checked + .slider { background-color: #00f2fe; border-color: #00f2fe; }
    #toggle-pizza:checked + .slider { background-color: #ff69b4; border-color: #ff69b4; }
    #toggle-fish:checked + .slider { background-color: #00ffff; border-color: #00ffff; }
    #toggle-aliens:checked + .slider { background-color: #9d4edd; border-color: #9d4edd; }
    #toggle-sky:checked + .slider { background-color: #00ff00; border-color: #00ff00; }
    #toggle-blackhole:checked + .slider { background-color: #333333; border-color: #8a2be2; }
    #toggle-meteor:checked + .slider { background-color: #ff4500; border-color: #ff4500; }
    #toggle-trees:checked + .slider { background-color: #32cd32; border-color: #32cd32; }
    #toggle-balloons:checked + .slider { background-color: #ff1493; border-color: #ff1493; }
    #toggle-peace:checked + .slider { background-color: #ffffff; border-color: #ffffff; }

    input:checked + .slider:before { transform: translateX(20px); }

    .world-btn {
      width: 100%; margin-top: 15px; padding: 12px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      border: none; border-radius: 12px; color: #000;
      font-weight: 900; font-size: 14px; cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
      transition: transform 0.2s;
    }
    .world-btn:active { transform: scale(0.95); }

    /* --- КВАДРАТНЫЙ КОТ --- */
    .modern-cat {
      position: absolute; width: 60px; height: 60px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
    .cat-head { position: absolute; top: 0; left: 0; width: 40px; height: 40px; background-color: #ff9900; border-radius: 4px; }
    .cat-head::before, .cat-head::after { content: ''; position: absolute; top: -10px; width: 15px; height: 15px; background-color: #ff9900; border-radius: 2px; }
    .cat-head::before { left: 0; }
    .cat-head::after { right: 0; }
    .cat-eye-l, .cat-eye-r { position: absolute; top: 15px; width: 8px; height: 8px; background-color: #222; border-radius: 50%; }
    .cat-eye-l { left: 8px; }
    .cat-eye-r { right: 8px; }
    .cat-nose { position: absolute; top: 25px; left: 17px; width: 6px; height: 4px; background-color: #ff69b4; border-radius: 2px; }
    .cat-body { position: absolute; top: 40px; left: 5px; width: 35px; height: 20px; background-color: #ff9900; border-radius: 4px; }
    .cat-tail { position: absolute; top: 45px; left: 40px; width: 20px; height: 8px; background-color: #ff9900; border-radius: 4px; }
    .cat-paw-l, .cat-paw-r { position: absolute; bottom: 0; width: 10px; height: 10px; background-color: #cc7a00; border-radius: 2px; }
    .cat-paw-l { left: 10px; }
    .cat-paw-r { right: 15px; }

    .flying-item { position: absolute; font-size: 50px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); transition: transform 0.5s ease, opacity 0.5s ease; z-index: 100;}

    .black-hole {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      width: 100px; height: 100px; border-radius: 50%;
      background: radial-gradient(circle, #000 30%, #8a2be2 70%, transparent 100%);
      box-shadow: 0 0 50px 20px rgba(138, 43, 226, 0.6);
      z-index: 80; transition: transform 0.5s ease; pointer-events: none;
    }
    .black-hole.active { transform: translate(-50%, -50%) scale(1); }
    .black-hole.pulsate { animation: pulseHole 2s infinite alternate; }
    @keyframes pulseHole { 0% { box-shadow: 0 0 50px 20px rgba(138, 43, 226, 0.6); } 100% { box-shadow: 0 0 80px 40px rgba(138, 43, 226, 0.9); } }

    .run-anim { animation: runAcross linear forwards; }
    @keyframes runAcross { 0% { transform: translateX(-100px); } 100% { transform: translateX(100vw); } }
    .float-anim { animation: hover 2s ease-in-out infinite alternate; }
    @keyframes hover { 0% { transform: translateY(0) rotate(-15deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
    
    .fall-anim { animation: fallDown linear forwards; }
    @keyframes fallDown { 0% { transform: translateY(0); } 100% { transform: translateY(75vh); } }
    
    .fly-up-anim { animation: flyUp linear forwards; }
    @keyframes flyUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-120vh) rotate(-360deg); opacity: 0; } }

    .fall-smooth-anim { animation: fallSmooth linear forwards; }
    @keyframes fallSmooth { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(75vh); opacity: 0; } }

    .dissolve-anim { animation: dissolve 1.5s ease-in forwards; }
    @keyframes dissolve { 0% { transform: scale(1); opacity: 1; filter: blur(0px); } 100% { transform: scale(0.5); opacity: 0; filter: blur(5px); } }

    .peace-glow { filter: drop-shadow(0 0 15px #ffd700) !important; }
    .peace-bg { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%) !important; }

    .sky-day { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) !important; }
    .sky-sunset { background: linear-gradient(135deg, #2b1055, #7597de) !important; }
    .sky-night { background: linear-gradient(135deg, #000000, #434343) !important; }
    .sky-matrix { background: linear-gradient(135deg, #000000, #003300) !important; }

    @media (max-width: 768px) {
      body { flex-direction: column; justify-content: flex-start; padding-top: 20px; overflow-y: auto;}
      .main-container { flex-direction: column; align-items: center; }
      .news-panel { width: 90vw; max-width: 380px; max-height: 200px; margin-top: 20px; }
    }
  </style>
</head>
<body class="sky-day" id="main-body">

  <div id="world-view" class="world-sky-day">
    <button class="close-world-btn" id="close-world-btn">Выйти из Мира ✖</button>
    <div class="world-text" id="world-text">Наблюдение за миром...</div>
    
    <div class="street-scene">
      <div class="buildings-back"></div>
      <div class="buildings-front"></div>
      <div class="road-surface"></div>
      <div class="trees-container" id="trees-container">
        <div class="tree">🌳</div><div class="tree">🌲</div><div class="tree">🌳</div><div class="tree">🌲</div><div class="tree">🌳</div>
      </div>
    </div>
    
    <div class="black-hole" id="black-hole"></div>
  </div>

  <div id="animation-layer"></div>

  <div class="main-container" id="main-ui">
    <div class="panel">
      <h1>🌌Управление Вселенной🌌</h1>

      <div class="toggle-row"><span class="toggle-label">🐈 Квадратные коты</span><label class="switch"><input type="checkbox" id="toggle-cats"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🌍 Гравитация</span><label class="switch"><input type="checkbox" id="toggle-gravity" checked><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🍕 Дождь из пиццы</span><label class="switch"><input type="checkbox" id="toggle-pizza"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🐟 Рыбный дождь</span><label class="switch"><input type="checkbox" id="toggle-fish"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">👽 Вторжение НЛО</span><label class="switch"><input type="checkbox" id="toggle-aliens"><span class="slider"></span></label></div>
      
      <div style="margin: 10px 0; border-top: 1px dashed #555;"></div>
      
      <div class="toggle-row"><span class="toggle-label">🌪️ Черная дыра</span><label class="switch"><input type="checkbox" id="toggle-blackhole"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">☄️ Метеоритный дождь</span><label class="switch"><input type="checkbox" id="toggle-meteor"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🌳 Посадка деревьев</span><label class="switch"><input type="checkbox" id="toggle-trees"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🎈 Воздушные шарики</span><label class="switch"><input type="checkbox" id="toggle-balloons"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">👼 Мир во всем мире</span><label class="switch"><input type="checkbox" id="toggle-peace"><span class="slider"></span></label></div>

      <div class="toggle-row"><span class="toggle-label">🌅 Сменить время суток</span><label class="switch"><input type="checkbox" id="toggle-sky"><span class="slider"></span></label></div>
      
      <button class="world-btn" id="enter-world-btn">Режим наблюдателя 🌏</button>
    </div>

    <div class="news-panel" id="news-feed">
      <h2>Лента событий</h2>
    </div>
  </div>
    <script>
    const body = document.getElementById('main-body');
    const layer = document.getElementById('animation-layer');
    const newsFeed = document.getElementById('news-feed');
    
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const fishToggle = document.getElementById('toggle-fish');
    const alienToggle = document.getElementById('toggle-aliens');
    const skyToggle = document.getElementById('toggle-sky');
    const blackholeToggle = document.getElementById('toggle-blackhole');
    const meteorToggle = document.getElementById('toggle-meteor');
    const treesToggle = document.getElementById('toggle-trees');
    const balloonsToggle = document.getElementById('toggle-balloons');
    const peaceToggle = document.getElementById('toggle-peace');
    
    const worldView = document.getElementById('world-view');
    const mainUI = document.getElementById('main-ui');
    const enterWorldBtn = document.getElementById('enter-world-btn');
    const closeWorldBtn = document.getElementById('close-world-btn');
    const worldText = document.getElementById('world-text');
    const treesContainer = document.getElementById('trees-container');
    const blackHole = document.getElementById('black-hole');

    let intervals = { cats: null, pizza: null, fish: null, aliens: null, meteors: null, balloons: null, blackholeSuck: null };
    const played = { cats: false, pizza: false, gravity: false, fish: false, aliens: false, sky: false, blackhole: false, meteor: false, trees: false, balloons: false, peace: false };
    const isWorldMode = () => worldView.classList.contains('active') && mainUI.classList.contains('hidden');

    // --- НОВОСТИ ---
    const pressList = [
      { name: "Daily Pixel", color: "#4facfe", topic: "all" },
      { name: "The Quantum Times", color: "#00f2fe", topic: "all" },
      { name: "Cat News Network", color: "#ff9900", topic: "cats" },
      { name: "Pizza Post", color: "#ff69b4", topic: "pizza" },
      { name: "Fishy Business", color: "#00ffff", topic: "fish" },
      { name: "Galactic Gossip", color: "#9d4edd", topic: "aliens" },
      { name: "Eco Watch", color: "#32cd32", topic: "trees" },
      { name: "Party Times", color: "#ff1493", topic: "balloons" },
      { name: "Red Team", color: "#ffd700", isRare: true, topic: "all" }
    ];

    function addNews(text, topic = "all") {
      const isRedTeam = Math.random() < 0.05;
      let press;
      if (isRedTeam) { press = pressList.find(p => p.isRare); } 
      else {
        const relevantPress = pressList.filter(p => !p.isRare && (p.topic === topic || p.topic === "all"));
        press = relevantPress[Math.floor(Math.random() * relevantPress.length)] || pressList[0];
      }
      const newsItem = document.createElement('div');
      newsItem.className = 'news-item' + (isRedTeam ? ' red-team' : '');
      const stars = isRedTeam ? ' ⭐⭐⭐' : '';
      newsItem.innerHTML = `<span class="press-name" style="color: ${press.color}">${press.name}${stars}:</span> ${text}`;
      newsFeed.insertBefore(newsItem, newsFeed.children[1]);
      if (newsFeed.children.length > 11) newsFeed.removeChild(newsFeed.lastChild);
    }

    // --- БАЗОВЫЕ ФУНКЦИИ ---
    const catHTML = `<div class="cat-head"><div class="cat-eye-l"></div><div class="cat-eye-r"></div><div class="cat-nose"></div></div><div class="cat-body"></div><div class="cat-tail"></div><div class="cat-paw-l"></div><div class="cat-paw-r"></div>`;

    function removeElement(el) {
      if(!el) return;
      el.classList.add('dissolve-anim');
      setTimeout(() => el.remove(), 1500);
    }

    // --- РЕЖИМ МИРА ---
    enterWorldBtn.addEventListener('click', () => {
      mainUI.classList.add('hidden'); 
      worldView.classList.add('active');
      closeWorldBtn.classList.add('active');
      worldText.textContent = "Режим наблюдателя активирован...";
      worldText.style.animation = 'none'; worldText.offsetHeight; worldText.style.animation = 'fadeInOut 3s forwards';
    });

    closeWorldBtn.addEventListener('click', () => {
      worldView.classList.remove('active');
      closeWorldBtn.classList.remove('active');
      mainUI.classList.remove('hidden'); 
    });

    // --- КАТСЦЕНЫ ---
    function showCutscene(text, duration = 2500) {
      if (isWorldMode()) return;
      
      mainUI.classList.add('hidden'); 
      worldView.classList.add('active');
      worldText.textContent = text;
      worldText.style.animation = 'none'; worldText.offsetHeight; worldText.style.animation = 'fadeInOut 2.5s forwards';
      
      const isGravityOn = gravityToggle.checked;
      const cutsceneObjects = [];

      if (catsToggle.checked) {
        for(let i=0; i<3; i++) {
          const cat = document.createElement('div'); cat.className = 'modern-cat'; cat.innerHTML = catHTML; 
          cat.style.bottom = '25%'; cat.style.top = 'auto';
          if (isGravityOn) { cat.classList.add('run-anim'); cat.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's'; cat.style.animationDelay = i * 0.3 + 's'; } 
          else { cat.style.left = (Math.random() * 80 + 10) + '%'; cat.classList.add('fly-up-anim'); cat.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; cat.style.animationDelay = i * 0.2 + 's'; }
          layer.appendChild(cat); cutsceneObjects.push(cat);
        }
      }
      if (pizzaToggle.checked) {
        for(let i=0; i<5; i++) {
          const pizza = document.createElement('div'); pizza.className = 'flying-item'; pizza.textContent = '🍕'; pizza.style.left = (Math.random() * 80 + 10) + '%';
          if (isGravityOn) { pizza.classList.add('fall-smooth-anim'); pizza.style.top = '-100px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.style.animationDelay = i * 0.2 + 's'; } 
          else { pizza.classList.add('fly-up-anim'); pizza.style.bottom = '10%'; pizza.style.top = 'auto'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.style.animationDelay = i * 0.2 + 's'; }
          layer.appendChild(pizza); cutsceneObjects.push(pizza);
        }
      }
      if (fishToggle.checked) {
        for(let i=0; i<7; i++) {
          const fish = document.createElement('div'); fish.className = 'flying-item'; fish.textContent = '🐟'; fish.style.left = (Math.random() * 90 + 5) + '%';
          if (isGravityOn) { fish.classList.add('fall-smooth-anim'); fish.style.top = '-100px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.style.animationDelay = i * 0.15 + 's'; } 
          else { fish.classList.add('fly-up-anim'); fish.style.bottom = '10%'; fish.style.top = 'auto'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.style.animationDelay = i * 0.15 + 's'; }
          layer.appendChild(fish); cutsceneObjects.push(fish);
        }
      }

      setTimeout(() => {
        worldView.classList.remove('active'); 
        mainUI.classList.remove('hidden'); 
        cutsceneObjects.forEach(obj => obj.remove());
      }, duration); 
    }

    // --- СПАВНЕРЫ (С ФЛАГОМ ДЛЯ ЧЕРНОЙ ДЫРЫ) ---
    function startCats() {
      intervals.cats = setInterval(() => {
        if (document.querySelectorAll('.modern-cat').length > 15) return;
        const cat = document.createElement('div'); cat.className = 'modern-cat'; cat.innerHTML = catHTML;
        cat.dataset.spawnTime = Date.now();
        
        if (!gravityToggle.checked) { 
          cat.style.bottom = '-60px'; cat.style.left = (Math.random() * 90) + 'vw'; cat.classList.add('fly-up-anim'); cat.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
          cat.addEventListener('animationend', () => cat.remove());
        } else { 
          if (isWorldMode()) { cat.style.bottom = '25%'; cat.style.top = 'auto'; } 
          else { cat.style.top = (Math.random() * 60 + 20) + 'vh'; }
          cat.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
          cat.classList.add('run-anim'); 
          cat.addEventListener('animationend', () => removeElement(cat)); 
        }
        layer.appendChild(cat);
      }, 1000);
    }

    function startPizza() {
      intervals.pizza = setInterval(() => {
        if (document.querySelectorAll('.pizza-item').length > 30) return;
        const pizza = document.createElement('div'); pizza.className = 'flying-item pizza-item'; pizza.textContent = '🍕'; pizza.style.left = (Math.random() * 85 + 5) + 'vw';
        pizza.dataset.spawnTime = Date.now();
        
        if (gravityToggle.checked) { 
          pizza.style.top = '-60px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.classList.add('fall-anim'); 
          pizza.addEventListener('animationend', () => removeElement(pizza));
        } else { 
          pizza.style.bottom = '-60px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.classList.add('fly-up-anim'); 
          pizza.addEventListener('animationend', () => pizza.remove());
        }
        layer.appendChild(pizza);
      }, 500);
    }

    function startFish() {
      intervals.fish = setInterval(() => {
        if (document.querySelectorAll('.fish-item').length > 30) return;
        const fish = document.createElement('div'); fish.className = 'flying-item fish-item'; fish.textContent = '🐟'; fish.style.left = (Math.random() * 85 + 5) + 'vw';
        fish.dataset.spawnTime = Date.now();
        
        if (gravityToggle.checked) { 
          fish.style.top = '-60px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.classList.add('fall-anim'); 
          fish.addEventListener('animationend', () => removeElement(fish));
        } else { 
          fish.style.bottom = '-60px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.classList.add('fly-up-anim'); 
          fish.addEventListener('animationend', () => fish.remove());
        }
        layer.appendChild(fish);
      }, 300); 
    }

    function startAliens() {
      intervals.aliens = setInterval(() => {
        if (document.querySelectorAll('.ufo-item').length > 10) return;
        const ufo = document.createElement('div'); ufo.className = 'flying-item ufo-item'; ufo.textContent = '🛸'; ufo.style.left = (Math.random() * 85 + 5) + 'vw';
        ufo.dataset.spawnTime = Date.now();
        
        if (gravityToggle.checked) { 
          ufo.style.top = (Math.random() * 50 + 10) + 'vh'; ufo.classList.add('float-anim'); 
        } else { 
          ufo.style.bottom = '-60px'; ufo.classList.add('fly-up-anim'); ufo.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
          ufo.addEventListener('animationend', () => ufo.remove());
        }
        layer.appendChild(ufo);
      }, 2000);
    }

    function startMeteors() {
      intervals.meteors = setInterval(() => {
        const meteor = document.createElement('div'); meteor.className = 'flying-item meteor-item'; meteor.textContent = '☄️'; meteor.style.left = (Math.random() * 85 + 5) + 'vw';
        meteor.style.top = '-60px'; meteor.style.animationDuration = (Math.random() * 0.5 + 0.8) + 's'; meteor.classList.add('fall-anim');
        meteor.dataset.spawnTime = Date.now();
        
        meteor.addEventListener('animationend', () => {
           if (blackholeToggle.checked) return; 
           meteor.remove();
        });
        layer.appendChild(meteor);
      }, 400);
    }

    function startBalloons() {
      intervals.balloons = setInterval(() => {
        const balloon = document.createElement('div'); balloon.className = 'flying-item balloon-item'; balloon.textContent = '🎈'; balloon.style.left = (Math.random() * 85 + 5) + 'vw';
        balloon.style.bottom = '-60px'; balloon.style.animationDuration = (Math.random() * 3 + 2) + 's'; balloon.classList.add('fly-up-anim');
        balloon.dataset.spawnTime = Date.now();
        
        balloon.addEventListener('animationend', () => balloon.remove());
        layer.appendChild(balloon);
      }, 600);
    }

    // --- ЧЕРНАЯ ДЫРА (НЕ ТРОГАЕТ НОВЫЕ ОБЪЕКТЫ) ---
    function suckObjects() {
      const objects = document.querySelectorAll('.modern-cat, .flying-item');
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      objects.forEach(obj => {
        if (obj.classList.contains('sucked')) return;
        
        const spawnTime = parseInt(obj.dataset.spawnTime || 0);
        const age = Date.now() - spawnTime;
        
        if (age < 500) return; // Даем объекту 0.5 сек, чтобы вылететь

        const rect = obj.getBoundingClientRect();
        const objX = rect.left + rect.width / 2;
        const objY = rect.top + rect.height / 2;
        const deltaX = centerX - objX;
        const deltaY = centerY - objY;

        obj.classList.add('sucked');
        obj.classList.remove('run-anim', 'fall-anim', 'fly-up-anim', 'float-anim', 'fall-smooth-anim');
        
        obj.style.transition = 'transform 1.5s ease-in, opacity 1.5s ease-in';
        obj.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0) rotate(720deg)`;
        obj.style.opacity = '0';
        setTimeout(() => obj.remove(), 1500);
      });
    }

    // --- ОБРАБОТЧИКИ ТУМБЛЕРОВ ---
    blackholeToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.blackhole) { played.blackhole = true; showCutscene("Внимание! Обнаружена аномалия..."); addNews("В центре города образовалась черная дыра!", "all"); }
        blackHole.classList.add('active');
        setTimeout(() => blackHole.classList.add('pulsate'), 500);
        intervals.blackholeSuck = setInterval(suckObjects, 500);
      } else {
        blackHole.classList.remove('active', 'pulsate');
        clearInterval(intervals.blackholeSuck);
        document.querySelectorAll('.sucked').forEach(obj => {
           obj.classList.remove('sucked');
           obj.style.transform = 'none';
           obj.style.opacity = '1';
        });
      }
    });

    meteorToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.meteor) { played.meteor = true; showCutscene("Конец света отменяется, но метеориты прилетели..."); addNews("Метеоритный дождь! Берегите головы!", "all"); }
        startMeteors();
      } else {
        clearInterval(intervals.meteors);
      }
    });

    treesToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.trees) { played.trees = true; showCutscene("Время наводить порядок..."); addNews("Город стал зеленее! Экологи в восторге.", "trees"); }
        treesContainer.classList.add('active');
      } else {
        treesContainer.classList.remove('active');
      }
    });

    balloonsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.balloons) { played.balloons = true; showCutscene("Праздник к нам приходит..."); addNews("В небе появились воздушные шарики!", "balloons"); }
        startBalloons();
      } else {
        clearInterval(intervals.balloons);
        document.querySelectorAll('.balloon-item').forEach(b => b.remove());
      }
    });

    peaceToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.peace) { played.peace = true; showCutscene("Все конфликты урегулированы..."); addNews("Наступил мир во всем мире. Все обнимаются!", "all"); }
        
        document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
          if (chk !== peaceToggle && chk !== skyToggle && chk !== catsToggle && chk !== gravityToggle) {
            if (chk.checked) { chk.checked = false; chk.dispatchEvent(new Event('change')); }
          }
        });

        document.querySelectorAll('.modern-cat, .flying-item').forEach(obj => {
          obj.classList.add('peace-glow');
          obj.classList.remove('run-anim', 'fall-anim', 'fly-up-anim', 'float-anim');
          obj.style.transition = 'all 1s ease';
          if(obj.classList.contains('modern-cat')) {
             obj.style.top = 'auto'; obj.style.bottom = '25%';
          } else {
             obj.style.top = '72vh'; 
          }
        });
        
        body.classList.add('peace-bg');
      } else {
        document.querySelectorAll('.peace-glow').forEach(obj => obj.classList.remove('peace-glow'));
        body.classList.remove('peace-bg');
      }
    });

    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) { if (!played.cats) { played.cats = true; showCutscene("Квадратные коты выходят на связь..."); addNews("Массовое появление котов.", "cats"); setTimeout(startCats, 2500); } else { startCats(); } } 
      else { clearInterval(intervals.cats); document.querySelectorAll('.modern-cat').forEach(c => c.remove()); }
    });

    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) { if (!played.pizza) { played.pizza = true; showCutscene("Пицца вызывается на ковёр..."); addNews("Дождь из пиццы!", "pizza"); setTimeout(startPizza, 2500); } else { startPizza(); } } 
      else { clearInterval(intervals.pizza); document.querySelectorAll('.pizza-item').forEach(p => p.remove()); }
    });

    fishToggle.addEventListener('change', (e) => {
      if (e.target.checked) { if (!played.fish) { played.fish = true; showCutscene("Рыбный шторм неизбежен..."); addNews("Пошёл рыбный дождь.", "fish"); setTimeout(startFish, 2500); } else { startFish(); } } 
      else { clearInterval(intervals.fish); document.querySelectorAll('.fish-item').forEach(f => f.remove()); }
    });

    alienToggle.addEventListener('change', (e) => {
      if (e.target.checked) { if (!played.aliens) { played.aliens = true; showCutscene("Обнаружены НЛО..."); addNews("НЛО над городом!", "aliens"); setTimeout(startAliens, 2500); } else { startAliens(); } } 
      else { clearInterval(intervals.aliens); document.querySelectorAll('.ufo-item').forEach(u => u.remove()); }
    });

    gravityToggle.addEventListener('change', (e) => {
      if (!e.target.checked) {
        if (!played.gravity) { played.gravity = true; showCutscene("Гравитация отключена..."); addNews("Гравитация отключена!", "all"); }
      }
    });

    let skyState = 0; 
    skyToggle.addEventListener('change', (e) => {
      skyState = (skyState + 1) % 4;
      body.classList.remove('sky-day', 'sky-sunset', 'sky-night', 'sky-matrix');
      worldView.classList.remove('world-sky-day', 'world-sky-sunset', 'world-sky-night', 'world-sky-matrix');
      
      let skyName = "";
      if (skyState === 0) { body.classList.add('sky-day'); worldView.classList.add('world-sky-day'); skyName = "День"; }
      if (skyState === 1) { body.classList.add('sky-sunset'); worldView.classList.add('world-sky-sunset'); skyName = "Закат"; }
      if (skyState === 2) { body.classList.add('sky-night'); worldView.classList.add('world-sky-night'); skyName = "Ночь"; }
      if (skyState === 3) { body.classList.add('sky-matrix'); worldView.classList.add('world-sky-matrix'); skyName = "Матрица"; }

      addNews(`Время суток изменилось на: ${skyName}.`, "all");
    });
  </script>
</body>
</html>
