<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление Вселенной</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 1s ease;
    }

    #animation-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 50; 
      overflow: hidden; 
    }

    /* --- КАТСЦЕНА И РЕЖИМ МИРА --- */
    #world-view {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      z-index: 40; 
      display: none; 
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #world-view.active { display: flex; opacity: 1; }

    .world-text {
      position: absolute; top: 25%; font-size: 24px; font-weight: 700; text-align: center;
      z-index: 100; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); color: #fff;
      opacity: 0; animation: fadeInOut 2.5s forwards;
      width: 100%; padding: 0 20px; pointer-events: none;
    }
    
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    .close-world-btn {
      position: absolute; top: 20px; right: 20px; z-index: 110;
      background: rgba(255, 0, 85, 0.8); color: white;
      border: none; padding: 10px 20px; border-radius: 20px;
      font-weight: bold; cursor: pointer; backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none; font-size: 14px;
    }
    .close-world-btn.active { display: block; }

    /* --- ГОРОД --- */
    .street-scene { position: absolute; bottom: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1;}
    .road-surface { position: absolute; bottom: 0; width: 100%; height: 25%; background: #1a1a24; border-top: 4px solid #444; z-index: 2;}
    
    .ground-pile { 
      position: absolute; bottom: 5px; width: 100%; height: 25%; 
      z-index: 3; display: flex; flex-wrap: wrap-reverse; 
      justify-content: center; align-items: flex-start; align-content: flex-start; 
      pointer-events: none; gap: 5px; overflow: hidden;
    }

    .buildings-back {
      position: absolute; bottom: 25%; width: 100%; height: 200px; 
      background: linear-gradient(to right, #1b263b, #2b2d42, #1b263b);
      clip-path: polygon(0 100%, 0 30%, 5% 30%, 5% 60%, 15% 60%, 15% 10%, 25% 10%, 25% 80%, 40% 80%, 40% 20%, 55% 20%, 55% 50%, 65% 50%, 65% 40%, 80% 40%, 80% 90%, 90% 90%, 90% 30%, 100% 30%, 100% 100%);
      opacity: 0.8;
    }

    .buildings-front {
      position: absolute; bottom: 25%; width: 100%; height: 120px; background: #0d1117;
      clip-path: polygon(0 100%, 0 50%, 10% 50%, 10% 20%, 20% 20%, 20% 60%, 35% 60%, 35% 40%, 50% 40%, 50% 90%, 70% 90%, 70% 10%, 85% 10%, 85% 70%, 100% 70%, 100% 100%);
      background-image: 
        radial-gradient(circle at 5% 70%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 15% 60%, #00f2fe 3px, transparent 4px),
        radial-gradient(circle at 25% 80%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 40% 50%, #ff69b4 3px, transparent 4px),
        radial-gradient(circle at 55% 70%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 75% 30%, #00f2fe 3px, transparent 4px),
        radial-gradient(circle at 80% 60%, #ffcc00 3px, transparent 4px),
        radial-gradient(circle at 90% 80%, #ff69b4 3px, transparent 4px);
      background-size: 100% 100%;
    }

    /* --- ИНТЕРФЕЙС --- */
    .main-container {
      display: flex; gap: 20px; z-index: 60; align-items: flex-start; justify-content: center;
      width: 100%; padding: 20px; transition: opacity 0.5s ease;
    }
    .main-container.hidden { opacity: 0; pointer-events: none; display: none; }

    .panel {
      background: rgba(15, 25, 35, 0.8);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 90vw; max-width: 380px; max-height: 90vh; overflow-y: auto;
    }

    .news-panel {
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      padding: 15px; width: 280px; max-height: 80vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .news-panel h2 {
      font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
      color: #ff0055; text-align: center; margin-bottom: 5px;
      border-bottom: 2px solid #ff0055; padding-bottom: 10px;
    }

    .news-item {
      font-size: 12px; line-height: 1.4; padding: 8px;
      background: rgba(255, 255, 255, 0.05); border-left: 3px solid #4facfe;
      border-radius: 4px; animation: slideIn 0.3s ease-out forwards;
    }

    .news-item.red-team {
      border-left: 3px solid #ffd700; background: rgba(255, 215, 0, 0.1);
      color: #ffd700; font-weight: bold; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }
    .news-item .press-name { font-weight: 900; color: #fff; margin-right: 5px; }
    .news-item.red-team .press-name { color: #ffd700; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    h1 {
      text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 20px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 14px; font-weight: 500; color: #e0e0e0; }

    .switch { position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%;
    }
    #toggle-cats:checked + .slider { background-color: #ff9900; border-color: #ff9900; }
    #toggle-gravity:checked + .slider { background-color: #00f2fe; border-color: #00f2fe; }
    #toggle-pizza:checked + .slider { background-color: #ff69b4; border-color: #ff69b4; }
    #toggle-fish:checked + .slider { background-color: #00ffff; border-color: #00ffff; }
    #toggle-aliens:checked + .slider { background-color: #9d4edd; border-color: #9d4edd; }
    #toggle-sky:checked + .slider { background-color: #00ff00; border-color: #00ff00; }
    input:checked + .slider:before { transform: translateX(22px); }

    .world-btn {
      width: 100%; margin-top: 20px; padding: 15px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      border: none; border-radius: 12px; color: #000;
      font-weight: 900; font-size: 16px; cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
      transition: transform 0.2s;
    }
    .world-btn:active { transform: scale(0.95); }

    /* --- КВАДРАТНЫЙ КОТ --- */
    .modern-cat {
      position: absolute; width: 60px; height: 60px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
    .cat-head { position: absolute; top: 0; left: 0; width: 40px; height: 40px; background-color: #ff9900; border-radius: 4px; }
    .cat-head::before, .cat-head::after { content: ''; position: absolute; top: -10px; width: 15px; height: 15px; background-color: #ff9900; border-radius: 2px; }
    .cat-head::before { left: 0; }
    .cat-head::after { right: 0; }
    .cat-eye-l, .cat-eye-r { position: absolute; top: 15px; width: 8px; height: 8px; background-color: #222; border-radius: 50%; }
    .cat-eye-l { left: 8px; }
    .cat-eye-r { right: 8px; }
    .cat-nose { position: absolute; top: 25px; left: 17px; width: 6px; height: 4px; background-color: #ff69b4; border-radius: 2px; }
    .cat-body { position: absolute; top: 40px; left: 5px; width: 35px; height: 20px; background-color: #ff9900; border-radius: 4px; }
    .cat-tail { position: absolute; top: 45px; left: 40px; width: 20px; height: 8px; background-color: #ff9900; border-radius: 4px; }
    .cat-paw-l, .cat-paw-r { position: absolute; bottom: 0; width: 10px; height: 10px; background-color: #cc7a00; border-radius: 2px; }
    .cat-paw-l { left: 10px; }
    .cat-paw-r { right: 15px; }

    /* Объекты */
    .flying-item { position: absolute; font-size: 50px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); transition: transform 0.5s ease, opacity 0.5s ease; }

    /* Анимации */
    .run-anim { animation: runAcross linear forwards; }
    @keyframes runAcross { 0% { transform: translateX(-100px); } 100% { transform: translateX(100vw); } }
    .float-anim { animation: hover 2s ease-in-out infinite alternate; }
    @keyframes hover { 0% { transform: translateY(0) rotate(-15deg); } 100% { transform: translateY(-30px) rotate(15deg); } }
    .fall-anim { animation: fallDown linear forwards; }
    @keyframes fallDown { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(75vh) rotate(360deg); } }
    .fly-up-anim { animation: flyUp linear forwards; }
    @keyframes flyUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-120vh) rotate(-360deg); opacity: 0; } }

    .dissolve-anim { animation: dissolve 1.5s ease-in forwards; }
    @keyframes dissolve { 0% { transform: scale(1); opacity: 1; filter: blur(0px); } 100% { transform: scale(0.5); opacity: 0; filter: blur(5px); } }

    /* Смена неба */
    .sky-day { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) !important; }
    .sky-sunset { background: linear-gradient(135deg, #2b1055, #7597de) !important; }
    .sky-night { background: linear-gradient(135deg, #000000, #434343) !important; }
    .sky-matrix { background: linear-gradient(135deg, #000000, #003300) !important; }

    @media (max-width: 768px) {
      body { flex-direction: column; justify-content: flex-start; padding-top: 20px; overflow-y: auto;}
      .main-container { flex-direction: column; align-items: center; }
      .news-panel { width: 90vw; max-width: 380px; max-height: 200px; margin-top: 20px; }
    }
  </style>
</head>
<body class="sky-day" id="main-body">

  <div id="world-view">
    <button class="close-world-btn" id="close-world-btn">Выйти из Мира ✖</button>
    <div class="world-text" id="world-text">Наблюдение за миром...</div>
    
    <div class="street-scene">
      <div class="buildings-back"></div>
      <div class="buildings-front"></div>
      <div class="road-surface"></div>
      <div class="ground-pile" id="ground-pile"></div>
    </div>
  </div>

  <div id="animation-layer"></div>

  <div class="main-container" id="main-ui">
    <div class="panel">
      <h1>Управление Вселенной</h1>

      <div class="toggle-row"><span class="toggle-label">🐈 Квадратные коты</span><label class="switch"><input type="checkbox" id="toggle-cats"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🌍 Гравитация</span><label class="switch"><input type="checkbox" id="toggle-gravity" checked><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🍕 Дождь из пиццы</span><label class="switch"><input type="checkbox" id="toggle-pizza"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🐟 Рыбный дождь</span><label class="switch"><input type="checkbox" id="toggle-fish"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">👽 Вторжение НЛО</span><label class="switch"><input type="checkbox" id="toggle-aliens"><span class="slider"></span></label></div>
      <div class="toggle-row"><span class="toggle-label">🌅 Сменить время суток</span><label class="switch"><input type="checkbox" id="toggle-sky"><span class="slider"></span></label></div>
      
      <button class="world-btn" id="enter-world-btn">Режим наблюдателя 🌏</button>
    </div>

    <div class="news-panel" id="news-feed">
      <h2>Лента событий</h2>
    </div>
  </div>

  <script>
    const body = document.getElementById('main-body');
    const layer = document.getElementById('animation-layer');
    const newsFeed = document.getElementById('news-feed');
    
    const catsToggle = document.getElementById('toggle-cats');
    const gravityToggle = document.getElementById('toggle-gravity');
    const pizzaToggle = document.getElementById('toggle-pizza');
    const fishToggle = document.getElementById('toggle-fish');
    const alienToggle = document.getElementById('toggle-aliens');
    const skyToggle = document.getElementById('toggle-sky');
    
    const worldView = document.getElementById('world-view');
    const mainUI = document.getElementById('main-ui');
    const enterWorldBtn = document.getElementById('enter-world-btn');
    const closeWorldBtn = document.getElementById('close-world-btn');
    const groundPile = document.getElementById('ground-pile');
    const worldText = document.getElementById('world-text');

    let catInterval = null;
    let pizzaInterval = null;
    let fishInterval = null;
    let alienInterval = null;
    
    const played = { cats: false, pizza: false, gravity: false, fish: false, aliens: false, sky: false };
    const isWorldMode = () => worldView.classList.contains('active') && mainUI.classList.contains('hidden');

    // --- НОВОСТИ ---
    const pressList = [
      { name: "Daily Pixel", color: "#4facfe", topic: "all" },
      { name: "The Quantum Times", color: "#00f2fe", topic: "all" },
      { name: "Cat News Network", color: "#ff9900", topic: "cats" },
      { name: "Pizza Post", color: "#ff69b4", topic: "pizza" },
      { name: "Fishy Business", color: "#00ffff", topic: "fish" },
      { name: "Galactic Gossip", color: "#9d4edd", topic: "aliens" },
      { name: "Red Team", color: "#ffd700", isRare: true, topic: "all" }
    ];

    function addNews(text, topic = "all") {
      const isRedTeam = Math.random() < 0.05;
      let press;
      if (isRedTeam) { press = pressList.find(p => p.isRare); } 
      else {
        const relevantPress = pressList.filter(p => !p.isRare && (p.topic === topic || p.topic === "all"));
        press = relevantPress[Math.floor(Math.random() * relevantPress.length)];
      }
      const newsItem = document.createElement('div');
      newsItem.className = 'news-item' + (isRedTeam ? ' red-team' : '');
      const stars = isRedTeam ? ' ⭐⭐⭐' : '';
      newsItem.innerHTML = `<span class="press-name" style="color: ${press.color}">${press.name}${stars}:</span> ${text}`;
      newsFeed.insertBefore(newsItem, newsFeed.children[1]);
      if (newsFeed.children.length > 11) newsFeed.removeChild(newsFeed.lastChild);
    }

    // --- РЕЖИМ МИРА ---
    enterWorldBtn.addEventListener('click', () => {
      mainUI.classList.add('hidden'); // Скрываем пульт
      worldView.classList.add('active');
      closeWorldBtn.classList.add('active');
      worldText.textContent = "Режим наблюдателя активирован...";
      worldText.style.animation = 'none';
      worldText.offsetHeight; 
      worldText.style.animation = 'fadeInOut 3s forwards';
    });

    closeWorldBtn.addEventListener('click', () => {
      worldView.classList.remove('active');
      closeWorldBtn.classList.remove('active');
      mainUI.classList.remove('hidden'); // Возвращаем пульт
      setTimeout(() => { groundPile.innerHTML = ''; }, 500);
    });

    // --- КАТСЦЕНЫ ---
    function showCutscene(text, duration = 2500) {
      if (isWorldMode()) return;
      
      mainUI.classList.add('hidden'); // СКРЫВАЕМ ПУЛЬТ НА ВРЕМЯ КАТСЦЕНЫ
      worldView.classList.add('active');
      worldText.textContent = text;
      
      const isGravityOn = gravityToggle.checked;
      const cutsceneObjects = [];

      if (catsToggle.checked) {
        for(let i=0; i<3; i++) {
          const cat = document.createElement('div'); cat.className = 'modern-cat'; cat.innerHTML = catHTML; cat.style.bottom = '25%'; 
          if (isGravityOn) { cat.classList.add('run-anim'); cat.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's'; cat.style.animationDelay = i * 0.3 + 's'; } 
          else { cat.style.left = (Math.random() * 80 + 10) + '%'; cat.classList.add('fly-up-anim'); cat.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; cat.style.animationDelay = i * 0.2 + 's'; }
          layer.appendChild(cat); cutsceneObjects.push(cat);
        }
      }
      if (pizzaToggle.checked) {
        for(let i=0; i<5; i++) {
          const pizza = document.createElement('div'); pizza.className = 'flying-item'; pizza.textContent = '🍕'; pizza.style.left = (Math.random() * 80 + 10) + '%';
          if (isGravityOn) { pizza.classList.add('fall-anim'); pizza.style.top = '-100px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.style.animationDelay = i * 0.2 + 's'; } 
          else { pizza.classList.add('fly-up-anim'); pizza.style.bottom = '10%'; pizza.style.top = 'auto'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.style.animationDelay = i * 0.2 + 's'; }
          layer.appendChild(pizza); cutsceneObjects.push(pizza);
        }
      }
      if (fishToggle.checked) {
        for(let i=0; i<7; i++) {
          const fish = document.createElement('div'); fish.className = 'flying-item'; fish.textContent = '🐟'; fish.style.left = (Math.random() * 90 + 5) + '%';
          if (isGravityOn) { fish.classList.add('fall-anim'); fish.style.top = '-100px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.style.animationDelay = i * 0.15 + 's'; } 
          else { fish.classList.add('fly-up-anim'); fish.style.bottom = '10%'; fish.style.top = 'auto'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.style.animationDelay = i * 0.15 + 's'; }
          layer.appendChild(fish); cutsceneObjects.push(fish);
        }
      }
      if (alienToggle.checked) {
        for(let i=0; i<3; i++) {
          const ufo = document.createElement('div'); ufo.className = 'flying-item'; ufo.textContent = '🛸'; ufo.style.left = (Math.random() * 80 + 10) + '%';
          if (isGravityOn) { ufo.classList.add('float-anim'); ufo.style.top = '20%'; ufo.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; } 
          else { ufo.classList.add('fly-up-anim'); ufo.style.bottom = '20%'; ufo.style.top = 'auto'; ufo.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; }
          layer.appendChild(ufo); cutsceneObjects.push(ufo);
        }
      }

      setTimeout(() => {
        worldView.classList.remove('active'); 
        mainUI.classList.remove('hidden'); // ВОЗВРАЩАЕМ ПУЛЬТ
        cutsceneObjects.forEach(obj => obj.remove());
      }, duration); 
    }

    // --- СПАВНЕРЫ ---
    const catHTML = `<div class="cat-head"><div class="cat-eye-l"></div><div class="cat-eye-r"></div><div class="cat-nose"></div></div><div class="cat-body"></div><div class="cat-tail"></div><div class="cat-paw-l"></div><div class="cat-paw-r"></div>`;

    function addToGroundPile(element, textContent) {
      if (!isWorldMode()) {
        element.remove(); return;
      }

      const pileItem = document.createElement('div');
      pileItem.style.fontSize = '30px'; 
      if(textContent) pileItem.textContent = textContent;
      else pileItem.innerHTML = catHTML; 
      
      if(element.classList.contains('modern-cat')) {
         pileItem.style.width = '30px'; pileItem.style.height = '30px'; pileItem.style.position = 'relative';
         pileItem.querySelectorAll('.cat-head, .cat-body, .cat-tail, .cat-paw-l, .cat-paw-r').forEach(el => {
            el.style.transform = 'scale(0.5)'; el.style.transformOrigin = 'top left';
         });
      }
      groundPile.appendChild(pileItem);

      // Лежат 2 сек и растворяются
      setTimeout(() => {
        pileItem.classList.add('dissolve-anim');
        setTimeout(() => pileItem.remove(), 1500);
      }, 2000);

      element.remove();
    }

    function startCats() {
      catInterval = setInterval(() => {
        if (document.querySelectorAll('.modern-cat').length > 15) return;
        const cat = document.createElement('div'); cat.className = 'modern-cat'; cat.innerHTML = catHTML;
        
        if (!gravityToggle.checked) { 
          cat.style.bottom = '-60px'; cat.style.left = (Math.random() * 90) + 'vw'; cat.classList.add('fly-up-anim'); cat.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
          cat.addEventListener('animationend', () => cat.remove());
        } else { 
          if (isWorldMode()) {
             cat.style.bottom = '25%'; // Строго по дороге
             cat.style.top = 'auto';
          } else {
             cat.style.top = (Math.random() * 60 + 20) + 'vh';
          }
          cat.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
          cat.classList.add('run-anim'); 
          cat.addEventListener('animationend', () => addToGroundPile(cat)); 
        }
        layer.appendChild(cat);
      }, 1000);
    }

    function startPizza() {
      pizzaInterval = setInterval(() => {
        if (document.querySelectorAll('.pizza-item').length > 30) return;
        const pizza = document.createElement('div'); pizza.className = 'flying-item pizza-item'; pizza.textContent = '🍕'; pizza.style.left = (Math.random() * 85 + 5) + 'vw';
        
        if (gravityToggle.checked) { 
          pizza.style.top = '-60px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.classList.add('fall-anim'); 
          pizza.addEventListener('animationend', () => addToGroundPile(pizza, '🍕'));
        } else { 
          pizza.style.bottom = '-60px'; pizza.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; pizza.classList.add('fly-up-anim'); 
          pizza.addEventListener('animationend', () => pizza.remove());
        }
        layer.appendChild(pizza);
      }, 500);
    }

    function startFish() {
      fishInterval = setInterval(() => {
        if (document.querySelectorAll('.fish-item').length > 30) return;
        const fish = document.createElement('div'); fish.className = 'flying-item fish-item'; fish.textContent = '🐟'; fish.style.left = (Math.random() * 85 + 5) + 'vw';
        
        if (gravityToggle.checked) { 
          fish.style.top = '-60px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.classList.add('fall-anim'); 
          fish.addEventListener('animationend', () => addToGroundPile(fish, '🐟'));
        } else { 
          fish.style.bottom = '-60px'; fish.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; fish.classList.add('fly-up-anim'); 
          fish.addEventListener('animationend', () => fish.remove());
        }
        layer.appendChild(fish);
      }, 300); 
    }

    function startAliens() {
      alienInterval = setInterval(() => {
        if (document.querySelectorAll('.ufo-item').length > 10) return;
        const ufo = document.createElement('div'); ufo.className = 'flying-item ufo-item'; ufo.textContent = '🛸'; ufo.style.left = (Math.random() * 85 + 5) + 'vw';
        
        if (gravityToggle.checked) { 
          ufo.style.top = (Math.random() * 50 + 10) + 'vh'; ufo.classList.add('float-anim'); 
        } else { 
          ufo.style.bottom = '-60px'; ufo.classList.add('fly-up-anim'); ufo.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
          ufo.addEventListener('animationend', () => ufo.remove());
        }
        layer.appendChild(ufo);
      }, 2000);
    }

    // --- ОБРАБОТЧИКИ ---
    catsToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.cats) { played.cats = true; showCutscene("Квадратные коты выходят на связь..."); addNews("Массовое появление квадратных котов.", "cats"); setTimeout(startCats, 2500); } 
        else { startCats(); addNews("Квадратные коты вернулись.", "cats"); }
      } else {
        clearInterval(catInterval);
        document.querySelectorAll('.modern-cat').forEach(c => { c.style.transform = 'scale(0)'; c.style.opacity = '0'; setTimeout(() => c.remove(), 500); });
        addNews("Квадратные коты исчезли.", "cats");
      }
    });

    pizzaToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.pizza) { played.pizza = true; showCutscene("Пицца вызывается на ковёр..."); addNews("На город обрушился дождь из пиццы!", "pizza"); setTimeout(startPizza, 2500); } 
        else { startPizza(); }
      } else {
        clearInterval(pizzaInterval);
        document.querySelectorAll('.pizza-item').forEach(p => { p.style.transform = 'scale(0)'; p.style.opacity = '0'; setTimeout(() => p.remove(), 500); });
        addNews("Дождь из пиццы прекратился.", "pizza");
      }
    });

    fishToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.fish) { played.fish = true; showCutscene("Рыбный шторм неизбежен..."); addNews("Внезапно пошёл рыбный дождь.", "fish"); setTimeout(startFish, 2500); } 
        else { startFish(); }
      } else {
        clearInterval(fishInterval);
        document.querySelectorAll('.fish-item').forEach(f => { f.style.transform = 'scale(0)'; f.style.opacity = '0'; setTimeout(() => f.remove(), 500); });
        addNews("Рыбный дождь закончился.", "fish");
      }
    });

    alienToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!played.aliens) { played.aliens = true; showCutscene("Обнаружены НЛО..."); addNews("Скопление НЛО над городом!", "aliens"); setTimeout(startAliens, 2500); } 
        else { startAliens(); addNews("НЛО вернулись.", "aliens"); }
      } else {
        clearInterval(alienInterval);
        document.querySelectorAll('.ufo-item').forEach(u => { u.style.transform = 'scale(0)'; u.style.opacity = '0'; setTimeout(() => u.remove(), 500); });
        addNews("НЛО покинули атмосферу.", "aliens");
      }
    });

    gravityToggle.addEventListener('change', (e) => {
      const cats = document.querySelectorAll('.modern-cat');
      const items = document.querySelectorAll('.flying-item');
      
      if (!e.target.checked) {
        if (!played.gravity) { played.gravity = true; showCutscene("Гравитация отключена..."); addNews("Учёные: гравитация отключена.", "all"); } 
        else { addNews("Гравитация снова отключена.", "all"); }

        cats.forEach(cat => {
          const rect = cat.getBoundingClientRect(); cat.style.top = 'auto'; cat.style.bottom = (window.innerHeight - rect.bottom) + 'px'; cat.style.left = rect.left + 'px';
          cat.classList.remove('run-anim'); setTimeout(() => { cat.classList.add('fly-up-anim'); cat.style.animationDuration = (Math.random() * 1.5 + 1) + 's'; }, 10);
          cat.addEventListener('animationend', () => cat.remove());
        });
        
        items.forEach(item => {
          if(item.classList.contains('ufo-item')) return;
          item.className = 'flying-item fly-up-anim ' + (item.classList.contains('pizza-item') ? 'pizza-item' : 'fish-item');
          item.style.top = '100vh'; item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          item.addEventListener('animationend', () => item.remove());
        });

      } else {
        addNews("Гравитация восстановлена.", "all");
        cats.forEach(cat => {
          cat.classList.remove('fly-up-anim'); 
          if(isWorldMode()) { cat.style.bottom = '25%'; cat.style.top = 'auto'; }
          else { cat.style.top = (Math.random() * 60 + 20) + 'vh'; cat.style.bottom = 'auto'; }
          setTimeout(() => cat.classList.add('run-anim'), 100);
        });
        items.forEach(item => {
          if(item.classList.contains('ufo-item')) return;
          item.className = 'flying-item fall-anim ' + (item.classList.contains('pizza-item') ? 'pizza-item' : 'fish-item');
          item.style.top = '-60px'; item.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          item.addEventListener('animationend', () => addToGroundPile(item, item.textContent));
        });
      }
    });

    // Смена неба
    let skyState = 0; 
    skyToggle.addEventListener('change', (e) => {
      skyState = (skyState + 1) % 4;
      body.classList.remove('sky-day', 'sky-sunset', 'sky-night', 'sky-matrix');
      
      let skyName = "";
      if (skyState === 0) { body.classList.add('sky-day'); skyName = "День"; }
      if (skyState === 1) { body.classList.add('sky-sunset'); skyName = "Закат"; }
      if (skyState === 2) { body.classList.add('sky-night'); skyName = "Ночь"; }
      if (skyState === 3) { body.classList.add('sky-matrix'); skyName = "Матрица"; }

      addNews(`Время суток изменилось на: ${skyName}.`, "all");
    });
  </script>
</body>
</html>
