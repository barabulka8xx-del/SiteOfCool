<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кнопка Апокалипсиса 💣</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    /* Тряска экрана */
    .shake { animation: shake 0.2s infinite; }
    @keyframes shake {
      0% { transform: translate(2px, 2px) rotate(0deg); }
      25% { transform: translate(-4px, 0px) rotate(2deg); }
      50% { transform: translate(2px, -2px) rotate(-2deg); }
      75% { transform: translate(-4px, 2px) rotate(0deg); }
      100% { transform: translate(2px, -4px) rotate(2deg); }
    }

    h1 {
      font-size: 28px;
      text-align: center;
      margin-bottom: 10px;
      transition: color 0.3s, transform 0.3s;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .status {
      font-size: 24px;
      margin-bottom: 40px;
      font-weight: bold;
      font-family: monospace;
      color: #00ff00;
      transition: color 0.3s;
      text-shadow: 0 0 10px currentColor;
    }

    .btn-container { position: relative; z-index: 10; }

    /* Главная кнопка */
    .apocalypse-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4b1f, #8b0000);
      border: 10px solid #333;
      box-shadow: 0 15px 0 #222, inset 0 -10px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      font-size: 24px;
      font-weight: 900;
      color: white;
      text-shadow: 2px 2px 0px #000;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .apocalypse-btn:active {
      transform: translateY(15px);
      box-shadow: 0 0 0 #222, inset 0 5px 20px rgba(0,0,0,0.8);
    }

    /* Экран после взрыва */
    .end-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }

    .end-screen.active { display: flex; animation: zoomIn 0.5s ease-out; }
    @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .end-screen h2 { font-size: 50px; margin-bottom: 20px; color: #ff0055; text-shadow: 0 0 30px #ff0055; }
    .end-screen p { font-size: 18px; margin-bottom: 30px; color: #aaa; }

    .restart-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255,255,255,0.3);
    }

    /* Летающие объекты (Хаос) */
    .flying-obj {
      position: absolute;
      font-size: 50px;
      pointer-events: none;
      z-index: 5;
      animation: flyUp linear forwards;
    }

    @keyframes flyUp {
      0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1.5) rotate(360deg); opacity: 0; }
    }

    /* Кислотная вспышка */
    .flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: white; z-index: 50; pointer-events: none; opacity: 0;
    }
    .flash.active { animation: flashAnim 0.3s ease-out; }
    @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

  </style>
</head>
<body id="body">

  <h1 id="title">Кнопка Апокалипсиса</h1>
  <div class="status" id="status">Стабильность: 100%</div>

  <div class="btn-container" id="btn-container">
    <button class="apocalypse-btn" id="apoc-btn">НЕ НАЖИМАТЬ</button>
  </div>

  <div class="flash" id="flash"></div>

  <div class="end-screen" id="end-screen">
    <h2>💥 БУМ 💥</h2>
    <p>Ты уничтожил этот мир. Надеюсь, тебе было весело.</p>
    <button class="restart-btn" id="restart-btn">Создать новый мир</button>
  </div>

  <script>
    const body = document.getElementById('body');
    const apocBtn = document.getElementById('apoc-btn');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');
    const endScreen = document.getElementById('end-screen');
    const restartBtn = document.getElementById('restart-btn');
    const flash = document.getElementById('flash');

    let stability = 100;
    let clicks = 0;

    const events = [
      { min: 85, text: "Ой...", color: "#ffeb3b" },
      { min: 65, text: "Ты уверен?", color: "#ff9800" },
      { min: 45, text: "ОСТАНОВИСЬ!", color: "#ff4500" },
      { min: 25, text: "ЧТО ТЫ ДЕЛАЕШЬ?!", color: "#ff0000" },
      { min: 10, text: "СИСТЕМА ПАДАЕТ...", color: "#8b0000" }
    ];

    const chaosEmojis = ['☄️', '👽', '🐸', '💩', '🔥', '💀', '🍕', '👾', '🚀', '🌪️'];

    function spawnChaos() {
      // Спавним 3-5 объектов за раз для полного хаоса
      const count = Math.floor(Math.random() * 3) + 3;
      for (let i = 0; i < count; i++) {
        const obj = document.createElement('div');
        obj.className = 'flying-obj';
        obj.textContent = chaosEmojis[Math.floor(Math.random() * chaosEmojis.length)];
        obj.style.left = Math.random() * 90 + 'vw';
        obj.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
        body.appendChild(obj);
        setTimeout(() => obj.remove(), 1500);
      }
    }

    function triggerFlash() {
      flash.classList.remove('active');
      flash.offsetHeight; // Триггер рефлоу
      flash.classList.add('active');
    }

    apocBtn.addEventListener('click', () => {
      if (stability <= 0) return;

      clicks++;
      stability -= Math.floor(Math.random() * 10) + 8; // Падает быстрее (8-18%)
      if (stability < 0) stability = 0;

      statusEl.textContent = `Стабильность: ${stability}%`;

      // Меняем текст
      const currentEvent = events.find(e => stability >= e.min);
      if (currentEvent) {
        titleEl.textContent = currentEvent.text;
        titleEl.style.color = currentEvent.color;
        statusEl.style.color = currentEvent.color;
        titleEl.style.transform = `scale(${1 + (100 - stability) / 100})`; // Текст растет
      }

      // Тряска
      body.classList.add('shake');
      setTimeout(() => body.classList.remove('shake'), 200);

      // Вспышка на каждом 3-м клике
      if (clicks % 3 === 0) triggerFlash();

      // Спавним хаос (уже с 1-го клика)
      spawnChaos();

      // Меняем фон
      if (stability < 80) body.style.background = 'linear-gradient(45deg, #1a0000, #000)';
      if (stability < 50) body.style.background = 'linear-gradient(45deg, #330000, #110000)';
      if (stability < 20) body.style.background = 'linear-gradient(45deg, #550000, #000)';

      // Меняем кнопку
      if (stability < 60) apocBtn.textContent = "ЖМИ!";
      if (stability < 30) apocBtn.textContent = "ПОСЛЕДНИЙ ШАНС";

      // КОНЕЦ
      if (stability <= 0) {
        apocBtn.style.display = 'none';
        endScreen.classList.add('active');
        body.style.background = '#000';
        statusEl.style.display = 'none';
        titleEl.style.display = 'none';
        triggerFlash();
      }
    });

    restartBtn.addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
