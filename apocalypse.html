<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Кнопка Апокалипсиса</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0c29; background: linear-gradient(to bottom, #240b36, #c31432); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: hidden; transition: background 0.5s; }
    
    /* Экран загрузки */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f0c29; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .loader { border: 4px solid #1a1a24; border-top: 4px solid #ff0055; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error-msg { color: #ff0055; font-size: 16px; font-weight: bold; display: none; margin-bottom: 15px; }
    .btn-back { background: #ff0055; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 14px; }

    .container { z-index: 10; position: relative; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: clamp(20px, 6vw, 32px); margin-bottom: 20px; text-transform: uppercase; text-align: center; text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,0,0,0.8); }

    .stats { width: 100%; display: flex; justify-content: space-between; margin-bottom: 20px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-size: 20px; font-weight: bold; color: #ffd700; }
    .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; }

    .btn { padding: 25px 50px; font-size: 22px; font-weight: 900; color: #fff; background: linear-gradient(45deg, #ff0000, #ff4b1f); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.3); transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); position: relative; text-transform: uppercase; margin-bottom: 30px; }
    .btn:active { transform: scale(0.9); box-shadow: 0 0 40px rgba(255,0,0,1), inset 0 0 20px rgba(255,255,255,0.6); }

    .shop { width: 100%; background: rgba(0,0,0,0.6); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); max-height: 250px; overflow-y: auto; }
    .shop h2 { font-size: 16px; margin-bottom: 10px; text-align: center; color: #ffd700; }
    .upgrade-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .upgrade-item:last-child { border-bottom: none; }
    .upgrade-info { display: flex; flex-direction: column; }
    .upgrade-name { font-size: 14px; font-weight: bold; }
    .upgrade-desc { font-size: 11px; color: #aaa; }
    .btn-buy { background: #00b09b; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-buy:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-buy:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="loading-screen">
    <div class="loader" id="loader"></div>
    <div id="error-msg">
      ❌ Ошибка авторизации.<br>
      <span style="font-size:12px; color:#aaa; font-weight:normal;">Войдите в аккаунт в главном меню.</span>
    </div>
    <a href="menu.html" class="btn-back" id="btn-back" style="display:none;">В меню</a>
  </div>

  <!-- ИГРА -->
  <div class="container" id="main-app" style="display: none;">
    <h1 id="title">Уничтожь человечество</h1>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-val" id="people-count">8 000 000 000</span>
        <span class="stat-label">Людей</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="shards-count">0</span>
        <span class="stat-label">Осколков 💎</span>
      </div>
    </div>

    <button class="btn" id="doom-btn" onclick="clickDoom()">УНИЧТОЖИТЬ</button>

    <div class="shop">
      <h2>🛒 Магазин улучшений</h2>
      <div id="shop-list"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://solitary-math-e969.potapivan1999.workers.dev';
    const WAIFLY_SERVER = 'http://node.waifly.com:27490/api'; 
    const API_URL = `${WORKER_URL}/?url=${WAIFLY_SERVER}`;
    const GAME_ID = 'apocalypse';

    let token = localStorage.getItem('auth_token');
    
    // Состояние игры
    let people = 8000000000;
    let shards = 0;
    let clickPower = 1;
    let autoClickers = 0;
    let lastClickTime = 0; // Для античита

    const UPGRADES = [
        { id: 'click_power', name: 'Мощный палец', desc: '+1 к силе клика', basePrice: 10, priceMult: 1.5, effect: () => clickPower += 1 },
        { id: 'auto_clicker', name: 'Скайнет', desc: '+1 авто-клик в сек', basePrice: 50, priceMult: 1.8, effect: () => autoClickers += 1 }
    ];

    let upgradeLevels = { click_power: 0, auto_clicker: 0 };

    // --- ЗАГРУЗКА ---
    async function initGame() {
        if (!token) { showError(); return; }

        try {
            const res = await fetch(`${API_URL}/game/load/${GAME_ID}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401 || res.status === 403) { showError(); return; }
            
            const data = await res.json();
            
            people = data.people !== undefined ? data.people : 8000000000;
            shards = data.shards || 0;
            clickPower = data.clickPower || 1;
            autoClickers = data.autoClickers || 0;
            upgradeLevels = data.upgradeLevels || { click_power: 0, auto_clicker: 0 };
            
            // Восстанавливаем купленные улучшения при загрузке
            for (let i = 0; i < upgradeLevels.click_power; i++) clickPower += 1;
            for (let i = 0; i < upgradeLevels.auto_clicker; i++) autoClickers += 1;

            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            renderShop();
            updateUI();
            startAutoLoop();

        } catch (error) {
            showError("Ошибка соединения с сервером.");
        }
    }

    function showError(text) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        if (text) document.getElementById('error-msg').innerHTML += `<br><span style="font-size:12px; color:#aaa;">${text}</span>`;
        document.getElementById('btn-back').style.display = 'inline-block';
    }

    async function saveGameToServer() {
        if (!token) return;
        try {
            await fetch(`${API_URL}/game/save/${GAME_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ 
                    people: people, 
                    shards: shards, 
                    clickPower: clickPower, 
                    autoClickers: autoClickers,
                    upgradeLevels: upgradeLevels
                })
            });
        } catch (e) {}
    }

    // --- ЛОГИКА ИГРЫ ---
    function updateUI() {
        document.getElementById('people-count').innerText = Math.max(0, people).toLocaleString('ru-RU');
        document.getElementById('shards-count').innerText = shards.toLocaleString('ru-RU');
        
        // Обновляем кнопки в магазине
        UPGRADES.forEach(up => {
            const btn = document.getElementById('buy-btn-' + up.id);
            if (btn) {
                const price = Math.floor(up.basePrice * Math.pow(up.priceMult, upgradeLevels[up.id]));
                btn.innerText = `${price} 💎`;
                btn.disabled = shards < price;
            }
        });

        if (people <= 0) {
            document.getElementById('title').innerText = "МИР УНИЧТОЖЕН 💀";
            document.getElementById('doom-btn').style.display = 'none';
        }
    }

    function clickDoom() {
        if (people <= 0) return;

        // Простейший античит (не чаще 1 клика в 50мс)
        const now = Date.now();
        if (now - lastClickTime < 50) return; 
        lastClickTime = now;

        people -= clickPower;
        shards += 1;
        
        if (navigator.vibrate) navigator.vibrate(20);
        
        updateUI();
        saveGameToServer();
    }

    function startAutoLoop() {
        setInterval(() => {
            if (autoClickers > 0 && people > 0) {
                people -= autoClickers;
                shards += autoClickers;
                updateUI();
            }
        }, 1000);
        
        // Сохранение раз в 5 секунд, чтобы не спамить сервер
        setInterval(() => {
            if (people > 0 || shards > 0) saveGameToServer();
        }, 5000);
    }

    function renderShop() {
        const list = document.getElementById('shop-list');
        list.innerHTML = '';

        UPGRADES.forEach(up => {
            const price = Math.floor(up.basePrice * Math.pow(up.priceMult, upgradeLevels[up.id]));
            const el = document.createElement('div');
            el.className = 'upgrade-item';
            el.innerHTML = `
                <div class="upgrade-info">
                    <span class="upgrade-name">${up.name} (Ур. ${upgradeLevels[up.id]})</span>
                    <span class="upgrade-desc">${up.desc}</span>
                </div>
                <button class="btn-buy" id="buy-btn-${up.id}" onclick="buyUpgrade('${up.id}')">${price} 💎</button>
            `;
            list.appendChild(el);
        });
    }

    function buyUpgrade(id) {
        const up = UPGRADES.find(u => u.id === id);
        const price = Math.floor(up.basePrice * Math.pow(up.priceMult, upgradeLevels[id]));

        if (shards >= price) {
            shards -= price;
            upgradeLevels[id] += 1;
            up.effect(); // Применяем эффект
            
            updateUI();
            saveGameToServer();
        }
    }

    window.onload = initGame;
  </script>
</body>
</html>
