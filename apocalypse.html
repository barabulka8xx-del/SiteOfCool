<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кнопка Апокалипсиса 💣</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px 20px 15px;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .shake { animation: shake 0.1s infinite; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-2px, 0px) rotate(1deg); }
      50% { transform: translate(1px, -1px) rotate(-1deg); }
      75% { transform: translate(-2px, 1px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(1deg); }
    }

    /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    h1 {
      font-size: 20px;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .status {
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
      color: #00ff00;
      text-shadow: 0 0 10px currentColor;
      transition: color 0.3s;
    }

    .fragments {
      font-size: 18px;
      font-weight: bold;
      color: #00f2fe;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00f2fe;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #555;
      margin-bottom: 5px;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: #00ff00;
      transition: width 0.2s, background 0.2s;
    }

    /* --- ЦЕНТР --- */
    .center-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      z-index: 10;
      position: relative;
    }

    .apocalypse-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4b1f, #8b0000);
      border: 8px solid #333;
      box-shadow: 0 8px 0 #222, inset 0 -10px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
      color: white;
      text-shadow: 2px 2px 0px #000;
      transition: all 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .apocalypse-btn:active {
      transform: translateY(8px);
      box-shadow: 0 0 0 #222, inset 0 5px 20px rgba(0,0,0,0.8);
    }

    /* Предупреждение античита */
    .warning-text {
      position: absolute;
      top: -50px;
      color: #ff0055;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 0 0 10px #ff0055;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      text-align: center;
    }
    .warning-text.show { opacity: 1; animation: shake 0.2s infinite; }

    /* --- НИЖНЯЯ ПАНЕЛЬ --- */
    .bottom-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .people-counter {
      font-size: 24px;
      font-weight: 900;
      color: #ff0055;
      font-family: monospace;
      margin-bottom: 15px;
      text-align: center;
      text-shadow: 0 0 15px #ff0055;
    }

    .people-label {
      font-size: 12px;
      color: #aaa;
      display: block;
      margin-bottom: 5px;
      font-weight: normal;
      text-shadow: none;
    }

    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .action-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid #555;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      transition: 0.2s;
      font-size: 13px;
    }

    .action-btn:active { transform: scale(0.95); }
    .btn-stop { border-color: #ff0055; color: #ff0055; }
    .btn-shop { border-color: #ffeb3b; color: #ffeb3b; }

    /* --- МАГАЗИН --- */
    .shop-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .shop-modal.active { display: flex; }

    .shop-content {
      background: #222;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      border: 2px solid #444;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .shop-content h2 { text-align: center; color: #ffeb3b; margin-bottom: 5px; }

    .shop-item {
      background: #333;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #555;
    }

    .shop-item-info h3 { font-size: 15px; margin-bottom: 5px; }
    .shop-item-info p { font-size: 11px; color: #aaa; }

    .buy-btn {
      background: #00f2fe;
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .buy-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    .close-shop {
      background: #ff0055;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    /* --- КОНЕЦ --- */
    .end-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, #ff0000 0%, #330000 50%, #000000 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }
    .end-screen.active { display: flex; }
    .end-screen h2 { font-size: 50px; margin-bottom: 20px; color: #fff; animation: glitch 0.3s infinite; }
    .restart-btn {
      background: #fff; color: #000; border: none;
      padding: 15px 30px; font-size: 20px; font-weight: bold;
      border-radius: 10px; cursor: pointer;
    }

    .flying-obj {
      position: absolute; font-size: 40px; pointer-events: none; z-index: 5;
      animation: flyUp linear forwards;
    }
    @keyframes flyUp {
      0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1.5) rotate(360deg); opacity: 0; }
    }

    @keyframes glitch {
      0% { transform: translate(0); } 20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); } 60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); } 100% { transform: translate(0); }
    }

  </style>
</head>
<body id="body">

  <div class="top-bar">
    <h1>Кнопка Апокалипсиса</h1>
    <div class="status" id="status">Стабильность: 100%</div>
    <div class="fragments">Осколки: <span id="fragments-count">0</span> 💎</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="center-area">
    <div class="warning-text" id="warning-text">АНТИЧИТ: НЕ ТАПАЙ ТАК БЫСТРО!</div>
    <button class="apocalypse-btn" id="apoc-btn">ЖМИ</button>
  </div>

  <div class="bottom-bar">
    <div class="people-counter" id="people-counter">
      <span class="people-label">Осталось в живых:</span>
      8 000 000 000
    </div>

    <div class="actions">
      <button class="action-btn btn-stop" id="btn-stop">Вкл. Античит 🛡️</button>
      <button class="action-btn btn-shop" id="btn-shop">Магазин 🛒</button>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div class="shop-modal" id="shop-modal">
    <div class="shop-content">
      <h2>Улучшения 🛠️</h2>
      
      <div class="shop-item">
        <div class="shop-item-info">
          <h3>Усиление урона</h3>
          <p>+100к к урону (Ур. <span id="lvl-dmg">1</span>)</p>
        </div>
        <button class="buy-btn" id="buy-dmg">Цена: 1 💎</button>
      </div>

      <div class="shop-item">
        <div class="shop-item-info">
          <h3>Автокликер</h3>
          <p>+50к/сек (Ур. <span id="lvl-auto">0</span>)</p>
        </div>
        <button class="buy-btn" id="buy-auto">Цена: 3 💎</button>
      </div>

      <div class="shop-item">
        <div class="shop-item-info">
          <h3>Ускорение тапа</h3>
          <p>Снижает задержку (Ур. <span id="lvl-speed">0</span>)</p>
        </div>
        <button class="buy-btn" id="buy-speed">Цена: 5 💎</button>
      </div>

      <button class="close-shop" id="close-shop">Закрыть</button>
    </div>
  </div>

  <div class="end-screen" id="end-screen">
    <h2 class="glitch-text">💥 БУМ 💥</h2>
    <p style="font-size: 18px; margin-bottom: 30px;">Население земли полностью уничтожено.</p>
    <button class="restart-btn" id="restart-btn">НОВАЯ ЗЕМЛЯ</button>
  </div>

  <script>
    // --- НАСТРОЙКИ ---
    const MAX_PEOPLE = 8000000000;
    
    // --- СОСТОЯНИЕ ---
    let people = MAX_PEOPLE;
    let clickDamage = 100000;
    let autoDamage = 0;
    let levelDmg = 1;
    let levelAuto = 0;
    let levelSpeed = 0;
    
    let costDmg = 1;
    let costAuto = 3;
    let costSpeed = 5;
    
    let fragments = 0;
    let clickCounter = 0;
    
    // --- АНТИЧИТ ---
    let isAntiCheatActive = false;
    let lastClickTime = 0;
    let minClickInterval = 200; // Базовый интервал 200мс
    let isBanned = false;

    // --- СОХРАНЕНИЕ ---
    const savedData = localStorage.getItem('apocalypseSaveV4');
    if (savedData) {
      try {
        const data = JSON.parse(savedData);
        people = data.people !== undefined ? data.people : MAX_PEOPLE;
        clickDamage = data.clickDamage || 100000;
        autoDamage = data.autoDamage || 0;
        levelDmg = data.levelDmg || 1;
        levelAuto = data.levelAuto || 0;
        levelSpeed = data.levelSpeed || 0;
        costDmg = data.costDmg || 1;
        costAuto = data.costAuto || 3;
        costSpeed = data.costSpeed || 5;
        fragments = data.fragments || 0;
        clickCounter = data.clickCounter || 0;
        minClickInterval = Math.max(50, 200 - (levelSpeed * 30)); // Пересчет таймера
      } catch(e) { console.error("Ошибка загрузки"); }
    }

    // --- DOM ---
    const body = document.getElementById('body');
    const apocBtn = document.getElementById('apoc-btn');
    const statusEl = document.getElementById('status');
    const fragmentsEl = document.getElementById('fragments-count');
    const progressFill = document.getElementById('progress-fill');
    const peopleCounter = document.getElementById('people-counter');
    const shopModal = document.getElementById('shop-modal');
    const endScreen = document.getElementById('end-screen');
    const btnStop = document.getElementById('btn-stop');
    const warningText = document.getElementById('warning-text');
    
    const lvlDmgText = document.getElementById('lvl-dmg');
    const lvlAutoText = document.getElementById('lvl-auto');
    const lvlSpeedText = document.getElementById('lvl-speed');
    
    const buyDmgBtn = document.getElementById('buy-dmg');
    const buyAutoBtn = document.getElementById('buy-auto');
    const buySpeedBtn = document.getElementById('buy-speed');

    // --- ФУНКЦИИ ---
    function formatNumber(num) {
      return Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function saveGame() {
      const data = { people, clickDamage, autoDamage, levelDmg, levelAuto, levelSpeed, costDmg, costAuto, costSpeed, fragments, clickCounter };
      localStorage.setItem('apocalypseSaveV4', JSON.stringify(data));
    }

    function updateUI() {
      if (people < 0) people = 0;
      
      peopleCounter.innerHTML = `<span class="people-label">Осталось в живых:</span>${formatNumber(people)}`;
      fragmentsEl.textContent = fragments;
      
      let stability = (people / MAX_PEOPLE) * 100;
      statusEl.textContent = `Стабильность: ${stability.toFixed(2)}%`;
      progressFill.style.width = `${stability}%`;

      if (stability > 60) progressFill.style.background = '#00ff00';
      else if (stability > 30) progressFill.style.background = '#ff9800';
      else progressFill.style.background = '#ff0055';

      if (stability < 50) body.style.background = 'linear-gradient(45deg, #1a0000, #000)';
      if (stability < 20) body.style.background = 'linear-gradient(45deg, #330000, #000)';

      lvlDmgText.textContent = levelDmg;
      lvlAutoText.textContent = levelAuto;
      lvlSpeedText.textContent = levelSpeed;
      
      buyDmgBtn.textContent = `Цена: ${costDmg} 💎`;
      buyAutoBtn.textContent = `Цена: ${costAuto} 💎`;
      buySpeedBtn.textContent = `Цена: ${costSpeed} 💎`;
      
      buyDmgBtn.disabled = fragments < costDmg;
      buyAutoBtn.disabled = fragments < costAuto;
      buySpeedBtn.disabled = fragments < costSpeed;

      if (people <= 0 && !endScreen.classList.contains('active')) {
        endScreen.classList.add('active');
        apocBtn.style.display = 'none';
        localStorage.removeItem('apocalypseSaveV4'); 
      }
    }

    function spawnChaos() {
      const emojis = ['☄️', '💀', '🔥', '💥', '☠️'];
      const obj = document.createElement('div');
      obj.className = 'flying-obj';
      obj.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      obj.style.left = Math.random() * 90 + 'vw';
      obj.style.animationDuration = (Math.random() * 0.8 + 0.5) + 's';
      body.appendChild(obj);
      setTimeout(() => obj.remove(), 1300);
    }

    function dealDamage(amount) {
      if (people <= 0) return;
      people -= amount;
      
      body.classList.add('shake');
      setTimeout(() => body.classList.remove('shake'), 50);
      
      if (Math.random() > 0.6) spawnChaos();
      
      updateUI();
      saveGame();
    }

    // --- АНТИЧИТ ВКЛ/ВЫКЛ ---
    btnStop.addEventListener('click', () => {
      isAntiCheatActive = !isAntiCheatActive;
      if (isAntiCheatActive) {
        btnStop.textContent = "Античит ВКЛ 🛡️";
        btnStop.style.borderColor = "#00ff00";
        btnStop.style.color = "#00ff00";
      } else {
        btnStop.textContent = "Античит ВЫКЛ 🛡️";
        btnStop.style.borderColor = "#ff0055";
        btnStop.style.color = "#ff0055";
      }
    });

    // --- КЛИКИ ---
    apocBtn.addEventListener('click', () => {
      if (isBanned) return;

      if (isAntiCheatActive) {
        const now = Date.now();
        const timeDiff = now - lastClickTime;
        
        if (timeDiff < minClickInterval) { // Используем динамический интервал
          warningText.classList.add('show');
          
          isBanned = true;
          setTimeout(() => {
            isBanned = false;
            warningText.classList.remove('show');
          }, 1000);
          
          return;
        }
        lastClickTime = now;
      }

      dealDamage(clickDamage);
      
      clickCounter++;
      if (clickCounter >= 5) {
        fragments++;
        clickCounter = 0;
        updateUI();
        saveGame();
      }
    });

    // --- АВТОКЛИКЕР ---
    setInterval(() => {
      if (autoDamage > 0 && people > 0) {
        dealDamage(autoDamage);
      }
    }, 1000);

    // --- МАГАЗИН ---
    document.getElementById('btn-shop').addEventListener('click', () => shopModal.classList.add('active'));
    document.getElementById('close-shop').addEventListener('click', () => shopModal.classList.remove('active'));

    buyDmgBtn.addEventListener('click', () => {
      if (fragments >= costDmg) {
        fragments -= costDmg;
        clickDamage += 100000;
        levelDmg++;
        costDmg = Math.floor(costDmg * 1.5); 
        updateUI();
        saveGame();
      }
    });

    buyAutoBtn.addEventListener('click', () => {
      if (fragments >= costAuto) {
        fragments -= costAuto;
        autoDamage += 50000;
        levelAuto++;
        costAuto = Math.floor(costAuto * 1.5); 
        updateUI();
        saveGame();
      }
    });

    // ПОКУПКА УСКОРЕНИЯ ТАПА
    buySpeedBtn.addEventListener('click', () => {
      if (fragments >= costSpeed) {
        fragments -= costSpeed;
        levelSpeed++;
        
        // Уменьшаем интервал на 30мс, но не меньше 50мс
        minClickInterval = Math.max(50, minClickInterval - 30);
        
        costSpeed = Math.floor(costSpeed * 2); 
        updateUI();
        saveGame();
      }
    });

    // --- РЕСТАРТ ---
    document.getElementById('restart-btn').addEventListener('click', () => {
      localStorage.removeItem('apocalypseSaveV4');
      location.reload();
    });

    // Запуск
    updateUI();
  </script>
</body>
</html>
