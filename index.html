<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Лимонад-Миллионер</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #2b1055, #0b0018 60%);
      color: white;
      overflow: hidden;
      padding: 20px;
    }

    /* Экран загрузки/ошибки */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0018; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .loader { border: 4px solid #1a1a24; border-top: 4px solid #ffe066; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error-msg { color: #ff0055; font-size: 16px; font-weight: bold; display: none; margin-bottom: 15px; }
    .btn-back { background: #ff0055; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 14px; }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      z-index: 2;
      display: none;
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 36px); text-shadow: 0 0 15px rgba(255, 224, 102, 0.5); }
    .sub { margin: 0 0 15px; opacity: 0.75; font-size: 14px; }
    
    .total-box {
      background: rgba(0,0,0,0.4); border: 1px solid #ffe066; border-radius: 15px;
      padding: 10px; margin-bottom: 15px;
    }
    .total-label { font-size: 11px; color: #aaa; text-transform: uppercase; }
    .total-val { font-size: 20px; font-weight: bold; color: #ffe066; text-shadow: 0 0 10px rgba(255, 224, 102, 0.3); }

    .cocktail {
      min-height: 90px;
      display: grid;
      place-items: center;
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 800;
      line-height: 1.2;
      margin: 15px 0;
      padding: 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,0,150,0.12));
      border: 1px dashed rgba(255,255,255,0.25);
    }
    .price {
      font-size: 20px;
      font-weight: 700;
      color: #ffe066;
      margin-bottom: 22px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px 22px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      color: #1a0010;
      background: linear-gradient(135deg, #ffe066, #ff9f1c);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { transform: translateY(-2px) scale(1.01); filter: brightness(1.08); }
    button:active { transform: scale(0.98); }
    .hint { margin: 16px 0 0; font-size: 13px; opacity: 0.6; }
    .emoji {
      position: fixed;
      top: -50px;
      font-size: 32px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="loading-screen">
    <div class="loader" id="loader"></div>
    <div id="error-msg">
      ❌ Ошибка авторизации.<br>
      <span style="font-size:12px; color:#aaa; font-weight:normal;">Войдите в аккаунт в главном меню.</span>
    </div>
    <a href="menu.html" class="btn-back" id="btn-back" style="display:none;">В меню</a>
  </div>

  <!-- ИГРА -->
  <div class="card" id="main-app">
    <h1>Лимонад-Миллионер 🤑🍋</h1>
    <p class="sub">Смешай напиток, который пахнет деньгами</p>

    <div class="total-box">
      <div class="total-label">Общая сумма всех напитков</div>
      <div class="total-val" id="total-earned">0 ₽</div>
    </div>

    <div id="cocktail" class="cocktail">Нажми кнопку — и стань богаче</div>
    <div id="price" class="price">Цена: —</div>

    <button id="mix">Смешать 🍋</button>
    <p class="hint">Чем больше жмёшь, тем абсурднее цена.</p>
  </div>

  <script>
    const WORKER_URL = 'https://solitary-math-e969.potapivan1999.workers.dev';
    const WAIFLY_SERVER = 'http://node.waifly.com:27490/api'; 
    const API_URL = `${WORKER_URL}/?url=${WAIFLY_SERVER}`;
    const GAME_ID = 'drinks';

    let token = localStorage.getItem('auth_token');
    let totalEarned = 0; // Общая сумма всех напитков

    const cocktailEl = document.getElementById("cocktail");
    const priceEl = document.getElementById("price");
    const totalEl = document.getElementById("total-earned");
    const button = document.getElementById("mix");

    // --- БАЗА ИНГРЕДИЕНТОВ (БЕЗ АЛКОГОЛЯ) ---
    const bases = [
      "холодный эспрессо", "берёзовый сок", "кокосовая вода", 
      "слёзы инвестора", "настой на биткоинах", "зелёный чай матча",
      "свежевыжатый апельсин", "тайский чай", "молоко единорога"
    ];

    const mixers = [
      "тоник", "кола", "лаймовый сок", "кокосовое молоко",
      "жидкий золотой сироп", "пенка из маршмеллоу",
      "смузи из зелёных акций", "ледяной чай", "мятный туман"
    ];

    const toppings = [
      "веточка мяты", "золотая пыль", "кубик льда из Дубая",
      "съедобный бриллиант", "кружок лайма", "кредитная карта",
      "печенье с предсказанием курса валют", "попкорн из трюфелей"
    ];

    const names = [
      "Лимонад «Ипотека»", "Смузи «Стартап»", "Мохито «Крипто»",
      "Чай «Оффшор»", "Дайкири «Дивиденды»", "Космополитен «Налоговый вычет»",
      "Пина Колада «Пассивный доход»", "Апероль «Швейцарский счёт»",
      "Молочный коктейль «Кредитный рейтинг»", "Эспрессо-тоник «Юниты»"
    ];

    const emojis = ["🤑", "🍋", "💰", "💸", "🥤", "🥂", "💎", "🪙", "🍹"];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // --- ЗАГРУЗКА ---
    async function initGame() {
        if (!token) { showError(); return; }

        try {
            const res = await fetch(`${API_URL}/game/load/${GAME_ID}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401 || res.status === 403) { showError(); return; }
            
            const data = await res.json();
            totalEarned = data.totalEarned || 0;
            
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            updateTotalUI();
            button.addEventListener("click", makeCocktail);

        } catch (error) {
            showError("Ошибка соединения с сервером.");
        }
    }

    function showError(text) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        if (text) document.getElementById('error-msg').innerHTML += `<br><span style="font-size:12px; color:#aaa;">${text}</span>`;
        document.getElementById('btn-back').style.display = 'inline-block';
    }

    async function saveGameToServer() {
        if (!token) return;
        try {
            await fetch(`${API_URL}/game/save/${GAME_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ totalEarned: totalEarned })
            });
        } catch (e) {}
    }

    function updateTotalUI() {
        totalEl.textContent = new Intl.NumberFormat("ru-RU").format(totalEarned) + " ₽";
    }

    // --- ЛОГИКА ИГРЫ ---
    function rain() {
      const count = 15;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "emoji";
        el.textContent = pick(emojis);
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (2 + Math.random() * 2.5) + "s";
        el.style.animationDelay = Math.random() * 0.4 + "s";
        el.style.fontSize = (20 + Math.random() * 28) + "px";
        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }
    }

    function makeCocktail() {
      const name = pick(names);
      const base = pick(bases);
      const mixer = pick(mixers);
      const topping = pick(toppings);
      
      cocktailEl.textContent = `${name}: ${base} + ${mixer} + ${topping}`;
      
      // Генерируем цену
      const priceValue = Math.floor(Math.random() * 999_999_999) + 1000;
      priceEl.textContent = "Цена: " + new Intl.NumberFormat("ru-RU").format(priceValue) + " ₽";
      
      // Добавляем в общую сумму
      totalEarned += priceValue;
      updateTotalUI();
      
      // Сохраняем раз в кликов 10 (чтобы не спамить сервер), либо можно каждый раз
      if (Math.random() < 0.2) { // Сохраняем с шансом 20% на клик
          saveGameToServer();
      }
      
      rain();
    }

    // Сохраняем при выходе/закрытии
    window.addEventListener('beforeunload', saveGameToServer);

    window.onload = initGame;
  </script>
</body>
</html>
