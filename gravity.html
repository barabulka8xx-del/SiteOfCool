<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Гравитация</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }

    /* Экран загрузки */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .loader { border: 4px solid #1a1a24; border-top: 4px solid #4facfe; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error-msg { color: #ff0055; font-size: 16px; font-weight: bold; display: none; margin-bottom: 15px; }
    .btn-back { background: #ff0055; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 14px; }

    /* Интерфейс */
    #ui-top { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
    .score-box { background: rgba(15, 32, 39, 0.7); border: 1px solid #4facfe; padding: 8px 15px; border-radius: 15px; text-align: center; box-shadow: 0 0 15px rgba(79, 172, 254, 0.3); }
    .score-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
    .score-val { font-size: 20px; font-weight: bold; color: #4facfe; text-shadow: 0 0 10px rgba(79, 172, 254, 0.5); }

    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    canvas { width: 100%; height: 100%; display: block; }

    #hint { position: absolute; bottom: 30px; width: 100%; text-align: center; font-size: 12px; color: #888; z-index: 100; pointer-events: none; animation: pulseHint 2s infinite alternate; }
    @keyframes pulseHint { from { opacity: 0.5; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="loading-screen">
    <div class="loader" id="loader"></div>
    <div id="error-msg">
      ❌ Ошибка авторизации.<br>
      <span style="font-size:12px; color:#aaa; font-weight:normal;">Войдите в аккаунт в главном меню.</span>
    </div>
    <a href="menu.html" class="btn-back" id="btn-back" style="display:none;">В меню</a>
  </div>

  <!-- ИНТЕРФЕЙС -->
  <div id="ui-top">
    <div class="score-box">
      <div class="score-label">Счет</div>
      <div class="score-val" id="score-display">0</div>
    </div>
  </div>
  
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="hint">Тапай по экрану, чтобы создавать планеты 🌌</div>

  <script>
    const WORKER_URL = 'https://solitary-math-e969.potapivan1999.workers.dev';
    const WAIFLY_SERVER = 'http://node.waifly.com:27490/api'; 
    const API_URL = `${WORKER_URL}/?url=${WAIFLY_SERVER}`;
    const GAME_ID = 'gravity';

    let token = localStorage.getItem('auth_token');
    
    // Состояние игры
    let score = 0;
    let currentPlanetSize = 10; // Радиус новой планеты
    let planets = [];
    let particles = [];
    let animFrame = null;
    let lastTime = 0;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // Настройки физики
    const GRAVITY = 0.2; 
    const FRICTION = 0.995;
    const BOUNCE = 0.6;
    const MERGE_DIST = 5;

    const COLORS = ['#ff0055', '#4facfe', '#00ff00', '#ffd700', '#8E2DE2', '#ff8c00'];

    // --- ЗАГРУЗКА ---
    async function initGame() {
        if (!token) { showError(); return; }

        try {
            const res = await fetch(`${API_URL}/game/load/${GAME_ID}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401 || res.status === 403) { showError(); return; }
            
            const data = await res.json();
            score = data.score || 0;
            
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('score-display').innerText = score;
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Обработчик тапа (мышь и тач)
            canvas.addEventListener('pointerdown', handleTap);

            requestAnimationFrame(gameLoop);
            startAutoSave();

        } catch (error) {
            showError("Ошибка соединения с сервером.");
        }
    }

    function showError(text) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        if (text) document.getElementById('error-msg').innerHTML += `<br><span style="font-size:12px; color:#aaa;">${text}</span>`;
        document.getElementById('btn-back').style.display = 'inline-block';
    }

    async function saveGameToServer() {
        if (!token) return;
        try {
            await fetch(`${API_URL}/game/save/${GAME_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ score: score })
            });
        } catch (e) {}
    }

    function startAutoSave() {
        setInterval(() => {
            if (score > 0) saveGameToServer();
        }, 10000); // Сохраняем каждые 10 секунд
    }

    // --- ЛОГИКА ИГРЫ ---
    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    function handleTap(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Создаем новую планету
        planets.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            radius: currentPlanetSize,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            merged: false
        });

        // Эффект вспышки
        createExplosion(x, y, 10, '#ffffff');
    }

    function createExplosion(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function gameLoop(timestamp) {
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        update();
        draw();

        animFrame = requestAnimationFrame(gameLoop);
    }

    function update() {
        // Обновляем планеты
        for (let i = 0; i < planets.length; i++) {
            let p = planets[i];
            
            // Притяжение к центру
            const dx = width / 2 - p.x;
            const dy = height / 2 - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 10) {
                p.vx += (dx / dist) * GRAVITY;
                p.vy += (dy / dist) * GRAVITY;
            }

            p.vx *= FRICTION;
            p.vy *= FRICTION;
            p.x += p.vx;
            p.y += p.vy;

            // Границы
            if (p.x - p.radius < 0) { p.x = p.radius; p.vx *= -BOUNCE; }
            if (p.x + p.radius > width) { p.x = width - p.radius; p.vx *= -BOUNCE; }
            if (p.y - p.radius < 0) { p.y = p.radius; p.vy *= -BOUNCE; }
            if (p.y + p.radius > height) { p.y = height - p.radius; p.vy *= -BOUNCE; }
        }

        // Обработка столкновений (Слияние)
        for (let i = 0; i < planets.length; i++) {
            for (let j = i + 1; j < planets.length; j++) {
                let p1 = planets[i];
                let p2 = planets[j];

                if (p1.merged || p2.merged) continue;

                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < p1.radius + p2.radius - MERGE_DIST) {
                    // Слияние
                    p1.merged = true;
                    p2.merged = true;

                    const newRadius = Math.sqrt(p1.radius * p1.radius + p2.radius * p2.radius);
                    const newX = (p1.x + p2.x) / 2;
                    const newY = (p1.y + p2.y) / 2;

                    planets.push({
                        x: newX, y: newY,
                        vx: (p1.vx + p2.vx) / 2,
                        vy: (p1.vy + p2.vy) / 2,
                        radius: newRadius,
                        color: p1.color,
                        merged: false
                    });

                    // Награда за слияние
                    score += Math.floor(newRadius);
                    document.getElementById('score-display').innerText = score;
                    createExplosion(newX, newY, 20, p1.color);
                }
            }
        }

        // Очистка слитых планет
        planets = planets.filter(p => !p.merged);

        // Обновление частиц
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vx *= 0.95;
            pt.vy *= 0.95;
            pt.life -= 0.02;
            if (pt.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Очистка с легким шлейфом
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);

        // Рисуем планеты
        planets.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0; // Сброс для других элементов
        });

        // Рисуем частицы
        particles.forEach(pt => {
            ctx.globalAlpha = pt.life;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
            ctx.fillStyle = pt.color;
            ctx.fill();
            ctx.globalAlpha = 1;
        });
    }

    // Запуск при загрузке
    window.onload = initGame;
  </script>
</body>
</html>
