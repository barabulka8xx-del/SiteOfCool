<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Гравитационная Песочница 🌌</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      background-color: #050510;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; /* Скрываем скролл, игра на весь экран */
      height: 100vh;
      width: 100vw;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    /* Интерфейс поверх игры */
    .ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: none; /* Чтобы клики проходили сквозь пустое место */
    }

    .ui > * {
      pointer-events: auto; /* Кнопки должны нажиматься */
    }

    h1 {
      font-size: 20px;
      text-shadow: 0 0 10px #00f2fe;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 12px;
      color: #aaa;
      max-width: 250px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .btn-reset {
      background: rgba(255, 0, 85, 0.2);
      color: #fff;
      border: 1px solid #ff0055;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.2s;
      width: fit-content;
    }

    .btn-reset:active {
      background: #ff0055;
      transform: scale(0.95);
    }

    /* Панель выбора цвета */
    .color-picker {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .color-dot {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid transparent;
    }
    
    .color-dot.active {
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 0 15px currentColor;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h1>🌌 Гравитация</h1>
    <div class="subtitle">Тапай по экрану, чтобы создавать планеты. Они будут притягиваться друг к другу.</div>
    <button class="btn-reset" id="btn-reset">Сбросить всё 💥</button>
  </div>

  <div class="color-picker">
    <div class="color-dot active" style="background: #4facfe; color: #4facfe;" data-color="#4facfe"></div>
    <div class="color-dot" style="background: #ff0055; color: #ff0055;" data-color="#ff0055"></div>
    <div class="color-dot" style="background: #55ff55; color: #55ff55;" data-color="#55ff55"></div>
    <div class="color-dot" style="background: #ffeb3b; color: #ffeb3b;" data-color="#ffeb3b"></div>
    <div class="color-dot" style="background: #9d4edd; color: #9d4edd;" data-color="#9d4edd"></div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btnReset = document.getElementById('btn-reset');
    const colorDots = document.querySelectorAll('.color-dot');

    let width, height;
    let planets = [];
    let currentColor = '#4facfe';

    // Настройки физики
    const G = 0.5; // Гравитационная постоянная
    const MAX_PLANETS = 40; // Ограничение, чтобы не завис телефон
    const MIN_RADIUS = 5;
    const MAX_RADIUS = 20;

    // Изменение размера холста
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Выбор цвета
    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        colorDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.dataset.color;
      });
    });

    // Класс Планеты
    class Planet {
      constructor(x, y, color, isBlackHole = false) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2; // Начальная скорость по X
        this.vy = (Math.random() - 0.5) * 2; // Начальная скорость по Y
        this.color = color;
        this.isBlackHole = isBlackHole;
        
        // Если это черная дыра - она огромная
        if (isBlackHole) {
          this.r = 40;
          this.mass = 500; // Огромная масса
          this.color = '#000';
        } else {
          this.r = Math.random() * (MAX_RADIUS - MIN_RADIUS) + MIN_RADIUS;
          this.mass = this.r * this.r; // Масса зависит от размера
        }
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        
        if (this.isBlackHole) {
          // Отрисовка черной дыры с аккреционным диском
          const gradient = ctx.createRadialGradient(this.x, this.y, this.r * 0.5, this.x, this.y, this.r * 1.5);
          gradient.addColorStop(0, '#000');
          gradient.addColorStop(0.7, '#8a2be2');
          gradient.addColorStop(1, 'transparent');
          ctx.fillStyle = gradient;
          ctx.arc(this.x, this.y, this.r * 1.5, 0, Math.PI * 2);
        } else {
          // Обычная планета с бликом
          const gradient = ctx.createRadialGradient(this.x - this.r/3, this.y - this.r/3, this.r/10, this.x, this.y, this.r);
          gradient.addColorStop(0, '#fff');
          gradient.addColorStop(0.3, this.color);
          gradient.addColorStop(1, 'rgba(0,0,0,0.8)');
          ctx.fillStyle = gradient;
        }
        
        ctx.fill();
      }

      update() {
        // Движение по инерции
        this.x += this.vx;
        this.y += this.vy;

        // Отскок от стенок экрана
        if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.8; }
        if (this.x + this.r > width) { this.x = width - this.r; this.vx *= -0.8; }
        if (this.y - this.r < 0) { this.y = this.r; this.vy *= -0.8; }
        if (this.y + this.r > height) { this.y = height - this.r; this.vy *= -0.8; }
      }
    }

    // Добавление планеты по клику
    canvas.addEventListener('pointerdown', (e) => {
      if (planets.length >= MAX_PLANETS) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      planets.push(new Planet(x, y, currentColor));
    });

    // Сброс
    btnReset.addEventListener('click', () => {
      planets = [];
      // Создаем пару планет для старта
      planets.push(new Planet(width / 2 - 100, height / 2, '#4facfe'));
      planets.push(new Planet(width / 2 + 100, height / 2, '#ff0055'));
    });

    // Начальные планеты
    planets.push(new Planet(width / 2 - 100, height / 2, '#4facfe'));
    planets.push(new Planet(width / 2 + 100, height / 2, '#ff0055'));

    // Главный цикл анимации
    function animate() {
      // Очистка экрана с небольшим шлейфом (эффект движения)
      ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
      ctx.fillRect(0, 0, width, height);

      // 1. Расчет гравитации
      for (let i = 0; i < planets.length; i++) {
        for (let j = i + 1; j < planets.length; j++) {
          const p1 = planets[i];
          const p2 = planets[j];

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          // Если планеты столкнулись (слияние)
          if (distance < p1.r + p2.r) {
            // Планета с большей массой поглощает меньшую
            const bigger = p1.mass > p2.mass ? p1 : p2;
            const smaller = p1.mass > p2.mass ? p2 : p1;
            
            bigger.mass += smaller.mass;
            bigger.r = Math.sqrt(bigger.mass); // Радиус увеличивается
            
            // Удаляем меньшую планету
            planets.splice(planets.indexOf(smaller), 1);
            i--; // Корректируем индекс, так как массив уменьшился
            break; 
          }

          // Если не столкнулись, но находимся близко - притягиваемся
          if (distance > 0) {
            const force = (G * p1.mass * p2.mass) / (distance * distance);
            const ax = (dx / distance) * force / p1.mass;
            const ay = (dy / distance) * force / p1.mass;
            const bx = (dx / distance) * force / p2.mass;
            const by = (dy / distance) * force / p2.mass;

            p1.vx += ax;
            p1.vy += ay;
            p2.vx -= bx;
            p2.vy -= by;
          }
        }
      }

      // 2. Обновление и отрисовка
      planets.forEach(p => {
        // Ограничиваем скорость, чтобы не улетали за экран
        p.vx = Math.max(-5, Math.min(5, p.vx));
        p.vy = Math.max(-5, Math.min(5, p.vy));
        
        p.update();
        p.draw(ctx);

        // Превращение в черную дыру, если планета стала слишком огромной
        if (p.mass > 3000 && !p.isBlackHole) {
          p.isBlackHole = true;
          p.color = '#000';
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
