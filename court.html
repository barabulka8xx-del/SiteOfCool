<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Мемный Суд</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #080c14;
      background-image: 
        linear-gradient(rgba(79, 172, 254, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 172, 254, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      color: white;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 1000px;
    }

    /* Затемнение по краям */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* --- ШАПКА --- */
    .top-bar {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    
    .header-title {
      font-size: 16px;
      font-weight: bold;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .coins {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #ffd700;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* --- СЦЕНА СУДА --- */
    .courtroom {
      flex: 1;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding-bottom: 20px;
      z-index: 2;
    }

    .spotlight {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Публика на фоне */
    .audience {
      position: absolute;
      top: 18%;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      filter: blur(2px) brightness(0.6);
    }
    
    .audience-row {
      display: flex;
      justify-content: space-around;
      font-size: 35px;
    }
    .audience-row:nth-child(2) { font-size: 30px; opacity: 0.7; }

    /* --- ПОДСУДИМЫЙ --- */
    .defendant-area {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      position: relative;
    }

    .defendant-avatar {
      width: 100px;
      height: 100px;
      background: #151b22;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      border: 3px solid #ff0055;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
      position: relative;
      z-index: 2;
      transition: filter 0.3s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* --- СТОЛ СУДЬИ (2.5D) --- */
    .desk-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-top: 10px;
      transform-style: preserve-3d;
      z-index: 5;
    }

    .desk-top {
      width: 330px;
      height: 130px;
      background: linear-gradient(135deg, #3a2518 0%, #1a110c 100%);
      border: 4px solid #5a3a22;
      border-radius: 10px;
      transform: rotateX(45deg);
      box-shadow: 0 20px 0 #110a07, 0 40px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gavel-container {
      transform: rotateX(-45deg) translateY(-20px);
      cursor: pointer;
      transition: 0.1s;
      position: relative;
      z-index: 5;
    }

    .gavel {
      font-size: 60px;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.8));
      transition: 0.1s;
      transform-origin: bottom left;
    }

    /* Анимация удара молотком */
    .gavel-container.strike .gavel {
      animation: hitGavel 0.3s ease-in-out;
    }

    @keyframes hitGavel {
      0% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-45deg) translateY(-20px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    /* Эффект вибрации стола */
    .desk-top.shake {
      animation: deskShake 0.3s ease-in-out;
    }
    @keyframes deskShake {
      0%, 100% { transform: rotateX(45deg) translateX(0); }
      25% { transform: rotateX(45deg) translateX(-5px); }
      75% { transform: rotateX(45deg) translateX(5px); }
    }

    /* --- ПАПКА С ДЕЛОМ НА СТОЛЕ --- */
    .folder {
      position: absolute;
      width: 140px;
      height: 90px;
      background: #d4a373;
      border-radius: 4px 8px 8px 8px;
      transform: rotateX(-45deg) translateZ(5px) translateY(10px) rotateZ(-5deg);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      padding: 10px 8px;
      left: 20px;
      border: 1px solid #b5835a;
    }
    
    .folder::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 0;
      width: 50px;
      height: 15px;
      background: #d4a373;
      border-radius: 5px 5px 0 0;
      border: 1px solid #b5835a;
      border-bottom: none;
    }

    .crime-title {
      color: #cc0000;
      font-size: 10px;
      font-weight: 900;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
      word-break: break-word;
    }

    .crime-desc {
      font-size: 9px;
      color: #222;
      line-height: 1.1;
      text-align: center;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* --- КНОПКИ ПРИГОВОРА --- */
    .verdicts {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 350px;
      margin-top: 20px;
      padding: 0 10px;
      z-index: 10;
      transition: 0.3s;
    }

    .verdicts.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    .btn-verdict {
      flex: 1;
      padding: 15px 5px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .btn-verdict:active { transform: scale(0.95); }

    .btn-innocent { background: linear-gradient(135deg, #00b09b, #96c93d); }
    .btn-guilty { background: linear-gradient(135deg, #cb2d3e, #ef473a); }
    .btn-space { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }

    /* --- ЛОГ/РЕАКЦИЯ --- */
    .reaction-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #ffeb3b;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffeb3b;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      width: 85%;
      max-width: 300px;
      box-shadow: 0 0 40px rgba(255, 235, 59, 0.4);
    }

    .reaction-text.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Всплывающие монеты */
    .floating-coin {
      position: absolute;
      color: #ffd700;
      font-weight: bold;
      font-size: 24px;
      pointer-events: none;
      animation: floatCoin 1s ease-out forwards;
      z-index: 100;
      text-shadow: 0 0 10px #000;
    }

    @keyframes floatCoin {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }

    /* --- НОВЫЕ АНИМАЦИИ ПРИГОВОРОВ --- */
    
    /* 1. В Космос (Ракета) */
    .rocket-anim {
      position: absolute;
      font-size: 50px;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      z-index: 1;
    }
    .launch-anim {
      animation: launchToSpace 1.5s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
    }
    @keyframes launchToSpace {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
      20% { transform: translate(-50%, 0) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -800px) scale(0.5) rotate(10deg); opacity: 0; }
    }
    .rocket-show { opacity: 1; transition: 0.2s; }

    /* 2. Виновен (Полицейский уводит) */
    .police-anim {
      position: absolute;
      font-size: 50px;
      bottom: 10px;
      right: -100px;
      z-index: 3;
      transition: 0.4s ease-out;
    }
    .police-show { right: -40px; }
    
    .arrest-anim {
      animation: arrested 1.5s forwards ease-in-out;
    }
    @keyframes arrested {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      20% { transform: translate(-10px, 0) scale(1); opacity: 1; } /* Коп хватает */
      100% { transform: translate(250px, 0) scale(0.8); opacity: 0; } /* Уводят */
    }

    /* 3. Оправдать (Исчезновение) */
    .fade-out {
      animation: fadeAway 1s forwards;
    }
    @keyframes fadeAway {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      100% { transform: scale(0.8); opacity: 0; filter: blur(10px); }
    }

  </style>
</head>
<body>

  <div class="top-bar">
    <div class="header-title">Мемный Суд ⚖️</div>
    <div class="coins" id="coin-display">🪙 0</div>
  </div>

  <div class="courtroom">
    <div class="spotlight"></div>

    <!-- Публика -->
    <div class="audience">
      <div class="audience-row">
        <span>👨‍💼</span><span>👩‍⚖️</span><span>🐸</span><span>🧑‍💼</span><span>🦆</span>
      </div>
      <div class="audience-row">
        <span>👽</span><span>🐱</span><span>💩</span><span>🐕</span><span>🗿</span>
      </div>
    </div>

    <div class="defendant-area" id="defendant-area">
      <!-- Место для полицейского -->
      <div class="police-anim" id="police">👮‍♂️</div>
      
      <!-- Место для ракеты -->
      <div class="rocket-anim" id="rocket">🚀</div>
      
      <div class="defendant-avatar" id="defendant-emoji">🐸</div>
    </div>

    <div class="desk-wrapper">
      <div class="desk-top" id="desk">
        <!-- Раскрытая папка с делом -->
        <div class="folder">
          <div class="crime-title" id="crime-title">Дело №1</div>
          <div class="crime-desc" id="crime-desc">Загрузка дела...</div>
        </div>

        <div class="gavel-container" id="gavel-btn">
          <div class="gavel">🔨</div>
        </div>
      </div>
    </div>

    <div class="verdicts" id="verdicts">
      <button class="btn-verdict btn-innocent" onclick="giveVerdict('innocent')">
        <span>🕊️</span> Оправдать
      </button>
      <button class="btn-verdict btn-guilty" onclick="giveVerdict('guilty')">
        <span>⛓️</span> Виновен
      </button>
      <button class="btn-verdict btn-space" onclick="giveVerdict('space')">
        <span>🚀</span> В космос
      </button>
    </div>

    <div class="reaction-text" id="reaction-text">Текст приговора</div>
  </div>

  <script>
    const DEFENDANTS = [
      '🐸', '🐱', '🐕', '🧠', '💩', '🗿', '👽', '🦆', '🤖', '🐷', 
      '🦄', '🐔', '🐙', '🦖', '🐻', '🐼', '🐀', '🐒', '🦥', '🦦'
    ];
    
    const CRIMES = [
      { title: "Кража века", desc: "Украл луну и продал на Avito за 3 рубля." },
      { title: "Нарушение порядка", desc: "Слишком громко молчал в библиотеке." },
      { title: "Код-преступление", desc: "Написал идеальный сайт на Python." },
      { title: "Мемный терроризм", desc: "Засорил общий чат баянами в 3 часа ночи." },
      { title: "Оскорбление чувств", desc: "Заявил, что Скала (🗿) не имба." },
      { title: "Кибербуллинг", desc: "Обозвал квадратного кота круглым." },
      { title: "Мошенничество", desc: "Уклонялся от налогов, притворяясь пакетом." },
      { title: "Вандализм", desc: "Съел последний кусок пиццы и не поделился." },
      { title: "Шпионаж", desc: "Подглядывал в бинокль из туалетной бумаги." },
      { title: "Госизмена", desc: "Сказал, что Roblox лучше Minecraft." },
      { title: "Незаконный стиль", desc: "Носил шляпу не по уставу." },
      { title: "Газлайтинг", desc: "Убеждал всех, что трава синяя." },
      { title: "Читерство", desc: "Включил X-Ray в Майнкрафте." },
      { title: "Разжигание споров", desc: "Сказал, что фри с майонезом лучше." },
      { title: "Громкий смех", desc: "Смеялся с баяна 2012 года в автобусе." },
      { title: "Пиратство", desc: "Раздавал торрент со скоростью 0.5 кб/с." },
      { title: "Ересь", desc: "Публично заявил, что Шрек — не смешно." },
      { title: "Нарушение сна", desc: "Звонил в 4 утра с просьбой кинуть 100р." },
      { title: "Утечка данных", desc: "Слил секретный рецепт соуса из бургерной." }
    ];

    const REACTIONS = {
      innocent: [
        "Оправдан! Отпущен с миром. (+10 🪙)",
        "Невиновен! Поверили честным глазам. (+10 🪙)",
        "Оправдан! Слишком милый для тюрьмы. (+10 🪙)"
      ],
      guilty: [
        "Виновен! В мемную тюрьму на 100 лет. (+20 🪙)",
        "Строгий режим и грустные мемы. (+20 🪙)",
        "Виновен! Будет чистить базы данных. (+20 🪙)"
      ],
      space: [
        "В КОСМОС! Выслан на орбиту. (+35 🪙)",
        "В КОСМОС! Пусть ищет черные дыры. (+35 🪙)",
        "В КОСМОС! Без скафандра. (+35 🪙)"
      ]
    };

    let coins = 0;
    let currentCrime = null;
    let canVerdict = true;

    // Элементы
    const elAvatar = document.getElementById('defendant-emoji');
    const elRocket = document.getElementById('rocket');
    const elPolice = document.getElementById('police');
    const elGavel = document.getElementById('gavel-btn');
    const elDesk = document.getElementById('desk');

    function loadGame() {
      const saved = localStorage.getItem('MEME_COURT_SAVE');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          coins = data.coins || 0;
          updateCoinsUI();
        } catch(e) {}
      }
    }

    function saveGame() {
      localStorage.setItem('MEME_COURT_SAVE', JSON.stringify({ coins: coins }));
    }

    function updateCoinsUI() {
      document.getElementById('coin-display').innerText = `🪙 ${coins.toLocaleString('ru-RU')}`;
    }

    function nextCase() {
      // Сбрасываем все анимации и элементы
      elAvatar.className = 'defendant-avatar';
      elAvatar.innerText = '🐸';
      elAvatar.style.filter = '';
      
      elRocket.className = 'rocket-anim';
      elRocket.innerText = '🚀';
      
      elPolice.className = 'police-anim';
      elPolice.innerText = '👮‍♂️';

      document.getElementById('reaction-text').classList.remove('show');
      
      // Рандомим
      const randomDefendant = DEFENDANTS[Math.floor(Math.random() * DEFENDANTS.length)];
      currentCrime = CRIMES[Math.floor(Math.random() * CRIMES.length)];
      
      elAvatar.innerText = randomDefendant;
      
      document.getElementById('crime-title').innerText = currentCrime.title;
      document.getElementById('crime-desc').innerText = currentCrime.desc;

      canVerdict = true;
    }

    // Функция удара молотком
    function strikeGavel(callback) {
      elGavel.classList.add('strike');
      elDesk.classList.add('shake');
      
      setTimeout(() => {
        elGavel.classList.remove('strike');
        elDesk.classList.remove('shake');
        if (callback) callback(); // Вызываем коллбэк после удара
      }, 300);
    }

    function giveVerdict(type) {
      if (!canVerdict) return; 
      canVerdict = false;

      // Сначала бьем молотком, потом запускаем анимацию
      strikeGavel(() => {
        playVerdictAnimation(type);
      });

      // Начисляем монеты
      let reward = 0;
      if (type === 'innocent') reward = 10;
      if (type === 'guilty') reward = 20;
      if (type === 'space') reward = 35;
      
      coins += reward;
      updateCoinsUI();
      saveGame();
      showFloatingCoin(reward);

      // Показываем текст реакции
      const reactionBox = document.getElementById('reaction-text');
      const reactionsList = REACTIONS[type];
      reactionBox.innerText = reactionsList[Math.floor(Math.random() * reactionsList.length)];
      
      setTimeout(() => {
        reactionBox.classList.add('show');
      }, 400); // Чуть позже удара молотка
    }

    function playVerdictAnimation(type) {
      if (type === 'space') {
        // 1. КОСМОС: Ракета выезжает, подсудимый садится и улетает
        elRocket.classList.add('rocket-show');
        setTimeout(() => {
          elAvatar.classList.add('launch-anim');
        }, 200);
        
      } else if (type === 'guilty') {
        // 2. ВИНОВЕН: Полицейский выбегает и уводит
        elPolice.classList.add('police-show');
        setTimeout(() => {
          elAvatar.classList.add('arrest-anim');
          setTimeout(() => { elPolice.style.opacity = '0'; }, 800);
        }, 300);

      } else if (type === 'innocent') {
        // 3. ОПРАВДАТЬ: Просто исчезает (растворяется)
        elAvatar.classList.add('fade-out');
      }

      // Через 2.5 секунды загружаем новое дело
      setTimeout(() => {
        nextCase();
      }, 2800);
    }

    function showFloatingCoin(amount) {
      const coin = document.createElement('div');
      coin.className = 'floating-coin';
      coin.innerText = `+${amount} 🪙`;
      
      const rect = document.getElementById('coin-display').getBoundingClientRect();
      coin.style.left = rect.left + 'px';
      coin.style.top = (rect.top + 30) + 'px';
      
      document.body.appendChild(coin);
      
      setTimeout(() => coin.remove(), 1000);
    }

    // Позволяем бить молотком просто так (по клику)
    elGavel.onclick = () => {
      if (canVerdict) strikeGavel();
    };

    window.onload = () => {
      loadGame();
      nextCase();
    };
  </script>
</body>
</html>
