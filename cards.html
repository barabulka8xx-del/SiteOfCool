<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва Мемов 2.5D 🃏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050505;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      perspective-origin: 50% 40%;
    }

    /* МЕНЮ */
    #menu {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1a1a24 0%, #000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #menu h1 { font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0055; color: #fff; }
    #menu p { color: #aaa; margin-bottom: 30px; font-size: 14px; }
    .menu-btn {
      background: rgba(255,255,255,0.05); border: 2px solid #4facfe; color: white;
      padding: 15px 30px; margin: 10px; border-radius: 12px; font-size: 18px; font-weight: bold;
      cursor: pointer; width: 250px; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .menu-btn:hover { background: #4facfe; color: #000; box-shadow: 0 0 20px #4facfe; transform: scale(1.05); }

    /* ИГРА */
    #game-container {
      width: 100vw; height: 100vh;
      display: none; 
      position: relative;
      transform-style: preserve-3d;
    }

    /* ЛАМПА */
    .lamp-container {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%) translateZ(100px);
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .lamp-wire { width: 4px; height: 50px; background: #222; }
    .lamp-shade { width: 80px; height: 40px; background: #111; border-radius: 40px 40px 0 0; border: 2px solid #333; border-bottom: none; }
    .lamp-bulb { width: 25px; height: 12px; background: #ffeb3b; border-radius: 50%; box-shadow: 0 0 40px #ffeb3b, 0 0 120px #ffeb3b; margin-top: -6px; }

    /* СТОЛ (Исправлен наклон) */
    .table-container {
      position: absolute; top: 45%; left: 50%;
      transform: translate(-50%, -50%) rotateX(40deg); /* Уменьшили наклон, чтобы стол не уезжал */
      transform-style: preserve-3d;
      z-index: 2;
    }
    
    .table-side {
      position: absolute; top: 0; left: 0;
      width: 280px; height: 280px;
      background: #0a0f12;
      border-radius: 50%;
      transform: translateZ(-30px);
      box-shadow: 0 30px 40px rgba(0,0,0,0.9);
    }
    
    .table-top {
      position: absolute; top: 0; left: 0;
      width: 280px; height: 280px;
      background: radial-gradient(circle, #2a3b42 0%, #111 80%);
      border-radius: 50%; 
      box-shadow: inset 0 0 30px #000;
      border: 4px solid #3a5060; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transform-style: preserve-3d;
    }
    
    .table-text {
      position: absolute; top: 15%;
      transform: rotateX(-40deg) translateZ(20px); 
      font-size: 16px; font-weight: bold; color: rgba(255,255,255,0.4);
      text-align: center; pointer-events: none; width: 200px; line-height: 1.4;
      text-shadow: 0 5px 10px #000;
    }

    /* Колода в центре стола */
    .center-deck {
      position: absolute;
      width: 45px; height: 65px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border: 2px solid #4facfe; border-radius: 6px;
      transform: rotateX(-40deg) translateZ(5px);
      box-shadow: 2px 2px 0 #111, 4px 4px 0 #111, 6px 6px 0 #111, 8px 8px 10px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; opacity: 0.9;
    }

    /* Зона скинутых карт */
    .played-cards-area {
      position: absolute;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* Анимированная скинутая карта */
    .played-card-anim {
      position: absolute;
      width: 55px; height: 80px;
      background: #203a43; border: 2px solid #4facfe; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
      transform: rotateX(-40deg) translateZ(30px) scale(0.5);
      opacity: 0;
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      animation: dropAndStay 2.5s forwards;
    }
    
    @keyframes dropAndStay {
      0% { transform: rotateX(-40deg) translateZ(150px) scale(1.5) rotate(-20deg); opacity: 0; }
      20% { transform: rotateX(-40deg) translateZ(30px) scale(1) rotate(0deg); opacity: 1; }
      80% { transform: rotateX(-40deg) translateZ(30px) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: rotateX(-40deg) translateZ(0px) scale(0.8) rotate(0deg); opacity: 0; }
    }

    /* ИГРОКИ */
    .seat {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      z-index: 5; transition: 0.3s; transform-style: preserve-3d;
    }
    
    .seat-top { top: 8%; left: 50%; transform: translateX(-50%) translateZ(-20px) scale(0.8); }
    .seat-left { top: 35%; left: 10%; transform: translateY(-50%) translateZ(0) scale(0.9); }
    .seat-right { top: 35%; right: 10%; transform: translateY(-50%) translateZ(0) scale(0.9); }
    /* Игрок теперь ровно под столом */
    .seat-bottom { bottom: 140px; left: 50%; transform: translateX(-50%) translateZ(80px) scale(1); }

    .avatar-box {
      position: relative; width: 65px; height: 65px;
      background: #1a2a33; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; border: 3px solid #4facfe;
      box-shadow: 0 10px 20px rgba(0,0,0,0.9), 0 0 20px rgba(79, 172, 254, 0.5); 
      margin-bottom: 5px; transition: 0.3s;
      transform: translateZ(40px); 
    }
    .avatar-box.enemy { border-color: #ff0055; box-shadow: 0 10px 20px rgba(0,0,0,0.9), 0 0 20px rgba(255, 0, 85, 0.5); }
    
    .avatar-box.stunned { filter: grayscale(1) brightness(0.5); border-color: #888; }
    .avatar-box.stunned::after { content: '💫'; position: absolute; top: -15px; font-size: 22px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .avatar-box.dead { opacity: 0.3; filter: grayscale(1); border-color: #000; }
    .avatar-box.dead::before { content: '💀'; position: absolute; font-size: 36px; z-index: 2; }

    .hp-bar-container {
      width: 70px; height: 14px; background: #111; border-radius: 7px;
      overflow: hidden; border: 2px solid #000; position: relative;
      box-shadow: 0 5px 10px rgba(0,0,0,0.8);
      transform: translateZ(20px);
    }
    .hp-fill { height: 100%; width: 100%; background: #00ff00; transition: width 0.3s, background 0.3s; }
    .hp-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

    .bot-deck {
      display: flex; margin-top: 5px; position: relative; height: 20px; width: 50px; justify-content: center;
      transform: translateZ(10px);
    }
    .bot-card {
      position: absolute;
      width: 16px; height: 24px;
      background: linear-gradient(135deg, #8b0000, #ff0055);
      border: 1px solid #fff; border-radius: 3px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.9);
    }
    .bot-card:nth-child(1) { transform: rotate(-15deg) translateX(-10px); }
    .bot-card:nth-child(2) { transform: rotate(-5deg) translateX(-3px); }
    .bot-card:nth-child(3) { transform: rotate(5deg) translateX(3px); }
    .bot-card:nth-child(4) { transform: rotate(15deg) translateX(10px); }

    /* ПАНЕЛЬ ОПИСАНИЯ */
    .card-info-panel {
      position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%) translateZ(80px);
      width: 90%; max-width: 320px;
      background: rgba(15, 25, 35, 0.95); border: 2px solid #ffeb3b;
      border-radius: 12px; padding: 10px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      opacity: 0; pointer-events: none; transition: 0.3s;
      z-index: 30;
    }
    .card-info-panel.active { opacity: 1; transform: translateX(-50%) translateY(-10px) translateZ(80px); }
    
    .info-title { color: #ffeb3b; font-size: 15px; font-weight: bold; margin-bottom: 3px; }
    .info-desc { color: #fff; font-size: 12px; line-height: 1.3; }
    .info-hint { color: #4facfe; font-size: 10px; margin-top: 5px; font-style: italic;}

    /* ТВОИ КАРТЫ */
    .player-hand {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%) translateZ(100px);
      display: flex; gap: 5px; z-index: 20; 
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    
    .card {
      width: 75px; height: 110px;
      background: rgba(30, 45, 55, 0.95); backdrop-filter: blur(10px);
      border: 2px solid #4facfe; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(79, 172, 254, 0.3);
      transition: 0.2s; position: relative;
      transform-origin: bottom center;
    }
    
    .card:nth-child(1) { transform: rotateZ(-10deg) translateY(5px); }
    .card:nth-child(2) { transform: rotateZ(-5deg); }
    .card:nth-child(3) { transform: rotateZ(0deg); }
    .card:nth-child(4) { transform: rotateZ(5deg); }
    .card:nth-child(5) { transform: rotateZ(10deg) translateY(5px); }

    .card:hover { 
      transform: rotateZ(0deg) translateY(-20px) translateZ(40px) scale(1.05); 
      box-shadow: 0 15px 30px rgba(0,0,0,0.9), 0 0 25px #4facfe; z-index: 25;
      border-color: #fff;
    }
    .card.selected { 
      transform: rotateZ(0deg) translateY(-30px) translateZ(60px) scale(1.1); 
      border-color: #ffeb3b; box-shadow: 0 0 30px #ffeb3b; z-index: 26;
    }
    
    .card-icon { font-size: 32px; margin-bottom: 5px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.8)); }
    .card-name { font-size: 9px; font-weight: bold; text-align: center; line-height: 1.1; padding: 0 5px;}

    /* ПРИЦЕЛ */
    .target-overlay {
      position: absolute; width: 75px; height: 75px; border: 3px dashed #ff0055; border-radius: 50%;
      display: none; z-index: 15; cursor: crosshair; animation: pulse 0.8s infinite alternate; 
      top: -5px; left: -5px; transform: translateZ(50px);
    }
    @keyframes pulse { from { transform: scale(1) translateZ(50px); opacity: 0.7; } to { transform: scale(1.2) translateZ(50px); opacity: 1; } }

    /* АНИМАЦИИ УРОНА */
    .floating-text {
      position: absolute; font-size: 26px; font-weight: 900; pointer-events: none;
      animation: floatUp 1.5s ease-out forwards; z-index: 100; text-shadow: 2px 2px 0 #000, 0 0 15px currentColor;
      transform: translateZ(60px);
    }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.5) translateZ(60px); opacity: 0; } 20% { opacity: 1; transform: translateY(-20px) scale(1.2) translateZ(60px); } 100% { transform: translateY(-60px) scale(1) translateZ(60px); opacity: 0; } }

    /* ЛОГ ИГРЫ */
    .game-log {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%) translateZ(50px);
      width: 90%; max-width: 320px; text-align: center; font-size: 13px; color: #4facfe; font-weight: bold; z-index: 10;
      text-shadow: 1px 1px 4px #000; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 10px;
      border: 1px solid rgba(79, 172, 254, 0.5); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>🃏 Битва Мемов</h1>
    <p>Медленная тактика за 3D-столом</p>
    <button class="menu-btn" onclick="startGame(2)">Дуэль (1 на 1)</button>
    <button class="menu-btn" onclick="startGame(3)">Тройная угроза (1 на 2)</button>
    <button class="menu-btn" onclick="startGame(4)">Королевская битва (1 на 3)</button>
  </div>

  <div id="game-container">
    <div class="lamp-container">
      <div class="lamp-wire"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div>
    </div>

    <div class="game-log" id="game-log">Нажми на карту, чтобы прочитать описание</div>

    <div class="table-container">
      <div class="table-side"></div>
      <div class="table-top">
        <div class="table-text" id="table-text">Ожидание...</div>
        
        <div class="center-deck">🎴</div>
        <div class="played-cards-area" id="played-cards-area"></div>

      </div>
    </div>

    <div class="seat seat-top" id="seat-1"></div>
    <div class="seat seat-left" id="seat-2"></div>
    <div class="seat seat-right" id="seat-3"></div>
    <div class="seat seat-bottom" id="seat-player"></div>
    
    <div class="card-info-panel" id="card-info">
      <div class="info-title" id="info-title">Название</div>
      <div class="info-desc" id="info-desc">Описание карты</div>
      <div class="info-hint" id="info-hint"></div>
    </div>

    <div class="player-hand" id="player-hand"></div>
  </div>

  <script>
    const CARDS_LIB = [
      { id: 'rock', name: 'Скала', icon: '🗿', dmg: 0, heal: 0, shield: 15, desc: 'Дает 15 брони.' },
      { id: 'frog', name: 'Жаба', icon: '🐸', dmg: 5, poison: 3, desc: '5 урона + яд.' },
      { id: 'pizza', name: 'Пицца', icon: '🍕', dmg: 0, heal: 15, desc: 'Лечит 15 HP.' },
      { id: 'poop', name: 'Какашка', icon: '💩', dmg: 15, selfDmg: 5, desc: '15 урона, 5 себе.' },
      { id: 'ufo', name: 'НЛО', icon: '👽', dmg: 10, heal: 10, desc: '10 урона, лечит 10.' },
      { id: 'cat', name: 'Кот', icon: '🐱', dmg: 10, desc: '10 урона. Лечит при HP<20.' },
      { id: 'bomb', name: 'Бомба', icon: '💣', dmg: 30, desc: '30 урона.' },
      { id: 'stun', name: 'ДПС (Стан)', icon: '⚡', stun: true, desc: 'Пропуск хода врага.' },
      { id: 'skull', name: 'Череп', icon: '💀', dmg: 20, desc: '20 урона (игнор брони).' },
      { id: 'doge', name: 'Доге', icon: '🐕', dmg: 12, desc: '12 урона.' },
      { id: 'brain', name: 'Мозг', icon: '🧠', heal: 5, desc: 'Лечит 5, дает карту.' }
    ];

    let players = [];
    let currentTurn = 0;
    let isTargeting = false;
    let selectedCardIndex = -1;
    let playerHand = [];

    function startGame(numPlayers) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      
      players = [];
      players.push({ id: 'you', name: 'Ты', icon: '😎', hp: 50, maxHp: 50, shield: 0, isBot: false, alive: true, status: [] });
      
      const botIcons = ['😈', '🤖', '👽'];
      const botSeats = ['seat-1', 'seat-2', 'seat-3'];
      
      for (let i = 0; i < numPlayers - 1; i++) {
        players.push({ id: 'bot'+i, name: 'Бот '+(i+1), icon: botIcons[i], hp: 50, maxHp: 50, shield: 0, isBot: true, alive: true, status: [] });
        document.getElementById(botSeats[i]).style.display = 'flex';
      }
      
      for (let i = numPlayers - 1; i < 3; i++) {
        document.getElementById(botSeats[i]).style.display = 'none';
      }

      currentTurn = 0;
      playerHand = [];
      drawCards(4);
      updateUI();
      nextTurn();
    }

    function drawCards(count) {
      for (let i = 0; i < count; i++) {
        if (playerHand.length < 6) { 
          const randomCard = CARDS_LIB[Math.floor(Math.random() * CARDS_LIB.length)];
          playerHand.push({ ...randomCard, uid: Math.random() });
        }
      }
      renderHand();
    }

    function renderHand() {
      const handEl = document.getElementById('player-hand');
      handEl.innerHTML = '';
      
      if (playerHand.length === 0) {
         drawCards(1);
         return;
      }

      playerHand.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card' + (index === selectedCardIndex ? ' selected' : '');
        cardEl.innerHTML = `
          <div class="card-icon">${card.icon}</div>
          <div class="card-name">${card.name}</div>
        `;
        cardEl.onclick = () => selectCard(index);
        handEl.appendChild(cardEl);
      });
    }

    function selectCard(index) {
      if (currentTurn !== 0) return; 
      if (players[0].status.includes('stun')) {
        log("Ты в стане и не можешь ходить!");
        return;
      }

      const card = playerHand[index];

      if (selectedCardIndex === index) {
        if (card.dmg > 0 || card.stun) {
          log("Выбери цель для атаки (нажми на прицел)!");
        } else {
          applyCard(card, 0, index); 
        }
        return;
      }

      selectedCardIndex = index;
      renderHand();
      
      document.getElementById('info-title').innerText = card.icon + ' ' + card.name;
      document.getElementById('info-desc').innerText = card.desc;
      document.getElementById('card-info').classList.add('active');

      if (card.dmg > 0 || card.stun) {
        document.getElementById('info-hint').innerText = "Нажми на прицел над врагом.";
        isTargeting = true;
        document.getElementById('table-text').innerText = "Выбери цель!";
        showTargets(true);
      } else {
        document.getElementById('info-hint').innerText = "Нажми на карту ЕЩЕ РАЗ.";
        isTargeting = false;
        showTargets(false);
      }
    }

    function hideCardInfo() {
      document.getElementById('card-info').classList.remove('active');
      selectedCardIndex = -1;
      isTargeting = false;
      showTargets(false);
      renderHand();
    }

    function showTargets(show) {
      players.forEach((p, index) => {
        if (p.isBot && p.alive) {
          const seat = document.getElementById('seat-' + (index === 1 ? '1' : index === 2 ? '2' : '3'));
          let overlay = seat.querySelector('.target-overlay');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'target-overlay';
            seat.appendChild(overlay);
            overlay.onclick = (e) => {
              e.stopPropagation();
              if (isTargeting) applyCard(playerHand[selectedCardIndex], index, selectedCardIndex);
            };
          }
          overlay.style.display = show ? 'block' : 'none';
        }
      });
    }

    function showPlayedCard(card) {
      const area = document.getElementById('played-cards-area');
      const cardEl = document.createElement('div');
      cardEl.className = 'played-card-anim';
      cardEl.innerHTML = card.icon;
      area.appendChild(cardEl);
      setTimeout(() => cardEl.remove(), 2500);
    }

    function applyCard(card, targetIndex, handIndex) {
      if (!isTargeting && (card.dmg > 0 || card.stun)) return; 

      hideCardInfo(); 
      
      const attacker = players[0];
      const target = players[targetIndex];

      log(`Ты играешь ${card.name} против ${target.name}!`);
      showPlayedCard(card);

      if (card.heal) {
        attacker.hp = Math.min(attacker.maxHp, attacker.hp + card.heal);
        showFloatText(attacker, `+${card.heal}`, '#00ff00');
      }
      if (card.shield) {
        attacker.shield += card.shield;
        showFloatText(attacker, `🛡️ +${card.shield}`, '#4facfe');
      }
      if (card.dmg) {
        let damage = card.dmg;
        if (target.shield > 0 && card.id !== 'skull') {
          const absorbed = Math.min(target.shield, damage);
          target.shield -= absorbed;
          damage -= absorbed;
          showFloatText(target, `🛡️ -${absorbed}`, '#4facfe');
        }
        target.hp -= damage;
        if (damage > 0) showFloatText(target, `-${damage}`, '#ff0055');
      }
      if (card.selfDmg) {
        attacker.hp -= card.selfDmg;
        showFloatText(attacker, `-${card.selfDmg}`, '#ff0055');
      }
      if (card.id === 'cat' && attacker.hp < 20) {
        attacker.hp += 15;
        showFloatText(attacker, `+15`, '#00ff00');
      }
      if (card.stun) {
        target.status.push('stun');
        showFloatText(target, `💫 СТАН`, '#ffeb3b');
      }
      if (card.poison) {
        target.status.push('poison');
      }
      if (card.id === 'brain') {
        drawCards(1);
      }

      playerHand.splice(handIndex, 1);
      drawCards(1);
      renderHand();

      checkDeaths();
      updateUI();
      
      if (!checkGameOver()) {
        setTimeout(nextTurn, 2500); // Медленный ход
      }
    }

    function nextTurn() {
      if (checkGameOver()) return;

      currentTurn++;
      if (currentTurn >= players.length) currentTurn = 0;
      
      if (!players[currentTurn].alive) {
        nextTurn();
        return;
      }

      updateUI();

      if (currentTurn === 0) {
        document.getElementById('table-text').innerText = "Твой ход";
        document.getElementById('info-hint').innerText = "Нажми на карту.";
        
        if (players[0].status.includes('stun')) {
           log("Ты пропускаешь ход из-за стана!");
           players[0].status = players[0].status.filter(s => s !== 'stun');
           setTimeout(nextTurn, 2500);
           return;
        }
        if (players[0].status.includes('poison')) {
           players[0].hp -= 5;
           showFloatText(players[0], `-5`, '#a020f0');
           checkDeaths();
        }

      } else {
        document.getElementById('table-text').innerText = `Ход ${players[currentTurn].name}...`;
        setTimeout(() => botPlay(currentTurn), 2000);
      }
    }

    function botPlay(index) {
      const bot = players[index];
      
      if (bot.status.includes('stun')) {
        log(`${bot.name} пропускает ход (стан)!`);
        bot.status = bot.status.filter(s => s !== 'stun');
        setTimeout(nextTurn, 2500);
        return;
      }
      if (bot.status.includes('poison')) {
        bot.hp -= 5;
        showFloatText(bot, `-5`, '#a020f0');
        checkDeaths();
        if (!bot.alive) { setTimeout(nextTurn, 2500); return; }
      }

      let cardToPlay = null;
      if (bot.hp < 20 && Math.random() < 0.6) cardToPlay = CARDS_LIB.find(c => c.id === 'pizza');
      if (!cardToPlay) {
         const attackCards = CARDS_LIB.filter(c => c.dmg > 0 || c.stun);
         cardToPlay = attackCards[Math.floor(Math.random() * attackCards.length)];
      }

      // ИСПРАВЛЕННЫЙ ИИ: Боты бьют АБСОЛЮТНО ЛЮБОГО противника (не только тебя)
      const validTargets = players.filter(p => p.id !== bot.id && p.alive);
      let target = validTargets[Math.floor(Math.random() * validTargets.length)];
      
      if (!target) { setTimeout(nextTurn, 2500); return; }

      log(`${bot.name} играет ${cardToPlay.name} против ${target.name}!`);
      showPlayedCard(cardToPlay);

      if (cardToPlay.heal) {
        bot.hp = Math.min(bot.maxHp, bot.hp + cardToPlay.heal);
        showFloatText(bot, `+${cardToPlay.heal}`, '#00ff00');
      }
      if (cardToPlay.shield) {
        bot.shield += cardToPlay.shield;
        showFloatText(bot, `🛡️ +${cardToPlay.shield}`, '#4facfe');
      }
      if (cardToPlay.dmg) {
        let dmg = cardToPlay.dmg;
        if (target.shield > 0 && cardToPlay.id !== 'skull') {
           const abs = Math.min(target.shield, dmg);
           target.shield -= abs;
           dmg -= abs;
           showFloatText(target, `🛡️ -${abs}`, '#4facfe');
        }
        target.hp -= dmg;
        if (dmg > 0) showFloatText(target, `-${dmg}`, '#ff0055');
      }
      if (cardToPlay.stun) {
        target.status.push('stun');
        showFloatText(target, `💫 СТАН`, '#ffeb3b');
      }

      checkDeaths();
      updateUI();

      if (!checkGameOver()) {
        setTimeout(nextTurn, 2500);
      }
    }

    function checkDeaths() {
      players.forEach(p => {
        if (p.hp <= 0 && p.alive) {
          p.hp = 0;
          p.alive = false;
          log(`💀 ${p.name} уничтожен!`);
        }
      });
    }

    function checkGameOver() {
      const aliveBots = players.filter(p => p.alive && p.isBot).length;
      const playerAlive = players[0].alive;

      if (!playerAlive) {
        document.getElementById('table-text').innerText = "ТЫ ПРОИГРАЛ 💀";
        document.getElementById('table-text').style.color = "#ff0055";
        return true;
      }
      if (aliveBots === 0) {
        document.getElementById('table-text').innerText = "ТЫ ПОБЕДИЛ! 👑";
        document.getElementById('table-text').style.color = "#ffd700";
        return true;
      }
      return false;
    }

    function updateUI() {
      players.forEach((p, index) => {
        let seatId = index === 0 ? 'seat-player' : 'seat-' + index;
        const seatEl = document.getElementById(seatId);
        if (!seatEl) return;

        let deckHTML = '';
        if (p.isBot && p.alive) {
           deckHTML = `<div class="bot-deck"><div class="bot-card"></div><div class="bot-card"></div><div class="bot-card"></div><div class="bot-card"></div></div>`;
        }

        seatEl.innerHTML = `
          <div class="avatar-box ${p.isBot ? 'enemy' : ''} ${p.status.includes('stun') ? 'stunned' : ''} ${!p.alive ? 'dead' : ''}">
            ${p.icon}
          </div>
          <div class="hp-bar-container">
            <div class="hp-fill" style="width: ${(p.hp/p.maxHp)*100}%; background: ${p.hp > 20 ? '#00ff00' : '#ff0055'}"></div>
            <div class="hp-text">${p.hp} HP ${p.shield > 0 ? '🛡️'+p.shield : ''}</div>
          </div>
          ${deckHTML}
        `;
      });
    }

    function showFloatText(target, text, color) {
      const index = players.indexOf(target);
      let seatId = index === 0 ? 'seat-player' : 'seat-' + index;
      const seat = document.getElementById(seatId);
      if (!seat) return;

      const float = document.createElement('div');
      float.className = 'floating-text';
      float.style.color = color;
      float.innerText = text;
      
      seat.appendChild(float);
      setTimeout(() => float.remove(), 1500);
    }

    function log(msg) {
      document.getElementById('game-log').innerText = msg;
    }
  </script>
</body>
</html>
