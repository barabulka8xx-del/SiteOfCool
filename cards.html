<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва Мемов 🃏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* --- ГЛАВНОЕ МЕНЮ --- */
    #menu {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1a1a24 0%, #000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
    }
    #menu h1 { font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0055; color: #fff; }
    #menu p { color: #aaa; margin-bottom: 30px; font-size: 14px; }
    .menu-btn {
      background: rgba(255,255,255,0.05); border: 2px solid #4facfe; color: white;
      padding: 15px 30px; margin: 10px; border-radius: 12px; font-size: 18px; font-weight: bold;
      cursor: pointer; width: 250px; transition: 0.3s; backdrop-filter: blur(5px);
    }
    .menu-btn:hover { background: #4facfe; color: #000; box-shadow: 0 0 20px #4facfe; transform: scale(1.05); }

    /* --- ИГРОВОЕ ПОЛЕ --- */
    #game-container {
      width: 100vw; height: 100vh;
      display: none; /* Скрыто до старта */
      position: relative;
    }

    /* ЛАМПА */
    .lamp-container {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .lamp-wire { width: 2px; height: 40px; background: #333; }
    .lamp-shade { width: 60px; height: 30px; background: #222; border-radius: 30px 30px 0 0; border: 2px solid #555; border-bottom: none; }
    .lamp-bulb { width: 20px; height: 10px; background: #ffeb3b; border-radius: 50%; box-shadow: 0 0 20px #ffeb3b, 0 0 60px #ffeb3b; margin-top: -5px; }
    .light-cone {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,235,59,0.1) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%; pointer-events: none; z-index: 1;
    }

    /* СТОЛ */
    .table {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 280px; height: 280px;
      background: radial-gradient(circle, #2a3b42 0%, #111 100%);
      border-radius: 50%; box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,0,0,0.8);
      border: 4px solid #1a1a24; z-index: 2;
    }
    .table-text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 16px; font-weight: bold; color: rgba(255,255,255,0.3);
      text-align: center; pointer-events: none; width: 80%;
    }

    /* ИГРОКИ ЗА СТОЛОМ */
    .seat {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      z-index: 5; transition: 0.3s;
    }
    .seat-top { top: 60px; left: 50%; transform: translateX(-50%); }
    .seat-left { top: 50%; left: 10px; transform: translateY(-50%); }
    .seat-right { top: 50%; right: 10px; transform: translateY(-50%); }
    
    /* Игрок (Ты) */
    .seat-bottom { bottom: 160px; left: 50%; transform: translateX(-50%); }

    .avatar-box {
      position: relative; width: 60px; height: 60px;
      background: #203a43; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; border: 2px solid #4facfe;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.3); margin-bottom: 5px; transition: 0.3s;
    }
    .avatar-box.enemy { border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
    
    .avatar-box.stunned { filter: grayscale(1) brightness(0.5); border-color: #888; }
    .avatar-box.stunned::after { content: '💫'; position: absolute; top: -10px; font-size: 20px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .avatar-box.dead { opacity: 0.3; filter: grayscale(1); border-color: #000; }
    .avatar-box.dead::before { content: '💀'; position: absolute; font-size: 40px; z-index: 2; }

    .hp-bar-container {
      width: 70px; height: 12px; background: #333; border-radius: 6px;
      overflow: hidden; border: 1px solid #555; position: relative;
    }
    .hp-fill { height: 100%; width: 100%; background: #00ff00; transition: width 0.3s, background 0.3s; }
    .hp-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

    /* ТВОИ КАРТЫ (ВНИЗУ) */
    .player-hand {
      position: absolute; bottom: -200px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 20; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .player-hand.active { bottom: 20px; }

    .card {
      width: 80px; height: 120px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 2px solid #4facfe; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(79, 172, 254, 0.2);
      transition: 0.2s; position: relative;
    }
    .card:hover { transform: translateY(-15px); box-shadow: 0 15px 25px rgba(0,0,0,0.6), 0 0 15px #4facfe; }
    .card.selected { transform: translateY(-20px); border-color: #ffeb3b; box-shadow: 0 0 20px #ffeb3b; }
    
    .card-icon { font-size: 32px; margin-bottom: 5px; }
    .card-name { font-size: 10px; font-weight: bold; text-align: center; line-height: 1.1; padding: 0 5px;}
    .card-desc { font-size: 8px; color: #aaa; text-align: center; margin-top: 3px;}

    /* ПРИЦЕЛ ДЛЯ ВЫБОРА ЦЕЛИ */
    .target-overlay {
      position: absolute; width: 70px; height: 70px; border: 3px dashed #ff0055; border-radius: 50%;
      display: none; z-index: 15; cursor: crosshair; animation: pulse 0.8s infinite alternate; top: -5px; left: -5px;
    }
    @keyframes pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.2); opacity: 1; } }

    /* АНИМАЦИИ УРОНА */
    .floating-text {
      position: absolute; font-size: 24px; font-weight: 900; pointer-events: none;
      animation: floatUp 1s ease-out forwards; z-index: 100; text-shadow: 2px 2px 0 #000;
    }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

    /* ЛОГ ИГРЫ */
    .game-log {
      position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
      width: 90%; max-width: 400px; text-align: center; font-size: 13px; color: #4facfe; font-weight: bold; z-index: 10;
      text-shadow: 1px 1px 2px #000; min-height: 40px;
    }
  </style>
</head>
<body>

  <!-- МЕНЮ -->
  <div id="menu">
    <h1>🃏 Битва Мемов</h1>
    <p>Выбери режим игры за столом</p>
    <button class="menu-btn" onclick="startGame(2)">Дуэль (1 на 1)</button>
    <button class="menu-btn" onclick="startGame(3)">Тройная угроза (1 на 2)</button>
    <button class="menu-btn" onclick="startGame(4)">Королевская битва (1 на 3)</button>
  </div>

  <!-- ИГРА -->
  <div id="game-container">
    <div class="lamp-container">
      <div class="lamp-wire"></div>
      <div class="lamp-shade"></div>
      <div class="lamp-bulb"></div>
    </div>
    <div class="light-cone"></div>

    <div class="table">
      <div class="table-text" id="table-text">Ожидание...</div>
    </div>

    <!-- Места (будут заполняться динамически) -->
    <div class="seat seat-top" id="seat-1"></div>
    <div class="seat seat-left" id="seat-2"></div>
    <div class="seat seat-right" id="seat-3"></div>
    
    <div class="seat seat-bottom" id="seat-player"></div>

    <div class="game-log" id="game-log">Выбери карту, чтобы начать...</div>
    <div class="player-hand" id="player-hand"></div>
  </div>

  <script>
    // --- КАРТЫ ---
    const CARDS_LIB = [
      { id: 'rock', name: 'Скала', icon: '🗿', dmg: 0, heal: 0, shield: 15, desc: 'Щит +15' },
      { id: 'frog', name: 'Жаба', icon: '🐸', dmg: 5, poison: 3, desc: '5 урона, яд' },
      { id: 'pizza', name: 'Пицца', icon: '🍕', dmg: 0, heal: 15, desc: 'Лечит 15 HP' },
      { id: 'poop', name: 'Какашка', icon: '💩', dmg: 15, selfDmg: 5, desc: '15 урона, 5 себе' },
      { id: 'ufo', name: 'НЛО', icon: '👽', dmg: 10, heal: 10, desc: '10 урона, лечит 10' },
      { id: 'cat', name: 'Кот', icon: '🐱', dmg: 10, desc: '10 урона (лечит если мало HP)' },
      { id: 'bomb', name: 'Бомба', icon: '💣', dmg: 30, desc: '30 урона' },
      { id: 'stun', name: 'ДПС (Стан)', icon: '⚡', stun: true, desc: 'Пропуск хода врага' },
      { id: 'skull', name: 'Череп', icon: '💀', dmg: 20, desc: '20 урона (игнор щита)' },
      { id: 'doge', name: 'Доге', icon: '🐕', dmg: 12, desc: '12 урона' },
      { id: 'brain', name: 'Мозг', icon: '🧠', heal: 5, desc: 'Лечит 5 и дает +1 карту' }
    ];

    let players = [];
    let currentTurn = 0;
    let gameInterval = null;
    let isTargeting = false;
    let selectedCardIndex = -1;
    let playerHand = [];

    // --- ЗАПУСК ИГРЫ ---
    function startGame(numPlayers) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      
      players = [];
      // Ты
      players.push({ id: 'you', name: 'Ты', icon: '😎', hp: 50, maxHp: 50, shield: 0, isBot: false, alive: true, status: [] });
      
      // Боты
      const botIcons = ['😈', '🤖', '👽'];
      const botSeats = ['seat-1', 'seat-2', 'seat-3'];
      
      for (let i = 0; i < numPlayers - 1; i++) {
        players.push({ id: 'bot'+i, name: 'Бот '+(i+1), icon: botIcons[i], hp: 50, maxHp: 50, shield: 0, isBot: true, alive: true, status: [] });
        document.getElementById(botSeats[i]).style.display = 'flex';
      }
      
      // Прячем лишние места
      for (let i = numPlayers - 1; i < 3; i++) {
        document.getElementById(botSeats[i]).style.display = 'none';
      }

      currentTurn = 0;
      playerHand = [];
      drawCards(4);
      updateUI();
      nextTurn();
    }

    // --- РАЗДАЧА КАРТ ---
    function drawCards(count) {
      for (let i = 0; i < count; i++) {
        if (playerHand.length < 6) { // Максимум 6 карт
          const randomCard = CARDS_LIB[Math.floor(Math.random() * CARDS_LIB.length)];
          playerHand.push({ ...randomCard, uid: Math.random() }); // Уникальный ID
        }
      }
      renderHand();
    }

    // --- ОТРИСОВКА РУКИ ---
    function renderHand() {
      const handEl = document.getElementById('player-hand');
      handEl.innerHTML = '';
      
      playerHand.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card' + (index === selectedCardIndex ? ' selected' : '');
        cardEl.innerHTML = `
          <div class="card-icon">${card.icon}</div>
          <div class="card-name">${card.name}</div>
          <div class="card-desc">${card.desc}</div>
        `;
        cardEl.onclick = () => selectCard(index);
        handEl.appendChild(cardEl);
      });
    }

    // --- ВЫБОР КАРТЫ И ЦЕЛИ ---
    function selectCard(index) {
      if (currentTurn !== 0) return; // Ход не твой
      if (players[0].status.includes('stun')) {
        log("Ты в стане и не можешь ходить!");
        return;
      }

      selectedCardIndex = index;
      const card = playerHand[index];
      renderHand();

      // Если карта атакующая или станящая - нужно выбрать цель
      if (card.dmg > 0 || card.stun) {
        isTargeting = true;
        document.getElementById('table-text').innerText = "Выбери цель!";
        showTargets(true);
      } else {
        // Если лечилка/щит - применяем на себя
        applyCard(card, 0, index);
      }
    }

    function showTargets(show) {
      players.forEach((p, index) => {
        if (p.isBot && p.alive) {
          const seat = document.getElementById('seat-' + (index === 1 ? '1' : index === 2 ? '2' : '3'));
          let overlay = seat.querySelector('.target-overlay');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'target-overlay';
            seat.appendChild(overlay);
            overlay.onclick = (e) => {
              e.stopPropagation();
              if (isTargeting) applyCard(playerHand[selectedCardIndex], index, selectedCardIndex);
            };
          }
          overlay.style.display = show ? 'block' : 'none';
        }
      });
    }

    // --- ПРИМЕНЕНИЕ КАРТЫ ---
    function applyCard(card, targetIndex, handIndex) {
      if (!isTargeting && (card.dmg > 0 || card.stun)) return; // Защита

      isTargeting = false;
      showTargets(false);
      selectedCardIndex = -1;
      
      const attacker = players[0];
      const target = players[targetIndex];

      // Анимация полета карты
      log(`Ты играешь ${card.name} против ${target.name}!`);

      // Логика карты
      if (card.heal) {
        attacker.hp = Math.min(attacker.maxHp, attacker.hp + card.heal);
        showFloatText(attacker, `+${card.heal}`, '#00ff00');
      }
      
      if (card.shield) {
        attacker.shield += card.shield;
        showFloatText(attacker, `🛡️ +${card.shield}`, '#4facfe');
      }

      if (card.dmg) {
        let damage = card.dmg;
        if (target.shield > 0 && card.id !== 'skull') {
          const absorbed = Math.min(target.shield, damage);
          target.shield -= absorbed;
          damage -= absorbed;
          showFloatText(target, `🛡️ -${absorbed}`, '#4facfe');
        }
        target.hp -= damage;
        if (damage > 0) showFloatText(target, `-${damage}`, '#ff0055');
      }

      if (card.selfDmg) {
        attacker.hp -= card.selfDmg;
        showFloatText(attacker, `-${card.selfDmg}`, '#ff0055');
      }

      if (card.id === 'cat' && attacker.hp < 20) {
        attacker.hp += 15;
        showFloatText(attacker, `+15`, '#00ff00');
      }

      if (card.stun) {
        target.status.push('stun');
        showFloatText(target, `💫 СТАН`, '#ffeb3b');
      }

      if (card.poison) {
        target.status.push('poison');
      }

      if (card.id === 'brain') {
        drawCards(1);
      }

      // Удаляем карту из руки
      playerHand.splice(handIndex, 1);
      drawCards(1);
      renderHand();

      checkDeaths();
      updateUI();
      
      if (!checkGameOver()) {
        setTimeout(nextTurn, 1000);
      }
    }

    // --- ХОД БОТА ---
    function nextTurn() {
      if (checkGameOver()) return;

      currentTurn++;
      if (currentTurn >= players.length) currentTurn = 0;
      
      // Пропускаем мертвых
      if (!players[currentTurn].alive) {
        nextTurn();
        return;
      }

      updateUI();

      // Твой ход
      if (currentTurn === 0) {
        document.getElementById('player-hand').classList.add('active');
        document.getElementById('table-text').innerText = "Твой ход";
        
        // Обработка статусов игрока
        if (players[0].status.includes('stun')) {
           log("Ты пропускаешь ход из-за стана!");
           players[0].status = players[0].status.filter(s => s !== 'stun');
           document.getElementById('player-hand').classList.remove('active');
           setTimeout(nextTurn, 1500);
           return;
        }
        if (players[0].status.includes('poison')) {
           players[0].hp -= 5;
           showFloatText(players[0], `-5`, '#a020f0');
           checkDeaths();
        }

      } else {
        // Ход бота
        document.getElementById('player-hand').classList.remove('active');
        document.getElementById('table-text').innerText = `Ход ${players[currentTurn].name}...`;
        
        setTimeout(() => botPlay(currentTurn), 1000);
      }
    }

    function botPlay(index) {
      const bot = players[index];
      
      // Проверка на стан/яд
      if (bot.status.includes('stun')) {
        log(`${bot.name} пропускает ход (стан)!`);
        bot.status = bot.status.filter(s => s !== 'stun');
        setTimeout(nextTurn, 1000);
        return;
      }
      if (bot.status.includes('poison')) {
        bot.hp -= 5;
        showFloatText(bot, `-5`, '#a020f0');
        checkDeaths();
        if (!bot.alive) { setTimeout(nextTurn, 1000); return; }
      }

      // Логика ИИ
      let cardToPlay = null;
      
      // Если мало HP, ищем пиццу (шанс 50%)
      if (bot.hp < 20 && Math.random() < 0.6) {
         cardToPlay = CARDS_LIB.find(c => c.id === 'pizza');
      } 
      // Иначе атакуем
      if (!cardToPlay) {
         const attackCards = CARDS_LIB.filter(c => c.dmg > 0 || c.stun);
         cardToPlay = attackCards[Math.floor(Math.random() * attackCards.length)];
      }

      // Выбираем цель (боты могут бить друг друга!)
      const validTargets = players.filter(p => p.id !== bot.id && p.alive);
      // Боты чаще бьют игрока (60%), чем друг друга (40%)
      let target = null;
      if (Math.random() < 0.6 && players[0].alive) {
        target = players[0];
      } else {
        target = validTargets[Math.floor(Math.random() * validTargets.length)];
      }

      if (!target) { setTimeout(nextTurn, 1000); return; }

      log(`${bot.name} играет ${cardToPlay.name} против ${target.name}!`);

      // Применяем карту бота
      if (cardToPlay.heal) {
        bot.hp = Math.min(bot.maxHp, bot.hp + cardToPlay.heal);
        showFloatText(bot, `+${cardToPlay.heal}`, '#00ff00');
      }
      if (cardToPlay.shield) {
        bot.shield += cardToPlay.shield;
        showFloatText(bot, `🛡️ +${cardToPlay.shield}`, '#4facfe');
      }
      if (cardToPlay.dmg) {
        let dmg = cardToPlay.dmg;
        if (target.shield > 0 && cardToPlay.id !== 'skull') {
           const abs = Math.min(target.shield, dmg);
           target.shield -= abs;
           dmg -= abs;
           showFloatText(target, `🛡️ -${abs}`, '#4facfe');
        }
        target.hp -= dmg;
        if (dmg > 0) showFloatText(target, `-${dmg}`, '#ff0055');
      }
      if (cardToPlay.stun) {
        target.status.push('stun');
        showFloatText(target, `💫 СТАН`, '#ffeb3b');
      }

      checkDeaths();
      updateUI();

      if (!checkGameOver()) {
        setTimeout(nextTurn, 1500);
      }
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ---
    function checkDeaths() {
      players.forEach(p => {
        if (p.hp <= 0 && p.alive) {
          p.hp = 0;
          p.alive = false;
          log(`💀 ${p.name} уничтожен!`);
        }
      });
    }

    function checkGameOver() {
      const aliveBots = players.filter(p => p.alive && p.isBot).length;
      const playerAlive = players[0].alive;

      if (!playerAlive) {
        document.getElementById('table-text').innerText = "ТЫ ПРОИГРАЛ 💀";
        document.getElementById('table-text').style.color = "#ff0055";
        return true;
      }
      if (aliveBots === 0) {
        document.getElementById('table-text').innerText = "ТЫ ПОБЕДИЛ! 👑";
        document.getElementById('table-text').style.color = "#ffd700";
        return true;
      }
      return false;
    }

    function updateUI() {
      players.forEach((p, index) => {
        let seatId = '';
        if (index === 0) seatId = 'seat-player';
        else if (index === 1) seatId = 'seat-1';
        else if (index === 2) seatId = 'seat-2';
        else if (index === 3) seatId = 'seat-3';

        const seatEl = document.getElementById(seatId);
        if (!seatEl) return;

        // Убираем старые статы и рисуем новые
        seatEl.innerHTML = `
          <div class="avatar-box ${p.isBot ? 'enemy' : ''} ${p.status.includes('stun') ? 'stunned' : ''} ${!p.alive ? 'dead' : ''}">
            ${p.icon}
          </div>
          <div class="hp-bar-container">
            <div class="hp-fill" style="width: ${(p.hp/p.maxHp)*100}%; background: ${p.hp > 20 ? '#00ff00' : '#ff0055'}"></div>
            <div class="hp-text">${p.hp} HP ${p.shield > 0 ? '🛡️' + p.shield : ''}</div>
          </div>
        `;
      });
    }

    function showFloatText(target, text, color) {
      const index = players.indexOf(target);
      let seatId = index === 0 ? 'seat-player' : 'seat-' + index;
      const seat = document.getElementById(seatId);
      if (!seat) return;

      const float = document.createElement('div');
      float.className = 'floating-text';
      float.style.color = color;
      float.innerText = text;
      
      // Позиционируем чуть выше аватара
      seat.appendChild(float);
      setTimeout(() => float.remove(), 1000);
    }

    function log(msg) {
      document.getElementById('game-log').innerText = msg;
    }
  </script>
</body>
</html>
