<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Генератор Отмазок 🗣️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #f4ecd8;
      background-image: 
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 30px 20px;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 5px 5px 0px #333;
      width: 100%;
      max-width: 500px;
      text-align: center;
      position: relative;
    }

    .stamp {
      position: absolute;
      top: 10px; right: 10px;
      border: 3px solid #d32f2f;
      color: #d32f2f;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      transform: rotate(15deg);
      opacity: 0.7;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      text-transform: uppercase;
      border-bottom: 2px dashed #333;
      padding-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: none;
      border: 2px solid #333;
      padding: 8px 12px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      border-radius: 4px;
    }

    .cat-btn.active {
      background: #333;
      color: #fff;
    }

    .excuse-box {
      background: #fdfcf9;
      border: 2px dashed #555;
      padding: 20px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 18px;
      line-height: 1.5;
      position: relative;
    }

    .generate-btn {
      background: #ffeb3b;
      border: 2px solid #333;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      box-shadow: 3px 3px 0px #333;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .generate-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px #333;
    }

    .copy-btn {
      background: none;
      border: none;
      text-decoration: underline;
      color: #555;
      margin-top: 15px;
      cursor: pointer;
      font-family: inherit;
      display: none;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="stamp">Официально</div>
    <h1>Генератор Отмазок</h1>
    <div class="subtitle">Спасаем твою репутацию с 2026 года</div>

    <div class="categories">
      <button class="cat-btn active" data-cat="work">💼 Работа</button>
      <button class="cat-btn" data-cat="study">📚 Учеба</button>
      <button class="cat-btn" data-cat="friends">🍻 Друзья</button>
    </div>

    <div class="excuse-box" id="excuse-text">
      Нажми на кнопку ниже, чтобы получить железобетонную отмазку...
    </div>

    <button class="generate-btn" id="gen-btn">Сгенерировать отмазку 🎲</button>
    <button class="copy-btn" id="copy-btn">📋 Скопировать текст</button>
  </div>

        "Я пытался найти свой кошелек, но нашел только старые носки.",
        "Мне дорогу перешел черный кот, и я решил не рисковать.",
        "Я пытался выйти, но на лестничной клетке играли в шахматы два кота.",
        "Я ждал доставку нового кресла, чтобы в нем сидеть, но курьер заблудился в лесу.",
        "Я пытался дозвониться до тебя, но мой телефон превратился в тыкву.",
        "Я опоздал, потому что мой будильник прозвенел на частоте летучих мышей.",
        "Я пытался собраться, но случайно уснул в обнимку с принтером.",

    let currentCategory = 'work';
    const excuseText = document.getElementById('excuse-text');
    const genBtn = document.getElementById('gen-btn');
    const copyBtn = document.getElementById('copy-btn');
    const catBtns = document.querySelectorAll('.cat-btn');

    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
      });
    });

    genBtn.addEventListener('click', () => {
      const list = excuses[currentCategory];
      const randomExcuse = list[Math.floor(Math.random() * list.length)];
      
      excuseText.textContent = randomExcuse;
      excuseText.style.animation = 'none';
      excuseText.offsetHeight;
      excuseText.style.animation = 'typing 1s steps(40, end)';
      
      copyBtn.style.display = 'inline-block';
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(excuseText.textContent).then(() => {
        copyBtn.textContent = "✅ Скопировано!";
        setTimeout(() => { copyBtn.textContent = "📋 Скопировать текст"; }, 2000);
      });
    });
  </script>
</body>
</html>
