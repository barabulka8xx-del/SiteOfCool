<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🚀Наши Проекты🚀 | Генератор Отмазок</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #f4ecd8;
      background-image: 
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Экран загрузки/ошибки */
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #f4ecd8; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .loader { border: 4px solid #ccc; border-top: 4px solid #333; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error-msg { color: #d32f2f; font-size: 16px; font-weight: bold; display: none; margin-bottom: 15px; }
    .btn-back { background: #333; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 14px; }

    .container {
      background: #fff;
      padding: 30px 20px;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 5px 5px 0px #333;
      width: 100%;
      max-width: 500px;
      text-align: center;
      position: relative;
      display: none;
    }

    .stamp {
      position: absolute;
      top: 10px; right: 10px;
      border: 3px solid #d32f2f;
      color: #d32f2f;
      padding: 5px 10px;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      transform: rotate(15deg);
      opacity: 0.7;
    }

    h1 { font-size: 22px; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px dashed #333; padding-bottom: 10px; }

    /* Счетчик */
    .stats-box { font-size: 13px; color: #666; margin-bottom: 15px; text-align: center; }
    .stats-box span { font-weight: bold; color: #d32f2f; font-size: 16px; }

    .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

    .cat-btn {
      background: none; border: 2px solid #333; padding: 8px 12px;
      font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s; border-radius: 4px;
    }
    .cat-btn.active { background: #333; color: #fff; }

    .excuse-box {
      background: #fdfcf9; border: 2px dashed #555; padding: 20px; min-height: 120px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
      font-size: 18px; line-height: 1.5; position: relative;
    }

    .generate-btn {
      background: #ffeb3b; border: 2px solid #333; padding: 15px 20px;
      font-size: 18px; font-weight: bold; font-family: inherit; cursor: pointer;
      width: 100%; box-shadow: 3px 3px 0px #333; transition: transform 0.1s, box-shadow 0.1s;
    }
    .generate-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #333; }

    .copy-btn {
      background: none; border: none; text-decoration: underline; color: #555;
      margin-top: 15px; cursor: pointer; font-family: inherit; display: none;
    }

    @keyframes typing { from { width: 0; } to { width: 100%; } }
  </style>

    const excuseText = document.getElementById('excuse-text');
    const genBtn = document.getElementById('gen-btn');
    const copyBtn = document.getElementById('copy-btn');
    const catBtns = document.querySelectorAll('.cat-btn');
    const countDisplay = document.getElementById('excuse-count');

    // --- ЗАГРУЗКА ---
    async function initGame() {
        if (!token) { showError(); return; }

        try {
            const res = await fetch(`${API_URL}/game/load/${GAME_ID}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401 || res.status === 403) { showError(); return; }
            
            const data = await res.json();
            totalGenerated = data.totalGenerated || 0;
            
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            countDisplay.textContent = totalGenerated;

        } catch (error) {
            showError("Ошибка соединения с сервером.");
        }
    }

    function showError(text) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        if (text) document.getElementById('error-msg').innerHTML += `<br><span style="font-size:12px; color:#666;">${text}</span>`;
        document.getElementById('btn-back').style.display = 'inline-block';
    }

    async function saveGameToServer() {
        if (!token) return;
        try {
            await fetch(`${API_URL}/game/save/${GAME_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ totalGenerated: totalGenerated })
            });
        } catch (e) {}
    }

    // --- ЛОГИКА ИГРЫ ---
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
      });
    });

    genBtn.addEventListener('click', () => {
      const list = excuses[currentCategory];
      const randomExcuse = list[Math.floor(Math.random() * list.length)];
      
      excuseText.textContent = randomExcuse;
      excuseText.style.animation = 'none';
      excuseText.offsetHeight;
      excuseText.style.animation = 'typing 1s steps(40, end)';
      
      copyBtn.style.display = 'inline-block';

      // Увеличиваем счетчик и сохраняем
      totalGenerated++;
      countDisplay.textContent = totalGenerated;
      saveGameToServer();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(excuseText.textContent).then(() => {
        copyBtn.textContent = "✅ Скопировано!";
        setTimeout(() => { copyBtn.textContent = "📋 Скопировать текст"; }, 2000);
      });
    });

    window.onload = initGame;

  </html>
